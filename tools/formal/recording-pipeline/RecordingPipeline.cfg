\* Bounds: two capture nodes, an attempt limit of 2 and two segments.
\* run.sh also runs each Break variant.
CONSTANTS
    Nodes = {n1, n2}
    TryLimit = 2
    MaxSegments = 2
    Break = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OnlyLeaseHolderWrites
    NoLeaseSteal
    NoFreshCaptureAfterStop
    SegmentsFrozenAtCompletion
    LostTailIsSalvaged
    EndedEpisodeHasNoUnstoppedCapture
    SyncRecordingHasPipeline

PROPERTIES
    FinalStatesStay
    EndedEpisodeResolves
    EndedEpisodeLeavesNoRunningRecording
