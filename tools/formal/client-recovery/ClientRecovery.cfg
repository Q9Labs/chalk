\* Defaults for one run. run.sh rewrites the bounds and variant constants for each
\* row of `runs`, and swaps the rule list for the row's rule.
CONSTANTS
    MaxEpoch = 1
    MaxSyncFaults = 1
    MaxMediaFaults = 1
    MaxTerminal = 0
    MaxRefreshFaults = 0
    MaxLeaves = 0
    SyncMayDie = FALSE
    RqRule = "overwrite"
    LeaveRule = "current"
    Break = "none"

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LeaveNotUndone
    NoAbandonedRecovery
    EndingIsFinal
    RemovalReported
    RevokedGrantNotLive
