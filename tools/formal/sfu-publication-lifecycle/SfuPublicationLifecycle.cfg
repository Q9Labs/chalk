\* Bounds: two publication slots, three SFU ids. run.sh also runs each Break
\* variant. Deadlock is fine: a stopped client with everything retired and no
\* response in flight is a legitimate quiet end.
CONSTANTS
    Slots = {a, b}
    MaxHandle = 3
    Break = "none"

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    AtMostOneLive
    ConfirmedHasHandle
    HeldKeepsHandle
    ResumedKeepsHandle
    RetiringKeepsCourse
    StopRetiresAll
    RetiredStaysRetired
