\* Bounds: two invite generations. run.sh runs both admission modes and each Break variant.
CONSTANTS
    Mode = "knock"
    MaxGen = 2
    Break = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AdmittedOnlyOnValidInvite
    NoApprovalOfStaleRequest
    DecisionOnce
    NoGrantToInactiveParticipant
    NoNewAccessInArchivedSpace
    ArchiveLeavesNoActiveEpisode
    OpenedRoomTurnsNoOneAway

PROPERTIES
    TerminalStays
