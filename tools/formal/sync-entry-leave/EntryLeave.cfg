\* Bounds: entries 1..3 (the joined entry plus two later sockets) and two
\* consumer nodes. run.sh also runs each Break variant.
CONSTANTS
    MaxEntry = 3
    Consumers = {c1, c2}
    Break = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    LeftOnlyByNewestEntry
    CancelledOnlyByNewerEntry
    LeavingOnlyWhileLeavePending

PROPERTIES
    LeaveEnds
