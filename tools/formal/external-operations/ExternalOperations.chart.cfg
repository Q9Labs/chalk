\* The configuration for the statechart: the role-transition story with the broken
\* variant that sends an expired request again, one node and three control
\* revisions. The model is above the chart budget of 500 states, so the chart draws
\* the paths to the rules that break. Change Break to read another variant's path.
CONSTANTS
    Nodes = {n1}
    Ops = {"rt"}
    MaxAttempts = 2
    MaxRev = 3
    MaxRoleChanges = 1
    Ordered = TRUE
    GrantRefusals = TRUE
    GiveUp = TRUE
    Crashes = TRUE
    Break = "resend_expired"

SPECIFICATION Spec

INVARIANTS
    DemotedPublishesOnlyWhileCleanupRuns
    GivingUpLeavesNothingLive
