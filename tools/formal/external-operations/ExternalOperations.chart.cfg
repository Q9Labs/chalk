\* The configuration for the statechart: the role-transition story on the real
\* code, with the three causes of the findings switched on, one node and three
\* control revisions. The model is above the chart budget of 500 states, so the
\* chart draws the paths to the rules that break.
CONSTANTS
    Nodes = {n1}
    Ops = {"rt"}
    MaxAttempts = 2
    MaxRev = 3
    MaxRoleChanges = 1
    Ordered = TRUE
    GrantRefusals = TRUE
    GiveUp = TRUE
    ResendsExpired = TRUE
    Crashes = TRUE
    Break = "none"

SPECIFICATION Spec

INVARIANTS
    DemotedPublishesOnlyWhileCleanupRuns
    GivingUpLeavesNothingLive
