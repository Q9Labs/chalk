\* The real code, one operation at a time. run.sh rewrites the constants for each
\* run and picks the rules each run checks. Run by hand with Ops = {"rt"} and the
\* rules below to see the three findings. MaxAttempts 2 stands for the 100 of the code.
CONSTANTS
    Nodes = {n1, n2}
    Ops = {"rt"}
    MaxAttempts = 2
    MaxRev = 4
    MaxRoleChanges = 2
    Ordered = TRUE
    GrantRefusals = TRUE
    GiveUp = TRUE
    ResendsExpired = TRUE
    Crashes = TRUE
    Break = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    RemovedNeverPublishes
    DemotedPublishesOnlyWhileCleanupRuns
    GivingUpLeavesNothingLive
    EndedNeverPublishes
    AppliedOnce
