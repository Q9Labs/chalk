\* The real code, one operation at a time. run.sh rewrites the constants for each
\* run and picks the rules each run checks. Set Break to a name from `breaks` to see
\* a rule fail. MaxAttempts 2 stands for the 100 of the code.
CONSTANTS
    Nodes = {n1, n2}
    Ops = {"rt"}
    MaxAttempts = 2
    MaxRev = 4
    MaxRoleChanges = 2
    Ordered = TRUE
    GrantRefusals = TRUE
    GiveUp = TRUE
    Crashes = TRUE
    Break = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    RemovedNeverPublishes
    DemotedPublishesOnlyWhileCleanupRuns
    GivingUpLeavesNothingLive
    EndedNeverPublishes
    AppliedOnce
