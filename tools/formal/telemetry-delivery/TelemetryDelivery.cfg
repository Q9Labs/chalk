\* Bounds: two client sessions (one reload) and no join as another Participant, one record each
\* besides drop records, a queue of one and one fault of any kind. The last session may vanish.
\* TelemetryDeliveryJoin.cfg covers joins. run.sh also runs each Break variant.
CONSTANTS
    MaxBoots = 2
    MaxJoins = 0
    MaxRecords = 1
    Cap = 1
    CheckCap = TRUE
    MaxFaults = 1
    MayVanish = TRUE
    Break = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AckSafe
    SinkCommitted
    TruthfulLedger
    OwnerWrites
    OneRecordPerKey
    SeqNeverReused
    DurableAccounted
    Conservation
    GapsHonest
    CloseHonest
    SuffixKept
    P0Reserved
