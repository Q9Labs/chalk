\* Bounds: two client sessions (one reload), one record each besides drop records, a queue of one and one fault of
\* any kind. The last session may vanish. run.sh also runs each Break variant.
CONSTANTS
    MaxBoots = 2
    MaxRecords = 1
    Cap = 1
    CheckCap = TRUE
    MaxFaults = 1
    MayVanish = TRUE
    Break = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AckSafe
    TruthfulLedger
    OneRecordPerKey
    DurableAccounted
    Conservation
    GapsHonest
    CloseHonest
    P0Reserved
