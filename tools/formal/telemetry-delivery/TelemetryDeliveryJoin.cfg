\* Joins: two client sessions and one join as another Participant, one record per join besides
\* drop records, a queue of one and no fault, so a retired source is closed, named and taken over
\* across a reload. Faults are left to TelemetryDelivery.cfg, which keeps this run to minutes.
CONSTANTS
    MaxBoots = 2
    MaxJoins = 1
    MaxRecords = 1
    Cap = 1
    CheckCap = TRUE
    MaxFaults = 0
    MayVanish = TRUE
    Break = "none"

SPECIFICATION Spec
VIEW JoinSafetyView

INVARIANTS
    TypeOK
    AckSafe
    SinkCommitted
    TruthfulLedger
    OwnerWrites
    OneRecordPerKey
    SeqNeverReused
    DurableAccounted
    Conservation
    GapsHonest
    CloseHonest
    SuffixKept
    P0Reserved
