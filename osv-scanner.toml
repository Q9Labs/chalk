[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"
ignoreUntil = 2026-10-17
reason = "node-forge 1.4.0 has no released fix for this unreviewed low-exponent RSA verification advisory. The locked consumers are Expo CLI and its development code-signing tools, not Chalk's production signature verification; Chalk has no Expo update code-signing configuration. Expo's generated keys use Forge's default exponent 65537 rather than the vulnerable low exponents. Revisit if Forge is used at a production trust boundary, Expo code signing is configured, or upstream ships a fix."

