reason = "braces 3.0.3 has no fixed release for this deep-nesting stack-exhaustion advisory. Every locked path reaches it through Node build and dev tooling (fast-glob and micromatch in q9gate, chokidar under sass via Excalidraw, and the React Native CLI and Jest), which expand only patterns written in this repo. No Chalk service or SDK runtime passes user input to brace expansion, and no browser bundle includes braces. Revisit when braces ships a depth-limited release or a runtime path appears."
