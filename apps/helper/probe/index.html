<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Chalk capture probe</title>
  <style>
    body {
      background: #17323a;
      color: white;
      font: 18px system-ui;
    }
    video {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
    }
  </style>
  <button id="start">Start capture probe</button>
  <pre id="result" role="status"></pre>
  <video id="remote" muted autoplay playsinline></video>
  <script type="module">
    const result = document.querySelector("#result");
    const video = document.querySelector("#remote");
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const button = document.querySelector("#start");
    const sample = () => {
      canvas.width = Math.min(video.videoWidth, 640);
      canvas.height = Math.round((video.videoHeight * canvas.width) / video.videoWidth);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let markerPixels = 0;
      let markerX = 0;
      let markerY = 0;
      let targetPixels = 0;
      for (let offset = 0; offset < pixels.length; offset += 4) {
        const [r, g, b] = pixels.subarray(offset, offset + 3);
        if (r > 205 && b > 205 && g < 64) {
          const pixel = offset / 4;
          markerPixels += 1;
          markerX += (pixel % canvas.width) + 0.5;
          markerY += Math.floor(pixel / canvas.width) + 0.5;
        }
        if (r < 38 && g > 38 && g < 74 && b > 45 && b < 85) targetPixels += 1;
      }
      return {
        markerPixels,
        targetPixels,
        markerCenter: markerPixels ? [markerX / markerPixels / canvas.width, markerY / markerPixels / canvas.height] : null,
      };
    };
    const handoff = new URL(location.href).searchParams.has("handoff");
    if (handoff) button.textContent = "Receive filtered screen track";
    async function receiveFilteredTrack(receive) {
      receive.addTransceiver("video", { direction: "recvonly" });
      const gathered = new Promise((resolve) =>
        receive.addEventListener("icegatheringstatechange", () => {
          if (receive.iceGatheringState === "complete") resolve();
        }),
      );
      await receive.setLocalDescription(await receive.createOffer());
      if (receive.iceGatheringState !== "complete") await gathered;
      const response = await fetch("offer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(receive.localDescription),
      });
      if (!response.ok) throw Error(`Handoff offer was rejected (${response.status})`);
      await receive.setRemoteDescription(await response.json());
    }
    button.onclick = async () => {
      button.disabled = true;
      let track;
      let send;
      let receive;
      try {
        receive = new RTCPeerConnection();
        receive.ontrack = ({ track: remoteTrack }) => {
          video.srcObject = new MediaStream([remoteTrack]);
          void video.play().catch(() => {});
        };
        if (handoff) {
          await receiveFilteredTrack(receive);
        } else {
          const media = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
          [track] = media.getVideoTracks();
          send = new RTCPeerConnection();
          const sendCandidates = [];
          const receiveCandidates = [];
          send.onicecandidate = ({ candidate }) => candidate && sendCandidates.push(candidate);
          receive.onicecandidate = ({ candidate }) => candidate && receiveCandidates.push(candidate);
          send.addTrack(track, media);
          await send.setLocalDescription(await send.createOffer());
          await receive.setRemoteDescription(send.localDescription);
          await receive.setLocalDescription(await receive.createAnswer());
          await send.setRemoteDescription(receive.localDescription);
          send.onicecandidate = ({ candidate }) => candidate && receive.addIceCandidate(candidate).catch(() => {});
          receive.onicecandidate = ({ candidate }) => candidate && send.addIceCandidate(candidate).catch(() => {});
          for (const candidate of sendCandidates) await receive.addIceCandidate(candidate);
          for (const candidate of receiveCandidates) await send.addIceCandidate(candidate);
        }
        if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
          await Promise.race([new Promise((resolve) => video.addEventListener("playing", resolve, { once: true })), new Promise((_, reject) => setTimeout(() => reject(Error("No remote playback")), 10000))]);
        }
        const samples = [];
        for (let frame = 0; frame < 6; frame += 1) {
          await new Promise((resolve) => video.requestVideoFrameCallback(resolve));
          samples.push(sample());
        }
        result.textContent = JSON.stringify(
          {
            browser: navigator.userAgent,
            width: video.videoWidth,
            height: video.videoHeight,
            surface: handoff ? "sck_handoff" : (track.getSettings().displaySurface ?? "not_reported"),
            samples,
          },
          null,
          2,
        );
      } catch (error) {
        const stats = await receive?.getStats();
        const inbound = stats && [...stats.values()].find((report) => report.type === "inbound-rtp" && report.kind === "video");
        result.textContent = JSON.stringify({
          browser: navigator.userAgent,
          error: error.message,
          ice: receive?.iceConnectionState,
          connection: receive?.connectionState,
          packets: inbound?.packetsReceived,
          frames: inbound?.framesDecoded,
        });
      } finally {
        track?.stop();
        send?.close();
        receive?.close();
        button.disabled = false;
      }
    };
  </script>
</html>
