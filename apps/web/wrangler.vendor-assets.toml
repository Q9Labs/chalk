# Independent of Pages snapshots so legacy deploys and native rollbacks keep every digest URL.
name = "chalk-vendor-assets"
main = "server/vendor-assets.ts"
compatibility_date = "2026-07-01"
workers_dev = false
routes = [
  { pattern = "chalkmeet.com/chalk-whiteboard/*", zone_name = "chalkmeet.com" },
  { pattern = "chalkmeet.com/chalk-mathjax/*", zone_name = "chalkmeet.com" },
]

[[r2_buckets]]
binding = "VENDOR_ASSETS"
bucket_name = "chalk-vendor-assets"

[env.nightly]
name = "chalk-vendor-assets-nightly"
routes = [
  { pattern = "nightly.chalkmeet.com/chalk-whiteboard/*", zone_name = "chalkmeet.com" },
  { pattern = "nightly.chalkmeet.com/chalk-mathjax/*", zone_name = "chalkmeet.com" },
]

[[env.nightly.r2_buckets]]
binding = "VENDOR_ASSETS"
bucket_name = "chalk-vendor-assets-nightly"
