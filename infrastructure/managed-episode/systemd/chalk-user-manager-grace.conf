[Service]
# Ubuntu's own drop-in sets 5 seconds, which SIGKILLs the rootless containers on an OS stop or reboot.
# A host stop runs the services one after another: cloudflared, Sync, the API, then Redis. Keep this above the sum of their TimeoutStopSec (115 seconds) plus 15 seconds of overhead.
# validate-runtime checks the sum against the Quadlet templates.
TimeoutStopSec=130
