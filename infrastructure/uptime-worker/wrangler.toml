name = "chalk-uptime-worker"
main = "src/index.ts"
compatibility_date = "2026-07-05"

[triggers]
crons = ["*/5 * * * *"]

[vars]
API_BASE_URL = "https://api.chalkmeet.com"

# Optional HTTPS target overrides: API_MONITOR_BASE_URL, SYNC_BASE_URL.
# Required Worker secret: DISCORD_WEBHOOK_URL.
# Reuse the existing Axiom monitor provisioner's Discord alert channel webhook;
# binding it to this Worker is deployment configuration, not a new channel/secret.
# Optional secret OPS_MANUAL_RUN_TOKEN enables authenticated POST /run.
