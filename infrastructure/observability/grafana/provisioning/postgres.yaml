apiVersion: 1

datasources:
  - name: Chalk Journey Ledger
    type: postgres
    uid: chalk-journey-ledger
    access: proxy
    url: ${CHALK_GRAFANA_LEDGER_URL}
    user: ${CHALK_GRAFANA_LEDGER_USER}
    editable: false
    jsonData:
      database: ${CHALK_GRAFANA_LEDGER_DATABASE}
      postgresVersion: 1800
      sslmode: disable
      timescaledb: false
    secureJsonData:
      password: ${CHALK_GRAFANA_LEDGER_PASSWORD}
