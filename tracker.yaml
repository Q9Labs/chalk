  - id: transcription.mixed_language
    title: Transcripts for mixed-language Recordings
    area: transcription
    state: planned
    summary: >-
      Whisper expects one language per Recording, so speech that switches between languages, such as
      Urdu and English or Arabic and English, transcribes badly. The hard part is finding a model
      that handles it at an acceptable cost.
    priority: P2
    size: M
    remaining:
      - Find a model that transcribes mixed-language speech well, and compare its cost with Whisper.
      - >-
        Choose how Recordings reach it: a per-Space or per-Recording model choice, or automatic
        routing that sends mixed-language audio to it and single-language audio to the cheaper
        model.
    theory: theory.md#product-memory
    code:
      - apps/transcription-dispatcher/src/providers.ts
