  - id: observability_and_operations.performance_budget
    title: Join an Episode faster
    area: observability_and_operations
    state: planned
    summary: >-
      Seeing the other Participant takes about 4 seconds after clicking join. About 2 seconds of
      that is Cloudflare SFU track setup and the browser handshake, which Chalk's code can't
      shorten; only starting them earlier can.
    priority: P1
    size: M
    remaining:
      - Start the arrival request when the visitor shows intent to join, before the click.
      - >-
        Decide whether to open the Cloudflare SFU connection before the click, given consent and
        connection lifetime.
      - Time the API's Cloudflare SFU calls as their own spans so each join stage is visible.
      - Consider pushing chat message bodies over Sync instead of a head signal plus a fetch.
    uncertainty: No change has been tried, so the real saving is unknown.
    theory: theory.md#performance-budget
    code:
