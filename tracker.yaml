      - sdks/typescript/client/src/media/client.ts
      - apps/api/internal/mediaplane/signaling.go
  - id: realtime_sync.reconnect_self_healing
    title: Reconnect heals on rocky networks
    area: realtime_sync
    state: planned
    summary: >-
      Clients rejoin after a page reload, hold offline actions, show a non-blocking reconnecting
      bar, and recover media in about 2.6 seconds after a 30-second cut. The owner's target is
      recovery as fast as possible on every path.
    size: M
    remaining:
      - Confirm the reconnecting bar and its 10-second dialog with a real network cut in production.
      - >-
        Cut recovery further: restart ICE instead of rebuilding media, overlap SDP readiness, and
        get keyframes sooner after a cut.
      - >-
        Check with production reconnect telemetry whether Postgres restarts and flapping networks
        recover more slowly in their worst cases.
      - >-
        Re-record a self-mute that a Sync restart interrupted, so other Participants don't see the
        muted Participant as unmuted.
    theory: theory.md#sync-correctness
    code:
      - sdks/typescript/client/src/sync/v1-client.ts
      - sdks/typescript/client/src/connection/lifecycle.ts
      - sdks/typescript/client/src/media/client.ts
