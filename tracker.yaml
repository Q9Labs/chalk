schema_version: 7
principle: >-
  Each entry is remaining work that code cannot show. Delete an entry when its work is done: the
  code is the record of what works. Priority is set by the owner.
sizing: >-
  Size is the work left. S is one focused change, M is several connected changes, L must be split
  before starting, and Unknown needs investigation first.
outcomes:
  - id: media.usage_metering
    title: Measure media usage per Tenant and Episode
    area: media
    state: planned
    summary: >-
      The Usage type has egress and Participant-minute fields, but both the Cloudflare and Chalk
      SFU adapters return only metadata, so media cost cannot be measured or limited.
    size: M
    remaining:
      - Collect usage in both adapters and attribute it to Tenant and Episode.
      - Expose usage to policy limits.
    theory: theory.md#constraints
    code:
      - apps/api/internal/mediaplane/service.go
      - apps/api/internal/adapters/cloudflare/sfu/adapter.go
      - apps/api/internal/adapters/chalksfu/adapter.go
  - id: security_and_compliance.chat_retention
    title: Tenant-set chat retention
    area: security_and_compliance
    state: planned
    summary: >-
      Artifact Policy sets retention for Recordings and Transcripts only. Chat has no retention
      setting and no purge.
    size: M
    remaining:
      - >-
        Add chat retention to Tenant policy and purge expired messages and their attachments without
        breaking Sync recovery.
      - Make sure hard delete overrides retention and purged messages never return through replay or snapshots.
    theory: theory.md#constraints
    code:
      - apps/api/internal/artifactpolicy/policy.go
      - apps/sync/lib/chalk_sync/chat/postgres.ex
  - id: sdk_and_embedding.app_identity
    title: SDK app name in server telemetry
    area: sdk_and_embedding
    state: planned
    summary: >-
      The client, SpaceClient, Chalk and the AccessGrant request have no app name. Only the
      React Native CallKit options use an `appName`, for a different purpose.
    size: S
    remaining:
      - >-
        Add a top-level `appName` and carry it on HTTP and WebSocket requests into API spans and
        logs. The server trims it, normalizes it to `[a-z0-9._-]`, caps it near 64 characters and
        drops it when empty, because it becomes a metric and log dimension.
      - Never let `appName` affect authorization.
    theory: theory.md#product-goals
    code:
      - sdks/typescript/client/src/client.ts
      - sdks/typescript/client/src/space-client/types.ts
      - apps/api/internal/httpapi/access_grants.go
  - id: sdk_and_embedding.other_language_sdks
    title: SDKs beyond TypeScript
    area: sdk_and_embedding
    state: planned
    summary: >-
      Only TypeScript SDKs exist. The OpenAPI contract is the input for Swift, Kotlin, Python and Go
      clients, and none is generated or published.
    priority: P2
    size: XL
    remaining:
      - >-
        Per language: define the supported surface, generate or write the package, and ship it with
        an independent consumer build and contract fixtures.
    theory: theory.md#product-goals
    code:
      - contract/generated/openapi.json
  - id: sdk_and_embedding.iframe_embed
    title: Embed a Space in an iframe
    area: sdk_and_embedding
    state: planned
    summary: >-
      No supported iframe contract exists for origins, access handoff or lifecycle messages.
    size: L
    remaining:
      - Define the iframe entry, access handoff, allowed origins and lifecycle messages.
      - Check camera and microphone permission, resize, teardown and expired access from another origin.
    theory: theory.md#product-goals
    code:
      - apps/web/src/routes/_space.tsx
      - sdks/typescript/react/src/components/chalk/Chalk.tsx
  - id: transcription.live_captions
    title: Live captions in a Space
    area: transcription
    state: planned
    summary: >-
      No live caption path exists. The Transcript panel only shows finished Transcripts.
    priority: P3
    size: L
    remaining:
      - Deliver live partial and final captions with consent, capability checks and cleanup.
    theory: theory.md#product-memory
    code:
      - sdks/typescript/react/src/components/chalk/Chalk.tsx
  - id: realtime_sync.call_moderation_details
    title: Numbered hands and named moderation
    area: realtime_sync
    state: planned
    summary: >-
      Raised hands are only a boolean, and the mute and stop events for microphone, camera and
      screen share carry only the target participant_id, not who acted. Each needs a Sync protocol
      field, so Sync ships before the SDKs.
    size: M
    remaining:
      - Keep the order hands were raised in, and let a host lower someone else's hand.
      - Name the Participant who muted someone or stopped their camera or screen share.
    code:
      - apps/sync/lib/chalk_sync/episodes/reducer.ex
      - sdks/typescript/client/src/space-client/participants-controller.ts
