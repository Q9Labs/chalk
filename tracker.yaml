  - id: recording.capture_reliability
    title: Long Recordings stay in sync
    area: recording
    state: planned
    summary: >-
      Capture bundles now share one recording clock, which fixed the skew that failed a 332-second
      run. Senders whose clocks really drift apart are still unhandled.
    size: Unknown
    remaining:
      - Handle sender clock divergence and pass a one-hour Recording.
      - Prove recorder restart continuity and TLS peer rejection on the managed hosts.
      - >-
        Make a release fail when a new recorder worker can't bootstrap with the issuer or never
        becomes ready, instead of passing the verifier with zero ready workers.
    uncertainty: >-
      Whether the remaining drift comes from the headless sender or the recorder is not known.
    theory: theory.md#product-memory
    code:
      - apps/api/internal/recorderworker
      - infrastructure/recorder
  - id: recording.capture_cost
    title: Capture starts fast and costs little
    area: recording
    state: in_progress
    summary: >-
      Capture runs on the lean Debian image on s-1vcpu-1gb. A cold worker is ready about 46 seconds
      after record, and anything said before it is ready is missing from the Recording. Automatic
      Spaces pre-warm Capture when someone opens the Entrance. SFU traffic to the recorder, about
      $90 a month at 2,000 hours, is now the largest Capture cost.
    size: M
    remaining:
      - >-
        Find and remove the transient registration 503s that can add about 15 seconds to a worker's
        boot.
      - >-
        Confirm in production that an Automatic Space pre-warms from the Entrance and that its
        Recording uses the warm node.
      - >-
        Experiment: with camera simulcast live, have Capture record the low camera layer and compare
        the Export and the SFU traffic to the recorder.
      - >-
        Experiment, only if UDP loss damages Recordings: compare Capture over TURN on TCP with UDP in
        one Recording. Cloudflare's SFU has no direct TCP receiver.
    uncertainty: >-
      Boot time is measured on few samples across DigitalOcean's variable create step. The owner
      chose pre-warm for Automatic Spaces only; Manual Spaces may want it later.
    theory: theory.md#product-memory
    code:
      - apps/api/internal/adapters/digitalocean/recorder_fleet.go
      - apps/api/internal/recorderfleet
      - apps/api/internal/recorderworker
      - infrastructure/recorder/images
