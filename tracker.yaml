schema_version: 7
principle: >-
  Each entry is one product outcome: what exists today and the work left. Evidence and verification
  logs live elsewhere. Priority is set by the owner.
sizing: >-
  Size is the work left. S is one focused change, M is several connected changes, L must be split
  before starting, and Unknown needs investigation first.
outcomes:
  - id: identity_and_tenancy.people_management
    title: Manage Tenant members and invitations
    area: identity_and_tenancy
    state: planned
    summary: >-
      The API can list members, add them and change their Role, but it has no invitations or
      removal. The People page is still a placeholder.
    priority: P1
    size: M
    remaining:
      - Add invitation (issue, accept, expire, revoke) and member removal to the API.
      - Build the People page on the existing and new operations.
      - >-
        Verify that denied Roles cannot change membership and that expired or revoked invitations
        show a way forward.
    theory: theory.md#identity-and-membership
    code:
      - apps/api/internal/httpapi/memberships.go
      - apps/web/src/routes/_app.people.tsx
      - apps/web/src/components/dashboard/ContractPage.tsx
  - id: media.real_network_qualification
    title: Media works on real networks and devices
    area: media
    state: unknown
    summary: >-
      Web and native media are implemented, but every automated run uses mocked signaling. No
      two-party call has been checked on real browsers or physical phones.
    priority: P1
    size: M
    remaining:
      - >-
        Run a two-party call with audio, video, screen share, admission changes and reconnect on
        supported browsers and on iOS and Android release builds.
      - Cover permission denial, background return and media-route replacement.
      - >-
        Make an unmute after a moderator mute reach every receiver in under two seconds. In production
        it took about six seconds, and one receiver sometimes never hears it.
      - Find whether audio can play for a few tens of milliseconds after a muted badge when Sync restarts.
      - Check camera simulcast on physical Safari and phones; Firefox publishes one camera layer.
    uncertainty: No real-network or physical-device observation exists.
    theory: theory.md#product-goals
    code:
      - tools/sdk-web-consumer-e2e/README.md
      - sdks/typescript/react-native/src/space-client/create-native-space-client.ts
      - apps/mobile/MOBILE_ENV_CONTRACT.md
  - id: media.usage_metering
    title: Measure media usage per Tenant and Episode
    area: media
    state: planned
    summary: >-
      The Usage type has egress and Participant-minute fields, but both Cloudflare adapters always
      report zero, so media cost cannot be measured or limited.
    priority: P2
    size: M
    remaining:
      - Collect usage in both Cloudflare adapters and attribute it to Tenant and Episode.
      - Reconcile one live Episode against the provider bill, then expose usage to policy limits.
    theory: theory.md#constraints
    code:
      - apps/api/internal/mediaplane/service.go
      - apps/api/internal/adapters/cloudflare/sfu/adapter.go
      - apps/api/internal/adapters/cloudflare/rtk/plane.go
  - id: media.custom_sfu
    title: Custom SFU
    area: media
    state: unknown
    summary: >-
      Media runs only on Cloudflare SFU and RTK. A custom SFU removes that dependency. It is one
      task in two parts: the SFU itself, then its integration into Chalk.
    priority: P1
    size: XL
    remaining:
      - >-
        Part 1, the SFU: build the server that receives and forwards audio, video and screen share.
      - >-
        Part 2, the integration: add a MediaPlane adapter, web and native clients, credential
        renewal and Recording capture on top of it.
    uncertainty: The SFU design and scope are not defined yet.
    theory: theory.md#constraints
    code:
      - apps/api/internal/mediaplane/service.go
      - sdks/typescript/client/src/media
      - sdks/typescript/react-native/src/space-client/create-native-space-client.ts
  - id: realtime_sync.failover_qualification
    title: Sync survives node and database failure
    area: realtime_sync
    state: in_progress
    summary: >-
      A local fault soak kills Sync right after an acknowledgement, restarts and stops Postgres, and
      slows a client. It has not been run on a production-like topology, and production runs a
      single database node with no standby.
    priority: P1
    size: M
    remaining:
      - >-
        Run the fault soak against a named production-like topology, including the original
        database coming back after an outage.
      - Decide whether production needs a database standby once there are users.
    uncertainty: The soak has only run on one machine with a local Postgres.
    theory: theory.md#sync-correctness
    code:
      - apps/sync/lib/chalk_sync/stateholder/postgres.ex
      - infrastructure/managed-episode
