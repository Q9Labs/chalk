schema_version: 7
principle: >-
  Track meaningful product outcomes and concrete remaining work, not completed setup or CRUD
  inventory. The repository-wide audit is dated 2026-09-08; recording and transcription status was
  refreshed against revision 4ebb57f2 on 2026-09-15. Working means only the explicitly stated source
  scope is implemented; it is not live-release certification. Planned means a specific
  implementation gap was found; unknown names the exact proof still unavailable. P0 first, P1 next,
  P2 later. Retire basic completed items; consolidate related outcomes without discarding unresolved
  scope.
sizing: >-
  Estimate remaining work, not elapsed time. S: one focused change. M: several connected changes. L:
  substantial cross-cutting work; split before starting. Unknown: investigate before sizing. Working
  entries have no remaining work to size. Waiting does not increase size. Revisit estimates when the
  work is inspected.
