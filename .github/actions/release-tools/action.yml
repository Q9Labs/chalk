name: Release tools
description: Install the pinned release-set validator
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: scripts/releases/requirements.txt
    - shell: bash
      run: python -m pip install --disable-pip-version-check -r scripts/releases/requirements.txt
