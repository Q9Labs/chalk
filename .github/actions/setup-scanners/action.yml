name: Set up security scanners
description: Install the Gitleaks and OSV-Scanner releases that .tool-versions pins, verified against checksums recorded here.

runs:
  using: composite
  steps:
    # cache-warm.yml saves the downloads on master, so a github.com outage only fails a run on a cache miss.
    - name: Restore scanner downloads
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/chalk-scanner-downloads
        key: scanner-downloads-${{ runner.os }}-${{ hashFiles('.tool-versions', '.github/actions/setup-scanners/action.yml') }}

    - name: Install pinned Gitleaks and OSV-Scanner
      shell: bash
      run: |
        set -euo pipefail
        # Checksums are pinned in the repo rather than read from the release, so a tampered release cannot vouch for itself.
        # Add the linux checksums here when bumping a tool in .tool-versions.
        gitleaks_version="$(scripts/lib/tool-version.sh gitleaks)"
        osv_version="$(scripts/lib/tool-version.sh osv-scanner)"
        case "${gitleaks_version}" in
          8.30.1) gitleaks_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" ;;
          *) echo "No pinned checksum for Gitleaks ${gitleaks_version}; add it to .github/actions/setup-scanners/action.yml" >&2; exit 1 ;;
        esac
        case "${osv_version}" in
          2.6.0) osv_sha256="ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108" ;;
          *) echo "No pinned checksum for OSV-Scanner ${osv_version}; add it to .github/actions/setup-scanners/action.yml" >&2; exit 1 ;;
        esac
        download_dir="${HOME}/.cache/chalk-scanner-downloads"
        bin_dir="${RUNNER_TEMP}/scanner-bin"
        mkdir -p "${download_dir}" "${bin_dir}"

        # A restored file is checked against the same checksum as a fresh download.
        archive="${download_dir}/gitleaks_${gitleaks_version}.tar.gz"
        [[ -s "${archive}" ]] || curl --fail --silent --show-error --location --retry 3 --retry-all-errors "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_linux_x64.tar.gz" --output "${archive}"
        echo "${gitleaks_sha256}  ${archive}" | sha256sum --check
        tar -xzf "${archive}" -C "${bin_dir}" gitleaks

        osv_download="${download_dir}/osv-scanner_${osv_version}"
        [[ -s "${osv_download}" ]] || curl --fail --silent --show-error --location --retry 3 --retry-all-errors "https://github.com/google/osv-scanner/releases/download/v${osv_version}/osv-scanner_linux_amd64" --output "${osv_download}"
        echo "${osv_sha256}  ${osv_download}" | sha256sum --check
        install -m 0755 "${osv_download}" "${bin_dir}/osv-scanner"
        echo "${bin_dir}" >> "${GITHUB_PATH}"
