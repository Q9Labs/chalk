name: Set up OpenTofu
description: Install the OpenTofu version pinned in .tool-versions and verify it against a checksum recorded here.

runs:
  using: composite
  steps:
    - name: Restore the pinned tool downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/chalk-tools
        key: chalk-tools-opentofu-${{ hashFiles('.tool-versions', '.github/actions/setup-opentofu/action.yml') }}

    - name: Install pinned OpenTofu
      shell: bash
      run: |
        set -euo pipefail
        version="$(awk '$1 == "opentofu" { print $2 }' .tool-versions)"
        if [[ -z "${version}" ]]; then
          echo "No opentofu line in .tool-versions" >&2
          exit 1
        fi
        # Checksums are pinned in the repo rather than read from the release, so a tampered
        # release cannot vouch for itself. Add the linux_amd64 checksum when bumping OpenTofu.
        case "${version}" in
          1.12.3) sha256="f87d45408dcbb963ddbe10b2f75e55b3495310556e05c35765dfd5913551f182" ;;
          *)
            echo "No pinned checksum for OpenTofu ${version}; add it to .github/actions/setup-opentofu/action.yml" >&2
            exit 1
            ;;
        esac
        # The GitHub archive is the primary source. OpenTofu's own package repository is the second,
        # so a github.com release outage does not stop a deploy or its rollback.
        case "${version}" in
          1.12.3) deb_sha256="02de7a0fcf218141b8bce2dec6438525fba80d88c372307c86b499488a1f9981" ;;
          *)
            echo "No pinned package checksum for OpenTofu ${version}; add it to .github/actions/setup-opentofu/action.yml" >&2
            exit 1
            ;;
        esac
        archive="tofu_${version}_linux_amd64.tar.gz"
        deb="tofu_${version}_amd64.deb"
        bin_dir="${RUNNER_TEMP}/tofu-bin"
        mkdir -p "${bin_dir}"
        download="$(scripts/deploy/install-pinned-tool.sh \
          "${sha256}=${archive}=https://github.com/opentofu/opentofu/releases/download/v${version}/${archive}" \
          "${deb_sha256}=${deb}=https://packages.opentofu.org/opentofu/tofu/packages/any/any/${deb}/download")"
        case "${download}" in
          *.tar.gz) tar -xzf "${download}" -C "${bin_dir}" tofu ;;
          *.deb)
            unpacked="$(mktemp -d)"
            dpkg-deb -x "${download}" "${unpacked}"
            install -m 0755 "${unpacked}/usr/bin/tofu" "${bin_dir}/tofu"
            ;;
        esac
        echo "${bin_dir}" >> "${GITHUB_PATH}"
