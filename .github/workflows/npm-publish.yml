name: Publish npm Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack packages without publishing
        type: boolean
        default: true
      release_sha:
        description: Exact commit to check out for a guarded release dispatch
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0

      - name: Verify publish ref
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          live_master_sha="$(git ls-remote origin refs/heads/master | awk 'NR == 1 { print $1 }')"
          if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not read a valid checked-out commit SHA" >&2
            exit 1
          fi
          if [[ ! "$live_master_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not read a valid live origin/master SHA" >&2
            exit 1
          fi
          if [[ "$checked_out_sha" != "$live_master_sha" ]]; then
            echo "Publish ref $checked_out_sha is not the current origin/master $live_master_sha" >&2
            exit 1
          fi
          echo "Publish ref verified: $checked_out_sha"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --sort --workspace-concurrency=1 --filter './packages/*' --filter './sdks/typescript/*' build

      - name: Check packages
        run: |
          pnpm run package:publint
          pnpm run package:attw

      - name: Pack packages
        if: inputs.dry_run
        run: |
          mkdir -p "$RUNNER_TEMP/npm-packages"
          pnpm --sort --workspace-concurrency=1 --filter './packages/*' --filter './sdks/typescript/*' --recursive pack --pack-destination "$RUNNER_TEMP/npm-packages"

      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          package_filters=()
          while IFS=$'\t' read -r package_name package_version; do
            if npm view "${package_name}@${package_version}" version --json --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "Skipping already published ${package_name}@${package_version}"
            else
              package_filters+=(--filter "$package_name")
            fi
          done < <(
            pnpm --filter './packages/*' --filter './sdks/typescript/*' --recursive list --depth -1 --json |
              node -e 'const fs = require("node:fs"); for (const { name, version, private: privatePackage } of JSON.parse(fs.readFileSync(0, "utf8"))) if (!privatePackage) console.log(name+"\t"+version);'
          )
          if (( ${#package_filters[@]} == 0 )); then
            echo "All release versions are already published."
            exit 0
          fi
          pnpm "${package_filters[@]}" --recursive publish --access public --no-git-checks
