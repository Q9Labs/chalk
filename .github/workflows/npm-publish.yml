name: Publish npm Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack packages without publishing
        type: boolean
        default: true
      release_sha:
        description: Exact production commit to publish (required unless dry_run)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_CONFIG_PROVENANCE: true
    steps:
      - name: Checkout publish guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Keep the tarball secret scan from the workflow revision
        run: |
          mkdir -p "$RUNNER_TEMP/publish-guard"
          cp scripts/releases/scan-npm-tarballs.sh .gitleaks.toml "$RUNNER_TEMP/publish-guard/"

      - name: Verify publish ref
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: python3 scripts/releases/npm_publish.py "$RELEASE_SHA"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - uses: ./.github/actions/setup-js
        with:
          registry-url: https://registry.npmjs.org/

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Select release packages
        run: |
          filters="$(node --input-type=module -e 'import { releasePackages } from "./scripts/lib/release-packages.mjs"; console.log(releasePackages.map(({ name }) => "--filter " + name).join(" "));')"
          echo "RELEASE_FILTERS=$filters" >> "$GITHUB_ENV"

      - name: Build packages
        run: |
          read -ra release_filters <<< "$RELEASE_FILTERS"
          pnpm --sort --workspace-concurrency=1 "${release_filters[@]}" build

      - name: Check packages
        run: |
          read -ra release_filters <<< "$RELEASE_FILTERS"
          pnpm "${release_filters[@]}" exec publint
          pnpm "${release_filters[@]}" exec attw --pack --ignore-rules cjs-resolves-to-esm internal-resolution-error --exclude-entrypoints './styles.css' './src/styles.css' './dist/styles/*' './styles/*'

      - name: Pack packages
        run: |
          mkdir -p "$RUNNER_TEMP/npm-packages"
          read -ra release_filters <<< "$RELEASE_FILTERS"
          pnpm --workspace-concurrency=1 "${release_filters[@]}" --recursive pack --pack-destination "$RUNNER_TEMP/npm-packages"

      - name: Scan packed packages for secrets
        run: bash "$RUNNER_TEMP/publish-guard/scan-npm-tarballs.sh" "$RUNNER_TEMP/npm-packages" "$RUNNER_TEMP/publish-guard/.gitleaks.toml"

      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          package_filters=()
          while IFS=$'\t' read -r package_name package_version; do
            if npm view "${package_name}@${package_version}" version --json --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "Skipping already published ${package_name}@${package_version}"
            else
              package_filters+=(--filter "$package_name")
            fi
          done < <(
            node --input-type=module -e 'import { releasePackages } from "./scripts/lib/release-packages.mjs"; for (const { name, version } of releasePackages) console.log(name+"\t"+version);'
          )
          if (( ${#package_filters[@]} == 0 )); then
            echo "All release versions are already published."
            exit 0
          fi
          pnpm "${package_filters[@]}" --recursive publish --access public --no-git-checks
