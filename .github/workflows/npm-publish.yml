name: Publish npm Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack packages without publishing
        type: boolean
        default: true
      release_sha:
        description: Exact commit to check out for a guarded release dispatch
        type: string
        required: false
        default: ""

      client_version:
        description: Required exact client version for a release/client-X.Y dispatch
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_CONFIG_PROVENANCE: true
      CLIENT_VERSION: ${{ inputs.client_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Verify publish ref
        if: ${{ !inputs.dry_run && !startsWith(github.ref, 'refs/heads/release/client-') }}
        shell: bash
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          live_master_sha="$(git ls-remote origin refs/heads/master | awk 'NR == 1 { print $1 }')"
          if [[ ! "$live_master_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not read a valid live origin/master SHA" >&2
            exit 1
          fi
          if [[ "$checked_out_sha" != "$live_master_sha" ]]; then
            echo "Publish ref $checked_out_sha is not the current origin/master $live_master_sha" >&2
            exit 1
          fi
          echo "Publish ref verified: $checked_out_sha"

      - name: Verify maintenance checkout before running release code
        if: startsWith(github.ref, 'refs/heads/release/client-')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF" =~ ^refs/heads/release/client-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid client maintenance branch: $GITHUB_REF" >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          live_release_sha="$(git ls-remote origin "$GITHUB_REF" | awk 'NR == 1 { print $1 }')"
          if [[ ! "$live_release_sha" =~ ^[0-9a-f]{40}$ || "$checked_out_sha" != "$live_release_sha" || "$GITHUB_SHA" != "$live_release_sha" ]]; then
            echo "Dispatch and checkout must both equal the live release branch head" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Verify client maintenance release
        if: startsWith(github.ref, 'refs/heads/release/client-')
        run: node scripts/npm-client-maintenance.mjs --plan

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Select release packages
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/client-* ]]; then
            echo "RELEASE_FILTERS=--filter @q9labsai/chalk-client" >> "$GITHUB_ENV"
            echo "BUILD_FILTERS=--filter @q9labsai/chalk-client..." >> "$GITHUB_ENV"
            exit 0
          fi
          filters="$(node --input-type=module -e 'import { releasePackages } from "./scripts/npm-release.mjs"; console.log(releasePackages.map(({ name }) => "--filter " + name).join(" "));')"
          echo "RELEASE_FILTERS=$filters" >> "$GITHUB_ENV"

      - name: Build packages
        run: |
          read -ra release_filters <<< "${BUILD_FILTERS:-$RELEASE_FILTERS}"
          pnpm --sort --workspace-concurrency=1 "${release_filters[@]}" build

      - name: Check packages
        run: |
          read -ra release_filters <<< "$RELEASE_FILTERS"
          pnpm "${release_filters[@]}" exec publint
          pnpm "${release_filters[@]}" exec attw --pack --ignore-rules cjs-resolves-to-esm internal-resolution-error --exclude-entrypoints './styles.css' './src/styles.css' './dist/styles/*' './styles/*'

      - name: Pack packages
        if: inputs.dry_run
        run: |
          mkdir -p "$RUNNER_TEMP/npm-packages"
          read -ra release_filters <<< "$RELEASE_FILTERS"
          pnpm --workspace-concurrency=1 "${release_filters[@]}" --recursive pack --pack-destination "$RUNNER_TEMP/npm-packages"

      - name: Publish client maintenance release
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/heads/release/client-') }}
        run: node scripts/npm-client-maintenance.mjs --publish

      - name: Publish packages
        if: ${{ !inputs.dry_run && !startsWith(github.ref, 'refs/heads/release/client-') }}
        shell: bash
        run: |
          set -euo pipefail
          package_filters=()
          while IFS=$'\t' read -r package_name package_version; do
            if npm view "${package_name}@${package_version}" version --json --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "Skipping already published ${package_name}@${package_version}"
            else
              package_filters+=(--filter "$package_name")
            fi
          done < <(
            node --input-type=module -e 'import { releasePackages } from "./scripts/npm-release.mjs"; for (const { name, version } of releasePackages) console.log(name+"\t"+version);'
          )
          if (( ${#package_filters[@]} == 0 )); then
            echo "All release versions are already published."
            exit 0
          fi
          pnpm "${package_filters[@]}" --recursive publish --access public --no-git-checks
