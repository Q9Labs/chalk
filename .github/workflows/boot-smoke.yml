name: Boot smoke

# Starts the whole dev stack (web, API, Sync, Postgres, Redis) from an empty machine with `pnpm dev`, checks it with
# `pnpm dev:doctor`, drives one call with fake media through the non-production Cloudflare SFU, and tears it down.
# No Gate lane boots the dev stack or reaches the SFU with secrets, so this is the only check of both.
# A merge group runs it when it changes any file in `the paths in the Select step` below, because `merge_group` has no path filter. A pull
# request runs it only when it changes the dev stack itself (`scripts/dev`, the verify-chalk skill, this file, the tool
# versions), so ordinary application changes boot once, at the merge group. It is not a required check, so a failure never
# blocks a merge. Master pushes do not run it: the merge group booted the same code. Run it by hand on a branch with
# `workflow_dispatch`.
on:
  merge_group:
  pull_request:
    paths:
      - scripts/dev/**
      - .agents/skills/verify-chalk/**
      - .tool-versions
      - .github/workflows/boot-smoke.yml
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boot-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select boot smoke
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      boot: ${{ steps.select.outputs.boot }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Select
        id: select
        env:
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [[ "${{ github.event_name }}" != "merge_group" ]]; then
            echo "boot=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # The same paths as the pull request filter used to list. A failed diff boots anyway.
          changed=$(git diff --name-only "${GROUP_BASE_SHA}...HEAD" -- \
            apps/web apps/api apps/sync scripts/dev scripts/deploy scripts/web-proof packages sdks/typescript \
            .agents/skills/verify-chalk package.json pnpm-lock.yaml pnpm-workspace.yaml .tool-versions \
            .github/workflows/boot-smoke.yml ':(exclude,glob)**/*.md') || changed=failed
          if [[ -n "${changed}" ]]; then echo "boot=true" >> "${GITHUB_OUTPUT}"; else echo "boot=false" >> "${GITHUB_OUTPUT}"; fi
          cat "${GITHUB_OUTPUT}"

  boot:
    needs: changes
    # Pull requests from forks get no secrets, so the stack cannot reach the SFU there.
    if: ${{ needs.changes.outputs.boot == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHALK_CLOUDFLARE_REALTIME_APP_ID: ${{ secrets.CHALK_CLOUDFLARE_REALTIME_APP_ID }}
      CHALK_CLOUDFLARE_REALTIME_APP_SECRET: ${{ secrets.CHALK_CLOUDFLARE_REALTIME_APP_SECRET }}
      PUBLIC_ORIGIN: http://localhost:3070
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Start the stack from empty
        run: |
          mkdir -p .verify/ci
          started=$(date +%s)
          nohup pnpm dev > .verify/ci/up.log 2>&1 &
          up=$!
          until grep -aq "Chalk dev ready" .verify/ci/up.log; do
            kill -0 "$up" 2>/dev/null || { echo "pnpm dev exited before it was ready"; exit 1; }
            [ $(( $(date +%s) - started )) -lt 480 ] || { echo "pnpm dev was not ready after 8 minutes"; exit 1; }
            sleep 2
          done
          echo "ready_seconds=$(( $(date +%s) - started ))" | tee -a "$GITHUB_STEP_SUMMARY" .verify/ci/timing.txt

      - name: Doctor
        run: |
          started=$(date +%s)
          pnpm dev:doctor | tee .verify/ci/doctor.json
          echo "doctor_seconds=$(( $(date +%s) - started ))" | tee -a "$GITHUB_STEP_SUMMARY" .verify/ci/timing.txt

      - name: Join a call with fake media through the SFU
        run: node .agents/skills/verify-chalk/scripts/join-call.mjs "ci-${GITHUB_RUN_ID}"

      - name: Tear down
        if: always()
        run: |
          mkdir -p .verify/ci
          cp -r .logs .verify/ci/logs 2>/dev/null || true
          # The evidence is downloadable from a public repository, so drop any file that holds a credential.
          token=$(node -p 'require("./.private/chalk-dev/seed.json").systemToken' 2>/dev/null || true)
          for secret in "$CHALK_CLOUDFLARE_REALTIME_APP_ID" "$CHALK_CLOUDFLARE_REALTIME_APP_SECRET" "$token"; do
            [ -n "$secret" ] && grep -rlaF -- "$secret" .verify | xargs -r rm -f
          done
          pnpm dev:down

      # .verify is a hidden directory, which upload-artifact skips unless told otherwise; without that no run ever
      # uploaded evidence. Read diagnostics.json first: it holds each page's tile state, WebRTC stats and failed requests.
      - name: Upload evidence
        if: ${{ !success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boot-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          # The runtime directory holds the system token, so only evidence and the copied service logs are uploaded.
          path: .verify/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
