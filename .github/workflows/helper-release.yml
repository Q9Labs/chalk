name: Release Chalk Helper

on:
  pull_request:
    paths:
      - .github/workflows/helper-release.yml
      - apps/helper/**
      - packages/screen-annotation/**
  workflow_dispatch:
    inputs:
      channel:
        description: Download and updater channel
        type: choice
        options: [staging, production]
        default: staging
      store_link_only:
        description: Refresh the production download page without building installers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: helper-release-${{ github.event_name == 'pull_request' && github.ref || inputs.channel }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DOWNLOAD_ORIGIN: https://downloads.chalkmeet.com
  TAURI_CLI: '@tauri-apps/cli@2.12.6'

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source
        id: release
        env:
          CHANNEL: ${{ inputs.channel }}
          STORE_LINK_ONLY: ${{ inputs.store_link_only }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' apps/helper/src-tauri/tauri.conf.json)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          case "$GITHUB_REF" in
            refs/heads/master|"refs/tags/helper-v$version") ;;
            *) echo "::error::Select master or helper-v$version."; exit 1 ;;
          esac
          git merge-base --is-ancestor HEAD origin/master
          if [[ $STORE_LINK_ONLY == true && $CHANNEL != production ]]; then
            echo "::error::The Store link is only available on the production page."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-macos:
    if: ${{ !inputs.store_link_only }}
    needs: plan
    runs-on: macos-15
    environment: helper-${{ inputs.channel }}
    defaults:
      run:
        working-directory: apps/helper
    env:
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - name: Configure managed pairing and updater
        env:
          PAIR_TICKET_KEY: ${{ vars.CHALK_HELPER_PAIR_TICKET_PUBLIC_KEY }}
        run: bash release/configure-build.sh macos
      - name: Build and notarize universal macOS app and DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.HELPER_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.HELPER_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: CollabEZ FZE LLC (5K9635LZ6F)'
          APPLE_API_KEY: ${{ secrets.HELPER_APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.HELPER_APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.HELPER_APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.HELPER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.HELPER_UPDATER_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?Missing Developer ID p12}" "${APPLE_CERTIFICATE_PASSWORD:?Missing p12 password}"
          : "${APPLE_API_KEY:?Missing ASC key ID}" "${APPLE_API_ISSUER:?Missing ASC issuer}"
          : "${APPLE_API_PRIVATE_KEY:?Missing ASC p8 key}"
          : "${TAURI_SIGNING_PRIVATE_KEY:?Missing updater key}" "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:?Missing updater password}"
          umask 077
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          unset APPLE_API_PRIVATE_KEY
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npx --yes "$TAURI_CLI" build --ci --target universal-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/macos.json" -- --locked
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/Chalk Helper.app"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/chalk-helper"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/helper-codesign.txt"
          grep -F "Authority=$APPLE_SIGNING_IDENTITY" "$RUNNER_TEMP/helper-codesign.txt"
          grep -E 'flags=.*runtime' "$RUNNER_TEMP/helper-codesign.txt"
          xcrun stapler validate "$app"
          spctl -a -vv -t execute "$app"
          dmg=("$bundle"/dmg/*.dmg)
          [[ ${#dmg[@]} == 1 && -f ${dmg[0]} ]]
          codesign --verify --verbose=2 "${dmg[0]}"
          xcrun notarytool submit "${dmg[0]}" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --output-format json \
            | tee "$RUNNER_TEMP/helper-notary.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/helper-notary.json" >/dev/null
          xcrun stapler staple "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
          mkdir -p "$RUNNER_TEMP/helper"
          cp "${dmg[0]}" "$RUNNER_TEMP/helper/Chalk-Helper-macOS.dmg"
          cp "$bundle/macos/Chalk Helper.app.tar.gz" "$RUNNER_TEMP/helper/Chalk-Helper-macOS.app.tar.gz"
          cp "$bundle/macos/Chalk Helper.app.tar.gz.sig" "$RUNNER_TEMP/helper/Chalk-Helper-macOS.app.tar.gz.sig"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helper-macos-${{ github.run_attempt }}
          path: ${{ runner.temp }}/helper/
          if-no-files-found: error

  build-windows:
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (needs.plan.result == 'success' && !inputs.store_link_only)) }}
    needs: plan
    runs-on: windows-2025
    environment: ${{ github.event_name == 'workflow_dispatch' && format('helper-{0}', inputs.channel) || 'helper-ci' }}
    defaults:
      run:
        working-directory: apps/helper
    env:
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - name: Configure managed pairing without the Tauri updater
        env:
          PAIR_TICKET_KEY: ${{ vars.CHALK_HELPER_PAIR_TICKET_PUBLIC_KEY }}
        run: bash release/configure-build.sh windows
      - name: Build Windows x64 executable without an NSIS installer
        shell: bash
        run: npx --yes "$TAURI_CLI" build --ci --no-bundle -- --locked
      - name: Package and test the MSIX
        id: msix
        shell: pwsh
        env:
          STORE_IDENTITY: ${{ vars.CHALK_HELPER_STORE_IDENTITY }}
          STORE_PUBLISHER: ${{ vars.CHALK_HELPER_STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.CHALK_HELPER_STORE_PUBLISHER_DISPLAY_NAME }}
        run: ./release/package-windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.msix.outputs.store_submission == 'true'
        with:
          name: helper-microsoft-store-${{ github.run_attempt }}
          path: ${{ runner.temp }}/helper-msix/Chalk-Helper-x64.msix
          if-no-files-found: error

  publish:
    needs: [plan, build-macos]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (inputs.store_link_only || needs.build-macos.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: helper-${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !inputs.store_link_only }}
        with:
          name: helper-macos-${{ github.run_attempt }}
          path: ${{ runner.temp }}/helper-release
      - name: Install the updater signature verifier
        if: ${{ !inputs.store_link_only }}
        run: sudo apt-get install -y minisign
      - name: Verify updater signatures and publish
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HELPER_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HELPER_R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
          STORE_LINK_ONLY: ${{ inputs.store_link_only }}
          STORE_URL: ${{ vars.CHALK_HELPER_STORE_URL }}
        run: node apps/helper/release/publish.mjs "$RUNNER_TEMP/helper-release"
