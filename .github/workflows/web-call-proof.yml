name: Web-call proof
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment with a permanent proof Tenant
        type: environment
        default: production
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
    secrets:
      CHALK_PROOF_API_KEY:
        required: true
    outputs:
      result:
        description: passed only when the web call and cleanup pass
        value: ${{ jobs.web.outputs.result }}
permissions:
  contents: read
concurrency:
  group: real-call-proof-${{ inputs.environment }}
  cancel-in-progress: false
  queue: max
jobs:
  web:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    outputs:
      result: ${{ steps.result.outputs.result }}
    env:
      CHALK_PROOF_CONFIG_SOURCE: env
      CHALK_PROOF_TENANT_ID: ${{ vars.CHALK_PROOF_TENANT_ID }}
      CHALK_PROOF_API_URL: ${{ vars.CHALK_PROOF_API_URL }}
      CHALK_PROOF_WEB_URL: ${{ vars.CHALK_PROOF_WEB_URL }}
      CHALK_PROOF_PROOF_ORIGIN: ${{ vars.CHALK_PROOF_PROOF_ORIGIN }}
      CHALK_PROOF_WEBHOOK_ENDPOINT_ID: ${{ vars.CHALK_PROOF_WEBHOOK_ENDPOINT_ID }}
      CHALK_PROOF_WEBHOOK_SERVICE_URL: ${{ vars.CHALK_PROOF_WEBHOOK_SERVICE_URL }}
      EVIDENCE_RECIPIENT: ${{ vars.CHALK_PROOF_EVIDENCE_RECIPIENT }}
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - name: Refuse non-master invocation before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/master
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install browser and evidence tools
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y age
      - name: Resolve web engine browser cache key
        id: web-browser-key
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { createRequire } from "node:module";
          const requireEngine = createRequire(import.meta.resolve("@e2e-dev/web"));
          const version = requireEngine("playwright-core/package.json").version;
          console.log(`key=e2e-web-playwright-${version}-chromium-${process.env.ImageOS}-${process.env.RUNNER_ARCH}`);
          JS
      - name: Restore web engine browser cache
        id: web-browser-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.web-browser-key.outputs.key }}
      - name: Install web engine Chromium before the proof
        run: pnpm exec e2e-web install chromium --with-deps
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
          verify-engine: true
      - name: Save web engine browser cache
        if: steps.web-browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.web-browser-key.outputs.key }}
      - name: Validate evidence recipient before creating a call
        run: |
          test -n "$EVIDENCE_RECIPIENT"
          printf '' | age --recipient "$EVIDENCE_RECIPIENT" --output /dev/null
      - name: Prove the deployed web app
        timeout-minutes: 7
        env:
          CHALK_PROOF_API_KEY: ${{ secrets.CHALK_PROOF_API_KEY }}
        run: pnpm web:proof
      - name: Clean proof resources even after cancellation
        if: always()
        env:
          CHALK_PROOF_API_KEY: ${{ secrets.CHALK_PROOF_API_KEY }}
        run: |
          if [ -f .private/web-proof-run-id ]; then
            pnpm prod:proof cleanup "$(cat .private/web-proof-run-id)"
          fi
      - name: Encrypt private call evidence
        if: always()
        run: |
          if [ -d .private/prod-proof ]; then
            mkdir -p .private/web-proof-artifact .private/web-proof
            tar -czf - -C .private prod-proof web-proof | age --recipient "$EVIDENCE_RECIPIENT" --output .private/web-proof-artifact/evidence.tar.gz.age
          fi
      - name: Upload encrypted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-call-proof-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .private/web-proof-artifact/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
      - name: Publish proof result
        id: result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            echo 'result=passed' >> "$GITHUB_OUTPUT"
          else
            echo 'result=failed' >> "$GITHUB_OUTPUT"
          fi
