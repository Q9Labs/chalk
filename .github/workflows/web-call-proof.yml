name: Web-call proof
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment with a permanent proof Tenant
        type: environment
        default: production
        required: true
      media_plane:
        description: Media provider of the proof Space; the nightly cut runs chalk_sfu, and cf_sfu stays for manual dispatch
        type: choice
        options: [cf_sfu, chalk_sfu]
        default: cf_sfu
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      media_plane:
        description: Media provider of the proof Space; the nightly cut runs chalk_sfu
        type: string
        default: cf_sfu
    secrets:
      CHALK_PROOF_API_KEY:
        required: true
      CHALK_PROOF_API_URL:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
      CHALK_PROOF_WEB_URL:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
      CHALK_PROOF_TENANT_ID:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
      CHALK_PROOF_SPACE_ID_CHALK_SFU:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
      CHALK_PROOF_WEBHOOK_ENDPOINT_ID:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
      CHALK_PROOF_WEBHOOK_SERVICE_URL:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
    outputs:
      result:
        description: passed only when the web call and cleanup pass
        value: ${{ jobs.web.outputs.result }}
      failure:
        description: Named reason when the staging SFU lease stopped the proof; empty otherwise
        value: ${{ jobs.web.outputs.failure }}
permissions:
  contents: read
concurrency:
  group: ${{ inputs.environment == 'nightly' && 'chalk-staging-sfu' || format('real-call-proof-{0}', inputs.environment) }}
  cancel-in-progress: false
  queue: max
jobs:
  web:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    # A nightly chalk_sfu run may wait up to 30 minutes for the staging SFU lease.
    timeout-minutes: ${{ inputs.environment == 'nightly' && inputs.media_plane == 'chalk_sfu' && 50 || 15 }}
    # The staging SFU lease is a Git ref, so a nightly chalk_sfu run needs contents:write. Other runs never push.
    permissions:
      contents: write
    outputs:
      result: ${{ steps.result.outputs.result }}
      failure: ${{ steps.prove.outputs.failure }}
    env:
      CHALK_PROOF_MEDIA_PLANE: ${{ inputs.media_plane || 'cf_sfu' }}
      # A Space an operator moved to the own SFU (media-settings), since the public API refuses to create one.
      CHALK_PROOF_SPACE_ID_CHALK_SFU: ${{ secrets.CHALK_PROOF_SPACE_ID_CHALK_SFU }}
      CHALK_PROOF_CONFIG_SOURCE: env
      CHALK_PROOF_TENANT_ID: ${{ secrets.CHALK_PROOF_TENANT_ID }}
      CHALK_PROOF_API_URL: ${{ secrets.CHALK_PROOF_API_URL }}
      CHALK_PROOF_WEB_URL: ${{ secrets.CHALK_PROOF_WEB_URL }}
      CHALK_PROOF_PROOF_ORIGIN: ${{ vars.CHALK_PROOF_PROOF_ORIGIN }}
      CHALK_PROOF_WEBHOOK_ENDPOINT_ID: ${{ secrets.CHALK_PROOF_WEBHOOK_ENDPOINT_ID }}
      CHALK_PROOF_WEBHOOK_SERVICE_URL: ${{ secrets.CHALK_PROOF_WEBHOOK_SERVICE_URL }}
      EVIDENCE_RECIPIENT: ${{ vars.CHALK_PROOF_EVIDENCE_RECIPIENT }}
      E2E_TELEMETRY_DISABLED: "1"
      CHALK_PROOF_WEBKIT: "1"
    steps:
      - name: Refuse non-master invocation before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - uses: ./.github/actions/apt-install
        with:
          packages: age
      - name: Resolve web engine browser cache key
        id: web-browser-key
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { createRequire } from "node:module";
          const requireEngine = createRequire(import.meta.resolve("@e2e-dev/web"));
          const version = requireEngine("playwright-core/package.json").version;
          console.log(`key=e2e-web-playwright-${version}-chromium-webkit-${process.env.ImageOS}-${process.env.RUNNER_ARCH}`);
          JS
      - name: Restore web engine browser cache
        id: web-browser-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.web-browser-key.outputs.key }}
      - name: Install web engine Chromium and WebKit before the proof
        run: pnpm exec e2e-web install chromium webkit --with-deps
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium webkit
          verify-engine: true
      - name: Save web engine browser cache
        if: steps.web-browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.web-browser-key.outputs.key }}
      - name: Validate evidence recipient before creating a call
        run: |
          test -n "$EVIDENCE_RECIPIENT"
          printf '' | age --recipient "$EVIDENCE_RECIPIENT" --output /dev/null
      - name: Keep private browser proof files in memory
        run: |
          mkdir -p .private /dev/shm/chalk-web-private /dev/shm/chalk-web-tmp
          chmod 700 /dev/shm/chalk-web-private /dev/shm/chalk-web-tmp
          sudo mount --bind /dev/shm/chalk-web-private .private
          echo "TMPDIR=/dev/shm/chalk-web-tmp" >> "$GITHUB_ENV"
      - name: Prove the deployed web app
        id: prove
        timeout-minutes: ${{ inputs.environment == 'nightly' && inputs.media_plane == 'chalk_sfu' && 38 || 7 }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHALK_PROOF_API_KEY: ${{ secrets.CHALK_PROOF_API_KEY }}
          STAGING_SFU_PROOF: ${{ inputs.environment == 'nightly' && inputs.media_plane == 'chalk_sfu' }}
        run: |
          if [[ "$STAGING_SFU_PROOF" == true ]]; then
            # A lease that stays busy for the whole wait fails the gate as staging-sfu-lease-timeout.
            STAGING_LEASE_WAIT=1800 scripts/staging-sfu/gate-lease nightly-web web-call "$GITHUB_RUN_ID" -- pnpm web:proof
          else
            pnpm web:proof
          fi
      - name: Clean proof resources even after cancellation
        if: always()
        env:
          CHALK_PROOF_API_KEY: ${{ secrets.CHALK_PROOF_API_KEY }}
        run: |
          if [ -f .private/web-proof-run-id ]; then
            pnpm prod:proof cleanup "$(cat .private/web-proof-run-id)"
          fi
      - name: Encrypt private call evidence
        if: always()
        run: |
          if [ -d .private/prod-proof ]; then
            mkdir -p .private/web-proof-artifact .private/web-proof
            tar -czf - -C .private prod-proof web-proof | age --recipient "$EVIDENCE_RECIPIENT" --output .private/web-proof-artifact/evidence.tar.gz.age
          fi
      - name: Upload encrypted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-call-proof-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .private/web-proof-artifact/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
      - name: Publish proof result
        id: result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            echo 'result=passed' >> "$GITHUB_OUTPUT"
          else
            echo 'result=failed' >> "$GITHUB_OUTPUT"
          fi
