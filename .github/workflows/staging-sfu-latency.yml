name: Staging SFU latency

# Own-SFU staging action latency for the newest held nightly. It runs outside Cut nightly so the 45-minute measurement
# never lengthens a cut. It starts when a cut finishes, so its verdict arrives about 50 minutes later; the daily run and
# a manual dispatch cover a cut whose start was missed. Promote reads the verdict this workflow records for the SHA it
# selects, and refuses a SHA with no verdict (own_sfu_proof_result=latency-missing).
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_run:
    workflows: [Cut nightly]
    types: [completed]
  workflow_dispatch:
    inputs:
      samples:
        description: Latency cycles, 1 to 60; empty measures 60. Fewer give a weaker p95, so use it only for a cut whose own staging-latency.mjs caps the run at 40 minutes, where about 45 cycles fit
        type: string
        default: ""

permissions: {}

concurrency:
  # The called proof workflow holds chalk-staging-sfu, and a caller and callee cannot share a group.
  group: chalk-staging-sfu-latency-run
  cancel-in-progress: false

jobs:
  target:
    name: Find the nightly staging runs
    runs-on: ubuntu-24.04
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Refuse non-master dispatch before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/releases/release.py latency_target
  latency:
    needs: target
    if: needs.target.outputs.sha != ''
    permissions:
      contents: write # The staging lease is a git-ref write.
    uses: ./.github/workflows/real-call-proof.yml
    with:
      environment: nightly
      proofs: none
      media_plane: chalk_sfu
      latency: true
      latency_only: true
      latency_samples: ${{ inputs.samples }}
      release_sha: ${{ needs.target.outputs.sha }}
      scorecard_label: chalk_sfu
    secrets: inherit
  record:
    # Slow or failed runs matter most to the trend, so this job scores whatever card exists and records the verdict.
    needs: [target, latency]
    if: always() && needs.target.outputs.sha != ''
    runs-on: ubuntu-24.04
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
    timeout-minutes: 20
    permissions:
      contents: write
      deployments: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
      - name: Download the latency card
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: scorecard-nightly-*
          path: artifacts/nightly
          merge-multiple: true
      - name: Evaluate gated budgets for the measured SHA
        id: evaluate
        env:
          TARGET_SHA: ${{ needs.target.outputs.sha }}
        run: |
          mapfile -t cards < <(find artifacts/nightly -name "scorecard-*.json")
          node features/scorecard/evaluate.mjs "$TARGET_SHA" "$GITHUB_RUN_ID" "${cards[@]}"
      - name: Score the run and add it to the history
        if: always()
        uses: ./.github/actions/scorecard-history
        with:
          cards-dir: artifacts/nightly
          none-message: No latency scorecard in this run.
      - name: Record the verdict for Promote
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.target.outputs.sha }}
          LATENCY_RESULT: ${{ needs.latency.result == 'success' && needs.latency.outputs.result || 'failed' }}
          SCORECARD_RESULT: ${{ steps.evaluate.outputs.result }}
        run: python3 scripts/releases/release.py record_latency
