name: Real-call proof

on:
  schedule:
    # Production otherwise gets a real call only on promote. Scheduled runs have
    # no inputs, so they take the production and "smoke transcript" fallbacks below.
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment with a permanent proof Tenant
        type: environment
        default: production
        required: true
      proofs:
        description: Space-separated proof commands
        type: string
        default: smoke transcript
      media_plane:
        description: Media provider of the proof Space; chalk_sfu runs only camera-share and call-artifacts
        type: choice
        options: [cf_sfu, chalk_sfu]
        default: cf_sfu
      latency:
        description: After the proofs, measure action latency on the proof Space's media plane and publish its scorecard (nightly, chalk_sfu)
        type: boolean
        default: false
      release_sha:
        description: Exact deployed revision to prove; defaults to the workflow revision
        type: string
        default: ""
      leave_baseline_median_ms:
        description: Captured production baseline; empty measures the local old SDK reference
        type: string
        default: ""
      leave_baseline_evidence_sha256:
        description: Encrypted comparison evidence hash
        type: string
        default: ""
  workflow_call:
    inputs:
      environment:
        description: Environment with a permanent proof Tenant
        type: string
        required: true
      proofs:
        description: Space-separated proof commands
        type: string
        default: smoke transcript
      media_plane:
        description: Media provider of the proof Space; chalk_sfu runs only camera-share and call-artifacts
        type: string
        default: cf_sfu
      latency:
        description: After the proofs, measure action latency on the proof Space's media plane and publish its scorecard (nightly, chalk_sfu)
        type: boolean
        default: false
      latency_only:
        description: Skip real-call proofs and run only the nightly latency scorecard of one plane (chalk_sfu or cf_sfu)
        type: boolean
        default: false
      release_sha:
        description: Exact deployed revision to prove
        type: string
        default: ""
      leave_baseline_median_ms:
        type: string
        default: ""
      leave_baseline_evidence_sha256:
        type: string
        default: ""
      scorecard_label:
        description: Names the scorecard artifact of this invocation, so a rerun does not replace the first
        type: string
        default: proof
    secrets:
      CHALK_PROOF_API_KEY:
        description: Bootstrap key for the environment proof Tenant
        required: true
      CHALK_AXIOM_QUERY_TOKEN:
        description: Read-only staging API-log query token, needed only for own-SFU staging latency
        required: false
      CHALK_AXIOM_METRICS_QUERY_TOKEN:
        description: Read-only SFU metrics query token, needed only for own-SFU staging latency
        required: false
      CHALK_ALERTS_DISCORD_WEBHOOK_URL:
        description: Production alerts Discord webhook; only timer runs use it
        required: false
    outputs:
      result:
        description: passed or failed; may be absent on cancellation or runner loss
        value: ${{ jobs.smoke.outputs.result }}

# Inherit the caller's permissions. Only nightly's own-sfu caller grants contents:write
# for the staging lease; Promote and Cloudflare proof callers retain contents:read.

concurrency:
  # All workflows driving the shared staging SFU use this group and the Git-ref lease.
  group: ${{ inputs.environment == 'nightly' && 'chalk-staging-sfu' || format('real-call-proof-{0}', inputs.environment || 'production') }}
  cancel-in-progress: false
  # The default keeps one pending run, so a timer run would cancel a waiting
  # Promote proof, and Promote rolls back on any proof that did not pass.
  queue: max

jobs:
  smoke:
    name: Real-call proofs
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'production' }}
    outputs:
      result: ${{ steps.result.outputs.result }}
    timeout-minutes: ${{ inputs.environment == 'nightly' && inputs.media_plane == 'chalk_sfu' && 130 || 50 }}
    steps:
      - name: Refuse non-master invocation before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/master
          if [[ -n "$RELEASE_SHA" ]]; then
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
      - name: Validate latency-only invocation
        if: ${{ inputs.latency_only }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          MEDIA_PLANE: ${{ inputs.media_plane }}
          LATENCY: ${{ inputs.latency }}
        run: |
          [[ "$ENVIRONMENT" == nightly && ( "$MEDIA_PLANE" == chalk_sfu || "$MEDIA_PLANE" == cf_sfu ) && "$LATENCY" == true ]] || {
            echo "Latency-only mode requires nightly, chalk_sfu or cf_sfu, and latency=true." >&2
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require selected proof code to be merged before dependency installation
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install proof dependencies
        run: pnpm install --frozen-lockfile --filter @q9labsai/chalk-client...
      - uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg imagemagick espeak fonts-dejavu-core age
      - name: Install ImageMagick 7 entry point
        run: |
          # Ubuntu ships ImageMagick 6, without the ImageMagick 7 entry point.
          sudo tee /usr/local/bin/magick > /dev/null <<'SH'
          #!/bin/sh
          if [ "$1" = montage ]; then
            shift
            exec montage "$@"
          fi
          exec convert "$@"
          SH
          sudo chmod +x /usr/local/bin/magick
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - name: Validate evidence recipient
        env:
          EVIDENCE_RECIPIENT: ${{ vars.CHALK_PROOF_EVIDENCE_RECIPIENT }}
        run: |
          if [ -z "$EVIDENCE_RECIPIENT" ]; then
            echo "Missing required variable CHALK_PROOF_EVIDENCE_RECIPIENT" >&2
            exit 1
          fi
          printf '' | age --recipient "$EVIDENCE_RECIPIENT" --output /dev/null
      - name: Identify invocation
        id: invocation
        run: echo "suffix=$(tr -d '-' < /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"
      - name: Keep private proof files in memory
        run: |
          mkdir -p .private /dev/shm/chalk-proof-private /dev/shm/chalk-proof-tmp
          chmod 700 /dev/shm/chalk-proof-private /dev/shm/chalk-proof-tmp
          sudo mount --bind /dev/shm/chalk-proof-private .private
          echo "TMPDIR=/dev/shm/chalk-proof-tmp" >> "$GITHUB_ENV"
      - name: Prove a real call
        if: ${{ success() && !inputs.latency_only }}
        timeout-minutes: ${{ inputs.environment == 'nightly' && inputs.media_plane == 'chalk_sfu' && 50 || 40 }}
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SFU_PROOF: ${{ inputs.environment == 'nightly' && inputs.media_plane == 'chalk_sfu' }}
          CHALK_PROOF_CONFIG_SOURCE: env
          CHALK_PROOF_API_KEY: ${{ secrets.CHALK_PROOF_API_KEY }}
          RUN_PREFIX: ${{ steps.invocation.outputs.suffix }}
          PROOFS: ${{ inputs.proofs || 'smoke transcript' }}
          CHALK_PROOF_MEDIA_PLANE: ${{ inputs.media_plane || 'cf_sfu' }}
          CHALK_PROOF_LEAVE_BASELINE_MEDIAN_MS: ${{ inputs.leave_baseline_median_ms }}
          CHALK_PROOF_LEAVE_BASELINE_EVIDENCE_SHA256: ${{ inputs.leave_baseline_evidence_sha256 }}
          CHALK_PROOF_TENANT_ID: ${{ vars.CHALK_PROOF_TENANT_ID }}
          CHALK_PROOF_API_URL: ${{ vars.CHALK_PROOF_API_URL }}
          CHALK_PROOF_WEB_URL: ${{ vars.CHALK_PROOF_WEB_URL }}
          CHALK_PROOF_PROOF_ORIGIN: ${{ vars.CHALK_PROOF_PROOF_ORIGIN }}
          CHALK_PROOF_WEBHOOK_ENDPOINT_ID: ${{ vars.CHALK_PROOF_WEBHOOK_ENDPOINT_ID }}
          CHALK_PROOF_WEBHOOK_SERVICE_URL: ${{ vars.CHALK_PROOF_WEBHOOK_SERVICE_URL }}
        run: |
          read -r -a proofs <<< "$PROOFS"
          if [ "${#proofs[@]}" -eq 0 ]; then
            echo "PROOF configuration: failed (empty-proof-list)" >&2
            exit 1
          fi
          case "$CHALK_PROOF_MEDIA_PLANE" in
            cf_sfu|chalk_sfu) ;;
            *) echo "Unsupported media plane" >&2; exit 1 ;;
          esac
          for proof in "${proofs[@]}"; do
            case "$proof" in
              all|smoke|camera-share|recording-rejoin|export|transcript|call-artifacts|leave) ;;
              *) echo "Unsupported proof command" >&2; exit 1 ;;
            esac
            # The older Recording, export and transcript proofs need Cloudflare. call-artifacts is the own SFU's Recording and Transcript proof and is in no default list.
            if [ "$CHALK_PROOF_MEDIA_PLANE" = chalk_sfu ] && [ "$proof" != camera-share ] && [ "$proof" != call-artifacts ]; then
              echo "chalk_sfu supports only camera-share and call-artifacts" >&2
              exit 1
            fi
          done
          mkdir -p .private
          for proof in "${proofs[@]}"; do
            start=$(date +%s)
            run_id="${RUN_PREFIX}-${proof}"
            echo "$run_id" >> .private/proof-run-ids
            if [[ "$STAGING_SFU_PROOF" == true ]]; then
              scripts/staging-sfu/staging-lock --holder nightly-proof --purpose "$proof" --run-id "$RUN_PREFIX" -- env CHALK_PROOF_RUN_ID="$run_id" pnpm prod:proof "$proof"
            else
              CHALK_PROOF_RUN_ID="$run_id" pnpm prod:proof "$proof"
            fi
            echo "$proof wall seconds: $(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Measure action latency
        if: ${{ !cancelled() && inputs.latency && (!inputs.latency_only || inputs.environment == 'nightly') }}
        # Runs after a failed proof too, so one run shows both results. A failed proof or latency run still fails the job; the caller reads that as the revision's result.
        timeout-minutes: ${{ inputs.environment == 'nightly' && inputs.media_plane == 'chalk_sfu' && 70 || 25 }}
        env:
          CHALK_PROOF_CONFIG_SOURCE: env
          CHALK_PROOF_API_KEY: ${{ secrets.CHALK_PROOF_API_KEY }}
          RUN_PREFIX: ${{ steps.invocation.outputs.suffix }}
          CHALK_PROOF_MEDIA_PLANE: ${{ inputs.media_plane || 'cf_sfu' }}
          CHALK_PROOF_TENANT_ID: ${{ vars.CHALK_PROOF_TENANT_ID }}
          CHALK_PROOF_API_URL: ${{ vars.CHALK_PROOF_API_URL }}
          CHALK_PROOF_WEB_URL: ${{ vars.CHALK_PROOF_WEB_URL }}
          CHALK_PROOF_PROOF_ORIGIN: ${{ vars.CHALK_PROOF_PROOF_ORIGIN }}
          CHALK_PROOF_WEBHOOK_ENDPOINT_ID: ${{ vars.CHALK_PROOF_WEBHOOK_ENDPOINT_ID }}
          CHALK_PROOF_WEBHOOK_SERVICE_URL: ${{ vars.CHALK_PROOF_WEBHOOK_SERVICE_URL }}
          SCORECARD_TIER: ${{ inputs.environment == 'nightly' && 'nightly' || 'manual' }}
          SCORECARD_ENVIRONMENT: ${{ inputs.environment == 'nightly' && 'staging' || inputs.environment == 'production' && 'production' || 'ci' }}
          GH_TOKEN: ${{ github.token }}
          CHALK_AXIOM_QUERY_TOKEN: ${{ secrets.CHALK_AXIOM_QUERY_TOKEN }}
          CHALK_AXIOM_STAGING_LOG_DATASET: ${{ vars.CHALK_AXIOM_STAGING_LOG_DATASET }}
          CHALK_AXIOM_METRICS_QUERY_TOKEN: ${{ inputs.environment == 'nightly' && inputs.media_plane == 'chalk_sfu' && secrets.CHALK_AXIOM_METRICS_QUERY_TOKEN || '' }}
          CHALK_AXIOM_STAGING_METRICS_DATASET: ${{ vars.CHALK_AXIOM_STAGING_METRICS_DATASET }}
          CHALK_AXIOM_METRICS_BASE_URL: ${{ vars.CHALK_AXIOM_METRICS_BASE_URL }}
        run: |
          # A revision from before the own-SFU nightly has no latency kit scorecard code to run.
          if [ ! -f features/scorecard/own-sfu.mjs ]; then
            echo "The selected revision predates the own-SFU nightly, so no latency was measured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p .private
          if [[ "$SCORECARD_ENVIRONMENT" == staging && "$CHALK_PROOF_MEDIA_PLANE" == chalk_sfu ]]; then
            node features/scorecard/staging-latency.mjs
            exit $?
          fi
          run_id="${RUN_PREFIX}-latency"
          echo "$run_id" >> .private/proof-run-ids
          CHALK_PROOF_RUN_ID="$run_id" pnpm prod:latency --planes "$CHALK_PROOF_MEDIA_PLANE" --environment "$SCORECARD_ENVIRONMENT" --tier "$SCORECARD_TIER" --region github-hosted --size ubuntu-24-04
      - name: Collect the latency scorecard
        if: ${{ !cancelled() && inputs.latency && (!inputs.latency_only || inputs.environment == 'nightly') }}
        env:
          CHALK_PROOF_MEDIA_PLANE: ${{ inputs.media_plane || 'cf_sfu' }}
          STAGING_LATENCY: ${{ inputs.environment == 'nightly' && inputs.media_plane == 'chalk_sfu' }}
        run: |
          if [ ! -f features/scorecard/own-sfu.mjs ]; then
            exit 0
          fi
          evidence=.private/prod-proof
          [[ "$STAGING_LATENCY" != true ]] || evidence=.private/latency-scorecard
          node features/scorecard/own-sfu.mjs "$evidence" "$CHALK_PROOF_MEDIA_PLANE" "$(git rev-parse HEAD)" artifacts
      - name: Clean proof runs
        if: always()
        # Deleting this run's resources must never wait on another lane's measurement lease.
        env:
          CHALK_PROOF_CONFIG_SOURCE: env
          CHALK_PROOF_API_KEY: ${{ secrets.CHALK_PROOF_API_KEY }}
          CHALK_PROOF_TENANT_ID: ${{ vars.CHALK_PROOF_TENANT_ID }}
          CHALK_PROOF_API_URL: ${{ vars.CHALK_PROOF_API_URL }}
          CHALK_PROOF_WEB_URL: ${{ vars.CHALK_PROOF_WEB_URL }}
          CHALK_PROOF_PROOF_ORIGIN: ${{ vars.CHALK_PROOF_PROOF_ORIGIN }}
          CHALK_PROOF_WEBHOOK_ENDPOINT_ID: ${{ vars.CHALK_PROOF_WEBHOOK_ENDPOINT_ID }}
          CHALK_PROOF_WEBHOOK_SERVICE_URL: ${{ vars.CHALK_PROOF_WEBHOOK_SERVICE_URL }}
        run: |
          status=0
          if [ -f .private/proof-run-ids ]; then
            while IFS= read -r run_id; do
              pnpm prod:proof cleanup "$run_id" || status=1
            done < .private/proof-run-ids
          fi
          exit "$status"
      - name: Build the scorecard from the Leave proof
        if: always() && (inputs.environment == 'nightly' || (inputs.environment == 'production' && github.event_name == 'workflow_dispatch'))
        # A scoring failure must not change the proof result: Promote rolls back on a failed proof, and the nightly records a failed proof as a failed cut.
        continue-on-error: true
        run: |
          # The scorecard holds timings only, so unlike the evidence it is not encrypted. The nightly run appends it to the history.
          leave=$(find .private/prod-proof -path "*-leave/leave-comparison.json" -print -quit 2> /dev/null || true)
          if [ -z "$leave" ]; then
            echo "No Leave proof result in this run; no scorecard."
            exit 0
          fi
          mkdir -p artifacts
          node features/scorecard/scorecard.mjs build --proof-leave "$leave" --tier "$SCORECARD_TIER" --environment "$SCORECARD_ENVIRONMENT" --id "$GITHUB_RUN_ID" \
            --plane "$CHALK_PROOF_MEDIA_PLANE" --region github-hosted --size ubuntu-24-04 --commit "$(git rev-parse HEAD)" \
            --out artifacts/scorecard-proof.json
        env:
          CHALK_PROOF_MEDIA_PLANE: ${{ inputs.media_plane || 'cf_sfu' }}
          SCORECARD_TIER: ${{ inputs.environment == 'nightly' && 'nightly' || 'promote' }}
          SCORECARD_ENVIRONMENT: ${{ inputs.environment == 'nightly' && 'staging' || 'production' }}
      - name: Upload the scorecard
        if: always() && (inputs.environment == 'nightly' || (inputs.environment == 'production' && github.event_name == 'workflow_dispatch'))
        # A scoring failure must not change the proof result: Promote rolls back on a failed proof, and the nightly records a failed proof as a failed cut.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-${{ inputs.environment == 'nightly' && 'nightly' || 'promote' }}-${{ inputs.scorecard_label || 'proof' }}
          path: artifacts/scorecard-*.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Encrypt private proof evidence
        if: always()
        env:
          EVIDENCE_RECIPIENT: ${{ vars.CHALK_PROOF_EVIDENCE_RECIPIENT }}
        run: |
          if [ -d .private/prod-proof ]; then
            mkdir -p .private/prod-proof-artifact
            tar -czf - -C .private prod-proof | age --recipient "$EVIDENCE_RECIPIENT" --output .private/prod-proof-artifact/evidence.tar.gz.age
          fi
      - name: Upload encrypted proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-call-proof-${{ inputs.environment || 'production' }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.invocation.outputs.suffix }}
          path: .private/prod-proof-artifact/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
      - name: Publish proof result
        id: result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            echo 'result=passed' >> "$GITHUB_OUTPUT"
          else
            echo 'result=failed' >> "$GITHUB_OUTPUT"
          fi
      - name: Alert Discord about a failed daily production call
        if: always() && job.status != 'success' && github.event_name == 'schedule' && (inputs.environment || 'production') == 'production'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.CHALK_ALERTS_DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg content "Daily production real-call proof failed: $RUN_URL" '{content: $content}' \
            | curl --fail --silent --show-error -H 'Content-Type: application/json' --data @- "$DISCORD_WEBHOOK_URL"
