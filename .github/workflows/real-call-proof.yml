name: Real-call proof

on:
  schedule:
    # Production otherwise gets a real call only on promote. Scheduled runs have
    # no inputs, so they take the production and "smoke transcript" fallbacks below.
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment with a permanent proof Tenant
        type: environment
        default: production
        required: true
      proofs:
        description: Space-separated proof commands
        type: string
        default: smoke transcript
      media_plane:
        description: Media provider of the proof Space. Promote runs on chalk_sfu, which runs only the proofs that list it in scripts/prod-proof/registry.json. cf_sfu is for manual dispatch; the per-Space switch back to Cloudflare is still the undo
        type: choice
        options: [cf_sfu, chalk_sfu]
        default: cf_sfu
      transcribe:
        description: Wait for and check the call-artifacts Transcript (false records the call but turns the proof Space's Transcript off for the run)
        type: boolean
        default: true
      latency:
        description: After the proofs, measure action latency on the proof Space's media plane and publish its scorecard (Promote, chalk_sfu)
        type: boolean
        default: false
      latency_samples:
        description: Latency cycles per run, 1 to 60; empty measures the full 60. A short run is for checking one fix, not for the gate
        type: string
        default: ""
      release_sha:
        description: Exact deployed revision to prove; defaults to the workflow revision
        type: string
        default: ""
      leave_baseline_median_ms:
        description: Captured production baseline; empty measures the local old SDK reference
        type: string
        default: ""
      leave_baseline_evidence_sha256:
        description: Encrypted comparison evidence hash
        type: string
        default: ""
  workflow_call:
    inputs:
      environment:
        description: Environment with a permanent proof Tenant
        type: string
        required: true
      proofs:
        description: Space-separated proof commands
        type: string
        default: smoke transcript
      media_plane:
        description: Media provider of the proof Space. Promote runs on chalk_sfu, which runs only the proofs that list it in scripts/prod-proof/registry.json. cf_sfu is for manual dispatch; the per-Space switch back to Cloudflare is still the undo
        type: string
        default: cf_sfu
      transcribe:
        description: Wait for and check the call-artifacts Transcript (false records the call but turns the proof Space's Transcript off for the run)
        type: boolean
        default: true
      latency:
        description: After the proofs, measure action latency on the proof Space's media plane and publish its scorecard (Promote, chalk_sfu)
        type: boolean
        default: false
      latency_samples:
        description: Latency cycles per run, 1 to 60; empty measures the full 60. A short run is for checking one fix, not for the gate
        type: string
        default: ""
      latency_only:
        description: Skip real-call proofs and run only the production latency scorecard (chalk_sfu)
        type: boolean
        default: false
      release_sha:
        description: Exact deployed revision to prove
        type: string
        default: ""
      leave_baseline_median_ms:
        type: string
        default: ""
      leave_baseline_evidence_sha256:
        type: string
        default: ""
      scorecard_label:
        description: Names the scorecard artifact of this invocation, so a rerun does not replace the first
        type: string
        default: proof
    secrets:
      CHALK_PROOF_API_KEY:
        description: Bootstrap key for the environment proof Tenant
        required: true
      CHALK_PROOF_API_URL:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
      CHALK_PROOF_WEB_URL:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
      CHALK_PROOF_TENANT_ID:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
      CHALK_PROOF_SPACE_ID_CF_SFU:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
      CHALK_PROOF_SPACE_ID_CHALK_SFU:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
      CHALK_PROOF_SPACE_ID_CHALK_SFU_AUTOMATIC:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
      CHALK_PROOF_WEBHOOK_ENDPOINT_ID:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
      CHALK_PROOF_WEBHOOK_SERVICE_URL:
        description: Proof identifier, held as an environment secret so it never prints in logs
        required: false
      CHALK_ALERTS_DISCORD_WEBHOOK_URL:
        description: Production alerts Discord webhook; only timer runs use it
        required: false
    outputs:
      result:
        description: passed or failed; may be absent on cancellation or runner loss
        value: ${{ jobs.smoke.outputs.result }}
      results:
        description: Each proof's result in order, as name=passed, name=failed or name=not-run, separated by spaces; empty when the proof step did not finish
        value: ${{ jobs.smoke.outputs.results }}

concurrency:
  # In production the Chalk SFU call-artifacts proof alone uses the automatic Recording Space, so it has its own group and runs beside the proofs that use the manual Space.
  # Every other production run, web-call-proof.yml included, shares one group. A production run that mixes call-artifacts with other proofs, or adds latency to it, is refused below.
  group: ${{ format('real-call-proof-{0}{1}', inputs.environment || 'production', inputs.proofs == 'call-artifacts' && inputs.media_plane == 'chalk_sfu' && '-recording' || '') }}
  cancel-in-progress: false
  # The default keeps one pending run, so a timer run would cancel a waiting
  # Promote proof, and Promote rolls back on any proof that did not pass.
  queue: max

jobs:
  smoke:
    name: Real-call proofs
    runs-on: ubuntu-24.04
    # The proof only needs the environment's secrets and variables. A deployment record would mark the held nightly cut inactive (features/scorecard/deployment-records.test.mjs).
    environment:
      name: ${{ inputs.environment || 'production' }}
      deployment: false
    outputs:
      result: ${{ steps.result.outputs.result }}
      results: ${{ steps.prove.outputs.results }}
    timeout-minutes: ${{ inputs.latency_only && 90 || 50 }}
    steps:
      - name: Refuse non-master invocation before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ENVIRONMENT: ${{ inputs.environment || 'production' }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/master
          # Nightly has no shared host and no permanent proof Tenant; its proofs run on throwaway stacks (nightly-proofs.yml).
          [[ "$ENVIRONMENT" == production ]] || { echo "Real-call proofs run on production only." >&2; exit 1; }
          if [[ -n "$RELEASE_SHA" ]]; then
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
      - name: Validate latency-only invocation
        if: ${{ inputs.latency_only }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          MEDIA_PLANE: ${{ inputs.media_plane }}
          LATENCY: ${{ inputs.latency }}
        run: |
          # Promote measures production on chalk_sfu beside its proofs.
          [[ "$ENVIRONMENT" == production && "$MEDIA_PLANE" == chalk_sfu && "$LATENCY" == true ]] || {
            echo "Latency-only mode requires production (chalk_sfu) and latency=true." >&2
            exit 1
          }
      - name: Refuse a production run that spans both proof Spaces
        # call-artifacts alone has its own concurrency group; a run that also uses the manual Space would overlap Promote's other leg.
        if: ${{ inputs.environment == 'production' && inputs.media_plane == 'chalk_sfu' && contains(inputs.proofs, 'call-artifacts') && (inputs.proofs != 'call-artifacts' || inputs.latency) }}
        run: |
          echo "A production Chalk SFU run of call-artifacts must run alone and without latency, so it cannot overlap Promote on the other proof Space." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require selected proof code to be merged before dependency installation
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: ./.github/actions/setup-js
        with:
          install-args: "--filter @q9labsai/chalk-client..."
      - uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg imagemagick espeak fonts-dejavu-core age
      - name: Install ImageMagick 7 entry point
        run: |
          # Ubuntu ships ImageMagick 6, without the ImageMagick 7 entry point.
          sudo tee /usr/local/bin/magick > /dev/null <<'SH'
          #!/bin/sh
          if [ "$1" = montage ]; then
            shift
            exec montage "$@"
          fi
          exec convert "$@"
          SH
          sudo chmod +x /usr/local/bin/magick
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - name: Validate evidence recipient
        env:
          EVIDENCE_RECIPIENT: ${{ vars.CHALK_PROOF_EVIDENCE_RECIPIENT }}
        run: |
          if [ -z "$EVIDENCE_RECIPIENT" ]; then
            echo "Missing required variable CHALK_PROOF_EVIDENCE_RECIPIENT" >&2
            exit 1
          fi
          printf '' | age --recipient "$EVIDENCE_RECIPIENT" --output /dev/null
      - name: Identify invocation
        id: invocation
        run: echo "suffix=$(tr -d '-' < /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"
      - name: Name the revision's proofs
        # A Promote or latency run can check out a cut made before the Chalk SFU rename, whose CLI and scorecard code use the old names.
        run: |
          for legacy in features/scorecard/own-sfu.m*s; do
            [ -f "$legacy" ] || continue
            echo "PROOF_NAMES_BEFORE_RENAME=true" >> "$GITHUB_ENV"
            echo "LEGACY_COLLECTOR=$legacy" >> "$GITHUB_ENV"
          done
      - name: Keep private proof files in memory
        run: |
          mkdir -p .private /dev/shm/chalk-proof-private /dev/shm/chalk-proof-tmp
          chmod 700 /dev/shm/chalk-proof-private /dev/shm/chalk-proof-tmp
          sudo mount --bind /dev/shm/chalk-proof-private .private
          echo "TMPDIR=/dev/shm/chalk-proof-tmp" >> "$GITHUB_ENV"
      - name: Prove a real call
        id: prove
        if: ${{ success() && !inputs.latency_only }}
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
          CHALK_PROOF_CONFIG_SOURCE: env
          CHALK_PROOF_API_KEY: ${{ secrets.CHALK_PROOF_API_KEY }}
          RUN_PREFIX: ${{ steps.invocation.outputs.suffix }}
          PROOFS: ${{ inputs.proofs || 'smoke transcript' }}
          CHALK_PROOF_MEDIA_PLANE: ${{ inputs.media_plane || 'cf_sfu' }}
          CHALK_PROOF_TRANSCRIBE: ${{ inputs.transcribe }}
          # Promote's Chalk SFU proof reuses the two Spaces that chalk-sfu-spaces moved, found by slug.
          CHALK_PROOF_SPACE_BY_SLUG: ${{ inputs.environment == 'production' && inputs.media_plane == 'chalk_sfu' }}
          # A Space an operator moved to the Chalk SFU (media-settings), since the public API refuses to create one. Leave the Cloudflare variable unset.
          CHALK_PROOF_SPACE_ID_CF_SFU: ${{ secrets.CHALK_PROOF_SPACE_ID_CF_SFU }}
          CHALK_PROOF_SPACE_ID_CHALK_SFU: ${{ secrets.CHALK_PROOF_SPACE_ID_CHALK_SFU }}
          # The call-artifacts proof needs automatic Recording and Transcription, so it reuses its own Space.
          CHALK_PROOF_SPACE_ID_CHALK_SFU_AUTOMATIC: ${{ secrets.CHALK_PROOF_SPACE_ID_CHALK_SFU_AUTOMATIC }}
          CHALK_PROOF_LEAVE_BASELINE_MEDIAN_MS: ${{ inputs.leave_baseline_median_ms }}
          CHALK_PROOF_LEAVE_BASELINE_EVIDENCE_SHA256: ${{ inputs.leave_baseline_evidence_sha256 }}
          CHALK_PROOF_TENANT_ID: ${{ secrets.CHALK_PROOF_TENANT_ID }}
          CHALK_PROOF_API_URL: ${{ secrets.CHALK_PROOF_API_URL }}
          CHALK_PROOF_WEB_URL: ${{ secrets.CHALK_PROOF_WEB_URL }}
          CHALK_PROOF_PROOF_ORIGIN: ${{ vars.CHALK_PROOF_PROOF_ORIGIN }}
          CHALK_PROOF_PROOF_ORIGIN_OWN: ${{ vars.CHALK_PROOF_PROOF_ORIGIN_OWN }}
          CHALK_PROOF_WEBHOOK_ENDPOINT_ID: ${{ secrets.CHALK_PROOF_WEBHOOK_ENDPOINT_ID }}
          CHALK_PROOF_WEBHOOK_SERVICE_URL: ${{ secrets.CHALK_PROOF_WEBHOOK_SERVICE_URL }}
        run: |
          read -r -a proofs <<< "$PROOFS"
          # A revision from before the rename knows only the old names; the labels below keep the new ones.
          checked=("${proofs[@]}")
          if [ "${PROOF_NAMES_BEFORE_RENAME:-}" = true ]; then checked=("${proofs[@]//chalk-sfu/own-sfu}"); fi
          node scripts/prod-proof/registry.mjs check "$CHALK_PROOF_MEDIA_PLANE" "${checked[@]}"
          mkdir -p .private
          results=()
          failed=()
          # Promote's proofs build on each other, so a failure stops the rest.
          stop=false
          for proof in "${proofs[@]}"; do
            if [ "$stop" = true ]; then
              results+=("$proof=not-run")
              continue
            fi
            start=$(date +%s)
            run_id="${RUN_PREFIX}-${proof}"
            echo "$run_id" >> .private/proof-run-ids
            status=0
            command="$proof"
            if [ "${PROOF_NAMES_BEFORE_RENAME:-}" = true ]; then command="${proof//chalk-sfu/own-sfu}"; fi
            CHALK_PROOF_RUN_ID="$run_id" pnpm prod:proof "$command" || status=$?
            echo "$proof wall seconds: $(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" -eq 0 ]; then
              results+=("$proof=passed")
              continue
            fi
            results+=("$proof=failed")
            failed+=("$proof")
            stop=true
          done
          echo "results=${results[*]}" >> "$GITHUB_OUTPUT"
          echo "Proof results: ${results[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error title=Proofs failed::${failed[*]}"
            exit 1
          fi
      - name: Measure action latency
        if: ${{ !cancelled() && inputs.latency && (!inputs.latency_only || inputs.environment == 'production') }}
        # Runs after a failed proof too, so one run shows both results. A failed proof or latency run still fails the job; the caller reads that as the revision's result.
        timeout-minutes: ${{ inputs.environment == 'production' && inputs.latency_only && 75 || 25 }}
        # Promote's scorecard gate decides what a breach, a thin metric or a missing card means, one rerun included; a first attempt that
        # breaches must not fail the job, or its failure would outlive a passing rerun. The run summary and the gate still show it.
        continue-on-error: ${{ inputs.latency_only && inputs.environment == 'production' }}
        env:
          CHALK_PROOF_CONFIG_SOURCE: env
          # Promote's latency run reuses the proof Space the proofs used, the only Space of this Tenant the plane allowlist admits. Like the proofs, it takes a pinned
          # Space ID when an operator pinned one and otherwise finds the Space by slug.
          CHALK_PROOF_SPACE_BY_SLUG: ${{ inputs.latency_only && inputs.environment == 'production' && inputs.media_plane == 'chalk_sfu' }}
          CHALK_PROOF_API_KEY: ${{ secrets.CHALK_PROOF_API_KEY }}
          RUN_PREFIX: ${{ steps.invocation.outputs.suffix }}
          CHALK_PROOF_MEDIA_PLANE: ${{ inputs.media_plane || 'cf_sfu' }}
          CHALK_PROOF_TRANSCRIBE: ${{ inputs.transcribe }}
          # A Space an operator moved to the Chalk SFU (media-settings), since the public API refuses to create one. Leave the Cloudflare variable unset.
          CHALK_PROOF_SPACE_ID_CF_SFU: ${{ secrets.CHALK_PROOF_SPACE_ID_CF_SFU }}
          CHALK_PROOF_SPACE_ID_CHALK_SFU: ${{ secrets.CHALK_PROOF_SPACE_ID_CHALK_SFU }}
          # The call-artifacts proof needs automatic Recording and Transcription, so it reuses its own Space.
          CHALK_PROOF_SPACE_ID_CHALK_SFU_AUTOMATIC: ${{ secrets.CHALK_PROOF_SPACE_ID_CHALK_SFU_AUTOMATIC }}
          CHALK_PROOF_TENANT_ID: ${{ secrets.CHALK_PROOF_TENANT_ID }}
          CHALK_PROOF_API_URL: ${{ secrets.CHALK_PROOF_API_URL }}
          CHALK_PROOF_WEB_URL: ${{ secrets.CHALK_PROOF_WEB_URL }}
          CHALK_PROOF_PROOF_ORIGIN: ${{ vars.CHALK_PROOF_PROOF_ORIGIN }}
          CHALK_PROOF_WEBHOOK_ENDPOINT_ID: ${{ secrets.CHALK_PROOF_WEBHOOK_ENDPOINT_ID }}
          CHALK_PROOF_WEBHOOK_SERVICE_URL: ${{ secrets.CHALK_PROOF_WEBHOOK_SERVICE_URL }}
          SCORECARD_TIER: ${{ inputs.latency_only && inputs.environment == 'production' && 'promote' || 'manual' }}
          SCORECARD_ENVIRONMENT: ${{ inputs.environment == 'production' && 'production' || 'ci' }}
          GH_TOKEN: ${{ github.token }}
          CHALK_LATENCY_SAMPLES: ${{ inputs.latency_samples }}
        run: |
          collector=features/scorecard/chalk-sfu.mjs
          [ "${PROOF_NAMES_BEFORE_RENAME:-}" != true ] || collector=$LEGACY_COLLECTOR
          # A revision from before the Chalk SFU nightly has no latency kit scorecard code to run.
          if [ ! -f "$collector" ]; then
            echo "The selected revision predates the Chalk SFU nightly, so no latency was measured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p .private
          run_id="${RUN_PREFIX}-latency"
          echo "$run_id" >> .private/proof-run-ids
          latency=(pnpm prod:latency --planes "$CHALK_PROOF_MEDIA_PLANE" --environment "$SCORECARD_ENVIRONMENT" --tier "$SCORECARD_TIER" --region github-hosted --size ubuntu-24-04)
          # Without --samples the kit measures 20 cycles; the gate's 60 cycles (floor 48) must be asked for.
          [ -z "$CHALK_LATENCY_SAMPLES" ] || latency+=(--samples "$CHALK_LATENCY_SAMPLES")
          CHALK_PROOF_RUN_ID="$run_id" "${latency[@]}"
      - name: Collect the latency scorecard
        if: ${{ !cancelled() && inputs.latency && (!inputs.latency_only || inputs.environment == 'production') }}
        # A missing card is the gate's finding for Promote's production run (see the measurement step).
        continue-on-error: ${{ inputs.latency_only && inputs.environment == 'production' }}
        env:
          CHALK_PROOF_MEDIA_PLANE: ${{ inputs.media_plane || 'cf_sfu' }}
          CHALK_PROOF_TRANSCRIBE: ${{ inputs.transcribe }}
        run: |
          collector=features/scorecard/chalk-sfu.mjs
          [ "${PROOF_NAMES_BEFORE_RENAME:-}" != true ] || collector=$LEGACY_COLLECTOR
          if [ ! -f "$collector" ]; then
            exit 0
          fi
          evidence=.private/prod-proof
          if [ "${PROOF_NAMES_BEFORE_RENAME:-}" = true ]; then
            node "$collector" "$evidence" "$CHALK_PROOF_MEDIA_PLANE" "$(git rev-parse HEAD)" artifacts
          else
            node features/scorecard/chalk-sfu.mjs "$evidence" "$CHALK_PROOF_MEDIA_PLANE" "$(git rev-parse HEAD)" artifacts
          fi
      - name: Clean proof runs
        if: always()
        env:
          CHALK_PROOF_CONFIG_SOURCE: env
          CHALK_PROOF_API_KEY: ${{ secrets.CHALK_PROOF_API_KEY }}
          CHALK_PROOF_TENANT_ID: ${{ secrets.CHALK_PROOF_TENANT_ID }}
          CHALK_PROOF_API_URL: ${{ secrets.CHALK_PROOF_API_URL }}
          CHALK_PROOF_WEB_URL: ${{ secrets.CHALK_PROOF_WEB_URL }}
          CHALK_PROOF_PROOF_ORIGIN: ${{ vars.CHALK_PROOF_PROOF_ORIGIN }}
          CHALK_PROOF_WEBHOOK_ENDPOINT_ID: ${{ secrets.CHALK_PROOF_WEBHOOK_ENDPOINT_ID }}
          CHALK_PROOF_WEBHOOK_SERVICE_URL: ${{ secrets.CHALK_PROOF_WEBHOOK_SERVICE_URL }}
        run: |
          status=0
          if [ -f .private/proof-run-ids ]; then
            while IFS= read -r run_id; do
              pnpm prod:proof cleanup "$run_id" || status=1
            done < .private/proof-run-ids
          fi
          exit "$status"
      - name: Build the scorecard from the Leave proof
        if: always() && inputs.environment == 'production' && github.event_name == 'workflow_dispatch'
        # A scoring failure must not change the proof result: Promote rolls back on a failed proof.
        continue-on-error: true
        run: |
          # The scorecard holds timings only, so unlike the evidence it is not encrypted.
          leave=$(find .private/prod-proof \( -path "*-leave/leave-comparison.json" -o -path "*-leave-chalk-sfu/leave-comparison.json" \) -print -quit 2> /dev/null || true)
          if [ -z "$leave" ]; then
            echo "No Leave proof result in this run; no scorecard."
            exit 0
          fi
          mkdir -p artifacts
          node features/scorecard/scorecard.mjs build --proof-leave "$leave" --tier "$SCORECARD_TIER" --environment "$SCORECARD_ENVIRONMENT" --id "$GITHUB_RUN_ID" \
            --plane "$CHALK_PROOF_MEDIA_PLANE" --region github-hosted --size ubuntu-24-04 --commit "$(git rev-parse HEAD)" \
            --out artifacts/scorecard-proof.json
        env:
          CHALK_PROOF_MEDIA_PLANE: ${{ inputs.media_plane || 'cf_sfu' }}
          CHALK_PROOF_TRANSCRIBE: ${{ inputs.transcribe }}
          SCORECARD_TIER: promote
          SCORECARD_ENVIRONMENT: production
      - name: Upload the scorecard
        if: always() && inputs.environment == 'production' && github.event_name == 'workflow_dispatch'
        # A scoring failure must not change the proof result: Promote rolls back on a failed proof.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-promote-${{ inputs.scorecard_label || 'proof' }}
          path: |
            artifacts/scorecard-*.json
            artifacts/latency-diagnostics-*.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Encrypt private proof evidence
        if: always()
        env:
          EVIDENCE_RECIPIENT: ${{ vars.CHALK_PROOF_EVIDENCE_RECIPIENT }}
        run: |
          if [ -d .private/prod-proof ]; then
            mkdir -p .private/prod-proof-artifact
            tar -czf - -C .private prod-proof | age --recipient "$EVIDENCE_RECIPIENT" --output .private/prod-proof-artifact/evidence.tar.gz.age
          fi
      - name: Upload encrypted proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-call-proof-${{ inputs.environment || 'production' }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.invocation.outputs.suffix }}
          path: .private/prod-proof-artifact/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
      - name: Publish proof result
        id: result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            echo 'result=passed' >> "$GITHUB_OUTPUT"
          else
            echo 'result=failed' >> "$GITHUB_OUTPUT"
          fi
      - name: Alert Discord about a failed daily production call
        if: always() && job.status != 'success' && github.event_name == 'schedule' && (inputs.environment || 'production') == 'production'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.CHALK_ALERTS_DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg content "Daily production real-call proof failed: $RUN_URL" '{content: $content}' \
            | curl --fail --silent --show-error -H 'Content-Type: application/json' --data @- "$DISCORD_WEBHOOK_URL"
