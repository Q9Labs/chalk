name: Rollback rehearsal
# Weekly: on a host this run creates and ends, deploy the newest passed nightly cut, then take the one before it through the same host
# controller, as a rollback does (scripts/nightly-host-proof/run --rollback-manifest). The rollback on 23 Oct failed because the older
# release's controller could not read the pointer the newer one wrote. This run fails when that happens again.
# Cost: one on-demand t4g.small for about 15 minutes, under 0.01 USD, and about 20 free runner minutes.
on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
permissions: {}
concurrency:
  group: chalk-nightly-host-proof-run
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # Planning downloads the manifests of cuts that are not promoted.
      contents: read
      deployments: read
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
    outputs:
      current: ${{ steps.plan.outputs.current }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - name: Refuse non-master dispatch before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Pick the two newest passed nightly cuts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/releases/rehearsal.py plan
  rehearse:
    name: Deploy, then roll back
    needs: plan
    runs-on: ubuntu-24.04
    # The environment accepts master only, and only it can assume the AWS role: a pull request never reaches AWS.
    environment:
      name: nightly-host-proof
      deployment: false
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.plan.outputs.current).target_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
      - name: Download the current cut's release manifest
        uses: ./.github/actions/download-sealed
        with:
          key: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
          name: release-manifest-${{ fromJSON(needs.plan.outputs.current).release_id }}
          path: ${{ runner.temp }}/current
          run-id: ${{ fromJSON(needs.plan.outputs.current).run_id }}
          merge-multiple: true
      - name: Download the previous cut's release manifest
        uses: ./.github/actions/download-sealed
        with:
          key: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
          name: release-manifest-${{ fromJSON(needs.plan.outputs.previous).release_id }}
          path: ${{ runner.temp }}/previous
          run-id: ${{ fromJSON(needs.plan.outputs.previous).run_id }}
          merge-multiple: true
      - name: Configure the host-proof role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.CHALK_HOST_PROOF_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-duration-seconds: 3600
      - name: Deploy the current cut, then roll back to the previous one
        env:
          AMI: ${{ secrets.CHALK_HOST_PROOF_AMI }}
          SUBNET: ${{ secrets.CHALK_HOST_PROOF_SUBNET }}
          SECURITY_GROUP: ${{ secrets.CHALK_HOST_PROOF_SECURITY_GROUP }}
          CURRENT_RELEASE: ${{ fromJSON(needs.plan.outputs.current).release_id }}
          PREVIOUS_RELEASE: ${{ fromJSON(needs.plan.outputs.previous).release_id }}
        run: |
          scripts/nightly-host-proof/run --manifest "$RUNNER_TEMP/current/$CURRENT_RELEASE.json" \
            --rollback-manifest "$RUNNER_TEMP/previous/$PREVIOUS_RELEASE.json" --run-id "$GITHUB_RUN_ID" \
            --ami "$AMI" --subnet "$SUBNET" --security-group "$SECURITY_GROUP" --summary "$GITHUB_STEP_SUMMARY"
  page:
    needs: [plan, rehearse]
    if: always() && github.event_name == 'schedule' && (needs.plan.result == 'failure' || needs.rehearse.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Page Oncall when the weekly rehearsal fails
        env:
          ONCALL_WEBHOOK_URL: ${{ secrets.ONCALL_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg detail "Weekly rollback rehearsal failed: the previous release may not restore. $RUN_URL" \
            '{source: "oncall-poller", incidents: [{app: "chalk", kind: "new", key: "rollback-rehearsal", detail: $detail}]}' \
            | curl --fail --silent --show-error -H 'Content-Type: application/json' --data @- "$ONCALL_WEBHOOK_URL"
