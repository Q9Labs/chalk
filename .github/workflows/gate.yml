name: Gate

# Required status checks: "Root gate", "API gate", "Sync gate".
# A pull request runs only the jobs and lanes its changed inputs select; a skipped job counts as passed.
# Merge queue groups select against the group's base commit with the wider pre-narrowing rules and run the
# dashboard engine and the call lanes for every change beyond documentation, so master only receives commits whose Gate
# passed as the exact commit that lands.
# Manual runs and the weekly run run every job and lane in full. A push to master runs Cache warm-up, which saves the
# caches that pull requests and queue groups start from. Daily vulnerability scans run in Daily vulnerability scan.
# The pre-commit hook runs only the fast lanes; this workflow is the full verification.
# A draft pull request runs no job: a draft cannot merge, so the required checks have nothing to report on it. Marking it
# ready starts the Gate (ready_for_review), and so does every later push. Select gate jobs is the only job that decides
# this; every job below stands down when it was skipped.
#
# Runner: a merge group or a manual run uses the label in the repository variable CHALK_GATE_RUNNER (or the manual run's
# runner input) for every job, and the hosted runners when both are empty. This file sends no pull request job to that
# label. A pull request can change this file, so what keeps fork code off our machines is the setting that holds fork
# runs for approval and the rule of whoever serves the label (see the pull request that added this block), not this text.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    # Drift between lanes and master surfaces here weekly. New advisories against packages nobody changed fail the
    # daily vulnerability scan, not unrelated pull requests.
    - cron: "17 1 * * 1"
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label for every job of this run, such as instabox. Empty uses CHALK_GATE_RUNNER, then the hosted runners.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run. A merge queue group, a scheduled run and a manual run each get
  # their own group by commit and never cancel, so a queued group is never lost to a later one.
  group: chalk-gate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  # setup-beam reads the image name from ImageOS. The hosted ubuntu-24.04 runner sets the same value; a self-hosted runner sets none.
  ImageOS: ubuntu24
  # A registry that answers 500 for a moment must not fail a job: pnpm retries its fetches longer than its default of two.
  PNPM_CONFIG_FETCH_RETRIES: "5"
  PNPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"

jobs:
  changes:
    name: Select gate jobs
    if: github.event.pull_request.draft != true
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && (inputs.runner || vars.CHALK_GATE_RUNNER) || 'ubuntu-slim' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      api: ${{ steps.select.outputs.api }}
      sync: ${{ steps.select.outputs.sync }}
      root_groups: ${{ steps.select.outputs.root_groups }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .tool-versions

      # A queue group repeats checks its pull request already passed. This looks for the proof that run saved for the
      # pull request's head; any failure here means no proof, and the group runs everything it ran before.
      - name: Find the pull request's Gate proof
        if: github.event_name == 'merge_group'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          number="$(sed -nE 's#^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-.*#\1#p' <<<"${QUEUE_REF}")"
          [[ -n "${number}" ]] || { echo "No pull request number in ${QUEUE_REF}"; exit 0; }
          head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq .head.sha)"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/gate.yml/runs?event=pull_request&head_sha=${head}&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          [[ -n "${run}" ]] || { echo "Pull request ${number} has no passed Gate run for ${head}"; exit 0; }
          gh run download "${run}" --repo "${GITHUB_REPOSITORY}" --name gate-proof --dir "${RUNNER_TEMP}/gate-proof"
          # The proof names the commit it covers; a proof for another head is not used.
          [[ "$(jq -r .head "${RUNNER_TEMP}/gate-proof/gate-proof.json")" == "${head}" ]] && echo "PROOF_FILE=${RUNNER_TEMP}/gate-proof/gate-proof.json" >> "${GITHUB_ENV}"

      - name: Select jobs from changed paths
        id: select
        env:
          GATE_EVENT: ${{ github.event_name }}
          # A merge queue group diffs against the commit it was built on, which may be an earlier group's head.
          DIFF_BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "merge_group" ]]; then
            node scripts/gates/chalk-gate-plan.mjs --ci-jobs "${DIFF_BASE}" ${PROOF_FILE:+--proof "${PROOF_FILE}"} >> "${GITHUB_OUTPUT}"
          else
            node scripts/gates/chalk-gate-plan.mjs --ci-jobs --full >> "${GITHUB_OUTPUT}"
          fi
          cat "${GITHUB_OUTPUT}"

  # Jobs narrow a pull request only when Select gate jobs succeeded and reported full=false. A failed job can still
  # export outputs it wrote before failing, so every job below runs in full unless the selection succeeded.
  root-lanes:
    name: Root ${{ matrix.group }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' }}
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && (inputs.runner || vars.CHALK_GATE_RUNNER) || 'ubuntu-24.04' }}
    # actions: read downloads the latest master scorecard; pull-requests: write updates the one scorecard comment.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    # Includes up to 12m of browser setup (usually under a minute): tests/bundles take ~12m each; leaks take ~27m.
    timeout-minutes: ${{ fromJSON('{"browser-tests":27,"dashboard-engine":27,"dashboard-refresh":27,"call-leaks-1":57,"call-leaks-2":57,"call-leaks-3":57}')[matrix.group] || 30 }}
    strategy:
      fail-fast: false
      # One run holds at most eight root runners, so a full run takes 10 of the organisation's 20 hosted-runner slots
      # (eight root groups, API and Sync). Four left the last groups of a full run waiting 6 to 10 minutes for a slot
      # while the slots were free (runner queue was under 10 seconds for the first four), and the work is the same
      # whichever order it runs in. The matrix lists the slowest groups first so they start first.
      max-parallel: 8
      matrix:
        group: ${{ fromJSON(needs.changes.result == 'success' && needs.changes.outputs.root_groups || '["checks", "sfu", "browser-tests", "dashboard-engine", "dashboard-refresh", "call-leaks-1", "call-leaks-2", "call-leaks-3", "build"]') }}
    env:
      # A pull request fails only on vulnerability findings that its base branch lacks; full runs fail on every finding.
      GATE_VULN_BASE_REF: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && needs.changes.result == 'success' && needs.changes.outputs.full == 'false' && (github.event.merge_group.base_sha || format('origin/{0}', github.base_ref)) || '' }}
      # A queue group compares with the exact commit it was built on, so an advisory that master already had does not block it.
      GATE_OSV_BASE_COMMIT: ${{ github.event.merge_group.base_sha || '' }}
      GATE_WORKSPACE_CONCURRENCY: "2"
      VITEST_MAX_WORKERS: "4"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.8.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .tool-versions
          cache: pnpm

      # Go runs the generated-output and contract checks.
      - name: Set up Go
        if: matrix.group == 'checks' || matrix.group == 'sfu' || startsWith(matrix.group, 'dashboard-')
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/api/go.mod
          cache: false

      - name: Set up Erlang and Elixir for the dashboard engine proof
        if: startsWith(matrix.group, 'dashboard-')
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          version-file: .tool-versions
          version-type: strict

      # The dashboard proofs run mix deps.get. cache-warm.yml saves these on master, so a Hex outage cannot fail a pull
      # request whose mix.lock did not change. The path list must match the saved entry exactly.
      - name: Restore Mix dependencies
        if: startsWith(matrix.group, 'dashboard-')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            apps/sync/deps
            apps/sync/_build
          key: sync-mix-${{ runner.os }}-${{ hashFiles('apps/sync/mix.lock') }}
          # A changed mix.lock still starts from the last saved dependencies, so only the changed packages come from Hex.
          restore-keys: sync-mix-${{ runner.os }}-

      - name: Install the dashboard database client
        if: startsWith(matrix.group, 'dashboard-')
        uses: ./.github/actions/apt-install
        with:
          packages: postgresql-client

      - name: Restore Go caches
        if: matrix.group == 'checks' || matrix.group == 'sfu' || startsWith(matrix.group, 'dashboard-')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-root-checks-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/**/*.go') }}
          restore-keys: go-root-checks-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # The recorder lane runs scripts/recorder/gate.sh, which needs tofu.
      - name: Set up OpenTofu
        if: matrix.group == 'checks'
        uses: ./.github/actions/setup-opentofu

      # Providers come from the cache that cache-warm.yml saves on master, so a flaky github.com download cannot fail
      # a queue group. A cache miss falls back to the download, which scripts/recorder/tofu-init.sh retries.
      - name: Restore OpenTofu providers
        if: matrix.group == 'checks'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.terraform.d/plugin-cache
          key: tofu-providers-${{ runner.os }}-${{ hashFiles('infrastructure/recorder/.terraform.lock.hcl') }}

      - name: Use the OpenTofu provider cache
        if: matrix.group == 'checks'
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Set up security scanners
        if: matrix.group == 'checks'
        uses: ./.github/actions/setup-scanners

      # Browser tests, the call bundle budget (in the build group) and leak journeys all drive Chromium.
      - name: Install browser runtime
        if: contains(fromJSON('["browser-tests", "dashboard-refresh", "build", "call-leaks-1", "call-leaks-2", "call-leaks-3"]'), matrix.group)
        timeout-minutes: 12
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      # call-performance runs in the build group for call UI changes;
      # GitHub enforces gzip budgets; timing limits need a calibrated runner.
      # Metro reuses transforms of unchanged modules, so the mobile export takes seconds instead of a minute.
      - name: Restore Metro cache
        if: matrix.group == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ github.sha }}
          restore-keys: metro-${{ runner.os }}-

      # API and Sync have their own jobs below, so the root gate leaves its service lane out.
      - name: Run the ${{ matrix.group }} lanes
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_LANE_GROUP: ${{ matrix.group }}
          GATE_SERVICES: external
          SFU_TEST_JSON: ${{ github.workspace }}/artifacts/sfu-tests.json
          GATE_BASE_REF: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref || 'master') }}
          # A queue group scans every commit it brings in for secrets.
          GITLEAKS_LOG_OPTS: ${{ github.event_name == 'merge_group' && format('{0}..{1}', github.event.merge_group.base_sha, github.sha) || '' }}
        run: |
          if [[ ("${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "merge_group") && "${{ needs.changes.result }}" == "success" && "${{ needs.changes.outputs.full }}" == "false" ]]; then
            pnpm exec bash scripts/gates/commit.sh --base "${GATE_BASE_REF}"
          else
            pnpm exec bash scripts/gates/commit.sh --full
          fi

      # The scorecard reads the reports the lanes above wrote: the call bundle sizes in the build group and the SFU
      # loopback and impairment tests in the sfu group. It adds no job; a lane that did not run leaves no report.
      - name: Score the run against the latest master run
        if: ${{ !cancelled() && (matrix.group == 'build' || matrix.group == 'sfu') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CAN_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: features/scorecard/pr-tier.sh ${{ matrix.group == 'build' && 'web' || 'sfu' }}

      - name: Save the scorecard
        if: ${{ !cancelled() && (matrix.group == 'build' || matrix.group == 'sfu') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scorecard-${{ matrix.group == 'build' && 'web' || 'sfu' }}
          path: artifacts/scorecard-*.json
          if-no-files-found: ignore

      - name: Save leak shard report
        if: always() && startsWith(matrix.group, 'call-leaks-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.group }}
          path: artifacts/${{ matrix.group }}.json
          if-no-files-found: error

  root:
    name: Root gate
    needs: [changes, root-lanes]
    if: ${{ always() && needs.changes.result != 'skipped' }}
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && (inputs.runner || vars.CHALK_GATE_RUNNER) || 'ubuntu-slim' }}
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .tool-versions

      - name: Download leak shard reports
        if: needs.changes.result != 'success' || contains(needs.changes.outputs.root_groups || '', 'call-leaks-')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: call-leaks-*
          path: artifacts
          merge-multiple: true

      - name: Require complete leak journey coverage
        if: needs.changes.result != 'success' || contains(needs.changes.outputs.root_groups || '', 'call-leaks-')
        env:
          LEAK_GROUPS: ${{ needs.changes.result == 'success' && needs.changes.outputs.root_groups || '["call-leaks-1", "call-leaks-2", "call-leaks-3"]' }}
          ROOT_LANES_RESULT: ${{ needs.root-lanes.result }}
        run: |
          missing=0
          for shard in 1 2 3; do
            if [[ ! -f "artifacts/call-leaks-${shard}.json" ]]; then
              echo "::error::Shard call-leaks-${shard} left no report. Its job was never created, or it failed before it saved one (root lane groups: ${ROOT_LANES_RESULT})."
              missing=1
            fi
          done
          [[ "${missing}" == "0" ]]
          node --input-type=module <<'JS'
          const shards = JSON.parse(process.env.LEAK_GROUPS).filter((group) => group.startsWith("call-leaks-"));
          if (shards.length && JSON.stringify(shards.sort()) !== JSON.stringify(["call-leaks-1", "call-leaks-2", "call-leaks-3"])) throw new Error("Incomplete leak shard plan");
          JS
          node apps/web/scripts/call-leak-check.mjs --check-shards artifacts/call-leaks-{1,2,3}.json

      - name: Require every root lane group to pass
        run: |
          echo "Select gate jobs: ${{ needs.changes.result }}; root lane groups: ${{ needs.root-lanes.result }}"
          [[ "${{ needs.root-lanes.result }}" == "success" ]]

  api:
    name: API gate
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && (needs.changes.outputs.api == 'true' || needs.changes.result != 'success') }}
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && (inputs.runner || vars.CHALK_GATE_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      GATE_VULN_BASE_REF: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && needs.changes.result == 'success' && needs.changes.outputs.full == 'false' && (github.event.merge_group.base_sha || format('origin/{0}', github.base_ref)) || '' }}
      GOMAXPROCS: "2"
      # A cached Go test result would not see migration or database changes.
      GOFLAGS: -buildvcs=false -count=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The vulnerability check compares a pull request with its merge base.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.8.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/api/go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-api-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/**/*.go') }}
          restore-keys: go-api-${{ runner.os }}-

      # The migration proofs run mix deps.get in apps/sync.
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          version-file: .tool-versions
          version-type: strict

      # The lifecycle smoke test is a Node script.
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # The gate starts its own PostgreSQL container through scripts/gates/with-postgres.sh.
      - name: Run the API gate
        run: apps/api/scripts/gate.sh

  # The Sync server tests and the client proofs against it take about three minutes each, so they run side by side.
  sync-parts:
    name: Sync ${{ matrix.part }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && (needs.changes.outputs.sync == 'true' || needs.changes.result != 'success') }}
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && (inputs.runner || vars.CHALK_GATE_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [server, clients]
    env:
      GATE_VULN_BASE_REF: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && needs.changes.result == 'success' && needs.changes.outputs.full == 'false' && (github.event.merge_group.base_sha || format('origin/{0}', github.base_ref)) || '' }}
      GOMAXPROCS: "2"
      VITEST_MAX_WORKERS: "4"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.8.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .tool-versions
          cache: pnpm

      # Go applies the API migrations to the gate database.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/api/go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-sync-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/**/*.go') }}
          restore-keys: go-sync-${{ runner.os }}-

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # cache-warm.yml saves this on master; a queue group's own save would be unreadable by anything else.
      - name: Restore Mix dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            apps/sync/deps
            apps/sync/_build
          key: sync-mix-${{ runner.os }}-${{ hashFiles('apps/sync/mix.lock') }}
          # A changed mix.lock still starts from the last saved dependencies, so only the changed packages come from Hex.
          restore-keys: sync-mix-${{ runner.os }}-

      - name: Install Chromium for the browser reconnection proof
        if: matrix.part == 'clients'
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      # The correctness harness uses one isolated PostgreSQL database for the Sync and SDK proofs.
      - name: Run the Sync ${{ matrix.part }} part of the correctness harness
        run: scripts/gates/with-postgres.sh -- apps/sync/scripts/reliability-correctness ${{ matrix.part }}

  # The required context. A part the planner did not select is skipped, which counts as passed.
  sync:
    name: Sync gate
    needs: [changes, sync-parts]
    if: ${{ always() && needs.changes.result != 'skipped' }}
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && (inputs.runner || vars.CHALK_GATE_RUNNER) || 'ubuntu-slim' }}
    timeout-minutes: 5
    steps:
      - name: Require every Sync part to pass
        run: |
          echo "Sync parts: ${{ needs.sync-parts.result }}"
          [[ "${{ needs.sync-parts.result }}" == "success" || "${{ needs.sync-parts.result }}" == "skipped" ]]

  # What this pull request's run proved, for its merge queue group to reuse (see the Find step in "Select gate jobs").
  proof:
    name: Gate proof
    needs: [changes, root-lanes, api, sync]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.root-lanes.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.api.result) && contains(fromJSON('["success", "skipped"]'), needs.sync.result) }}
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && (inputs.runner || vars.CHALK_GATE_RUNNER) || 'ubuntu-slim' }}
    timeout-minutes: 5
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      # The checkout is the merge of the pull request head (second parent) into the base it was tested on (first parent).
      - name: Write the proof
        env:
          API: ${{ needs.changes.outputs.api }}
          SYNC: ${{ needs.changes.outputs.sync }}
          ROOT_GROUPS: ${{ needs.changes.outputs.root_groups }}
        run: |
          mkdir -p gate-proof
          jq -n --arg head "$(git rev-parse HEAD^2)" --arg base "$(git rev-parse HEAD^1)" --argjson api "${API}" --argjson sync "${SYNC}" --argjson groups "${ROOT_GROUPS}" \
            '{head: $head, base: $base, api: $api, sync: $sync, rootGroups: $groups}' | tee gate-proof/gate-proof.json

      - name: Save the proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-proof
          path: gate-proof/gate-proof.json
          retention-days: 7
