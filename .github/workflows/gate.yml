name: Gate

# Required status checks: "Root gate", "API gate", "Sync gate".
# A pull request runs only the jobs and lanes its diff selects; a skipped job counts as passed.
# Pushes to master, manual runs and the nightly run run every job and lane in full, and only pushes to master
# save caches, so every pull request starts from the caches of the latest master run.
# The pre-commit hook runs only the fast lanes; this workflow is the full verification.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # New advisories against packages nobody changed fail here, not on unrelated pull requests.
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run; every master commit keeps its own full run.
  group: chalk-gate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  changes:
    name: Select gate jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.select.outputs.api }}
      sync: ${{ steps.select.outputs.sync }}
      root_groups: ${{ steps.select.outputs.root_groups }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .tool-versions

      - name: Select jobs from changed paths
        id: select
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/gates/chalk-gate-plan.mjs --ci-jobs "origin/${BASE_REF}" >> "${GITHUB_OUTPUT}"
          else
            node scripts/gates/chalk-gate-plan.mjs --ci-jobs --full >> "${GITHUB_OUTPUT}"
          fi
          cat "${GITHUB_OUTPUT}"

  # Jobs narrow a pull request only when Select gate jobs reports full=false, so a selection that fails or leaves no
  # output runs every job below in full.
  root-lanes:
    name: Root ${{ matrix.group }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Includes median Chromium setup (~9.5m): tests/bundles take ~12m each; leaks take ~27m.
    timeout-minutes: ${{ fromJSON('{"browser-tests":24,"call-performance":24,"call-leaks":54}')[matrix.group] || 30 }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.root_groups || '["checks", "tests", "browser-tests", "call-performance", "call-leaks", "build"]') }}
    env:
      # A pull request fails only on vulnerability findings that its base branch lacks; full runs fail on every finding.
      GATE_VULN_BASE_REF: ${{ github.event_name == 'pull_request' && needs.changes.outputs.full == 'false' && format('origin/{0}', github.base_ref) || '' }}
      GATE_WORKSPACE_CONCURRENCY: "2"
      VITEST_MAX_WORKERS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.8.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .tool-versions
          cache: pnpm

      # Go runs the generated-output and contract checks.
      - name: Set up Go
        if: matrix.group == 'checks'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/api/go.mod
          cache: false

      - name: Restore Go caches
        if: matrix.group == 'checks'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-root-checks-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/**/*.go') }}
          restore-keys: go-root-checks-${{ runner.os }}-

      - name: Install Semgrep
        if: matrix.group == 'checks'
        run: pipx install semgrep==1.179.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # The recorder lane runs scripts/recorder/gate.sh, which needs tofu.
      - name: Set up OpenTofu
        if: matrix.group == 'checks'
        uses: ./.github/actions/setup-opentofu

      - name: Set up security scanners
        if: matrix.group == 'checks'
        uses: ./.github/actions/setup-scanners

      # Browser tests, call bundle budgets and leak journeys all drive Chromium.
      - name: Install browser runtime
        if: contains(fromJSON('["browser-tests", "call-performance", "call-leaks"]'), matrix.group)
        run: pnpm --dir sdks/typescript/client exec playwright install --with-deps chromium

      # call-performance runs in the root gate for call rendering changes;
      # GitHub enforces gzip budgets, while testbox enforces timing too.
      # Metro reuses transforms of unchanged modules, so the mobile export takes seconds instead of a minute.
      - name: Restore Metro cache
        if: matrix.group == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ github.sha }}
          restore-keys: metro-${{ runner.os }}-

      # API and Sync have their own jobs below, so the root gate leaves its service lane out.
      - name: Run the ${{ matrix.group }} lanes
        env:
          GATE_LANE_GROUP: ${{ matrix.group }}
          GATE_SERVICES: external
          GATE_BASE_REF: origin/${{ github.base_ref || 'master' }}
          # A push to master scans every pushed commit for secrets, including the commits a merge brings in.
          GITLEAKS_LOG_OPTS: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || '' }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ needs.changes.outputs.full }}" == "false" ]]; then
            pnpm exec bash scripts/gates/commit.sh --base "${GATE_BASE_REF}"
          else
            pnpm exec bash scripts/gates/commit.sh --full
          fi

      - name: Save Metro cache
        if: matrix.group == 'build' && github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ github.sha }}

      - name: Save Go caches
        if: matrix.group == 'checks' && github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-root-checks-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/**/*.go') }}

  root:
    name: Root gate
    needs: [changes, root-lanes]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every root lane group to pass
        run: |
          echo "Select gate jobs: ${{ needs.changes.result }}; root lane groups: ${{ needs.root-lanes.result }}"
          [[ "${{ needs.root-lanes.result }}" == "success" ]]

  api:
    name: API gate
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.api == 'true' || needs.changes.result != 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GATE_VULN_BASE_REF: ${{ github.event_name == 'pull_request' && needs.changes.outputs.full == 'false' && format('origin/{0}', github.base_ref) || '' }}
      GOMAXPROCS: "2"
      # A cached Go test result would not see migration or database changes.
      GOFLAGS: -buildvcs=false -count=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The vulnerability check compares a pull request with its merge base.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.8.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/api/go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-api-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/**/*.go') }}
          restore-keys: go-api-${{ runner.os }}-

      # The migration proofs run mix deps.get in apps/sync.
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          version-file: .tool-versions
          version-type: strict

      # The lifecycle smoke test is a Node script.
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # The gate starts its own PostgreSQL container through scripts/gates/with-postgres.sh.
      - name: Run the API gate
        run: apps/api/scripts/gate.sh

      - name: Save Go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-api-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/**/*.go') }}

  sync:
    name: Sync gate
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.sync == 'true' || needs.changes.result != 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GATE_VULN_BASE_REF: ${{ github.event_name == 'pull_request' && needs.changes.outputs.full == 'false' && format('origin/{0}', github.base_ref) || '' }}
      GOMAXPROCS: "2"
      VITEST_MAX_WORKERS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.8.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .tool-versions
          cache: pnpm

      # Go applies the API migrations to the gate database.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/api/go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-sync-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/**/*.go') }}
          restore-keys: go-sync-${{ runner.os }}-

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Mix dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            apps/sync/deps
            apps/sync/_build
          key: sync-mix-${{ runner.os }}-${{ hashFiles('apps/sync/mix.lock') }}

      # The correctness harness runs the full Sync gate first, then the breaker, replay, and SDK sync tests,
      # against one PostgreSQL container.
      - name: Run the Sync gate and correctness harness
        run: scripts/gates/with-postgres.sh apps/sync/scripts/reliability-correctness

      - name: Save Go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-sync-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/**/*.go') }}
