name: Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character commit SHA whose latest Gate run on master passed
        required: true
        type: string
      release_managed:
        description: Build the changed API or Sync image and emit a managed release manifest
        required: true
        default: true
        type: boolean
      deploy_managed:
        description: Deploy the managed release through the pinned SSM controller
        required: true
        default: false
        type: boolean
      enforce_entry_ownership:
        description: Enable entry ownership after an expanded API/Sync release is the stable rollback baseline
        required: false
        default: false
        type: boolean
      enable_recorder_control:
        description: Include recorder control and media on nightly; production also preserves an enabled baseline
        required: true
        default: false
        type: boolean
      managed_environment:
        description: Configured GitHub environment and managed host target
        required: true
        default: nightly
        type: string
      managed_secret_exclusions:
        description: Comma-separated canonical runtime input IDs allowed to be missing
        required: false
        type: string
      stable_manifest_run_id:
        description: Run ID whose release manifest is the current stable baseline; omit only for the first release
        required: false
        type: string
      stable_manifest_artifact_id:
        description: Exact build baseline artifact within the baseline run (recommended after reruns)
        required: false
        type: string
      deploy_web:
        description: Run the CI web deployment fallback
        required: true
        default: false
        type: boolean
      web_artifact:
        description: JSON artifact_id and sha256 of the prebuilt target web archive
        type: string
      pages_rollback_id:
        description: Restore this saved production Pages deployment instead of uploading web
        type: string
      manifest_run_id:
        description: Exact artifact-producing run to reuse; skips planning and all builds
        type: string
      manifest_artifact_id:
        description: Exact immutable backend artifact ID (reuse mode)
        type: string
      rollback_media:
        description: Retained legacy media JSON from the promotion rollback artifact
        type: string
      media_sha256:
        description: SHA256 of the immutable media release members in reuse mode
        type: string
      manifest_sha256:
        description: SHA256 of backend manifest bytes (reuse mode)
        type: string
      reuse_release_id:
        description: Source release ID (reuse mode)
        type: string
  workflow_call:
    inputs:
      target_sha:
        required: false
        type: string
      release_managed:
        required: false
        default: true
        type: boolean
      deploy_managed:
        required: false
        default: false
        type: boolean
      enforce_entry_ownership:
        required: false
        default: false
        type: boolean
      enable_recorder_control:
        required: false
        default: false
        type: boolean
      managed_environment:
        required: false
        default: nightly
        type: string
      managed_secret_exclusions:
        required: false
        type: string
      stable_manifest_run_id:
        required: false
        type: string
      stable_manifest_artifact_id:
        required: false
        type: string
      deploy_web:
        required: false
        default: false
        type: boolean
      web_artifact:
        type: string
      pages_rollback_id:
        type: string
      manifest_run_id:
        type: string
      manifest_artifact_id:
        type: string
      manifest_sha256:
        type: string
      reuse_release_id:
        type: string
      media_sha256:
        type: string
      rollback_media:
        type: string
      orchestrated:
        type: boolean
        default: false
    outputs:
      release_id:
        value: ${{ jobs.prepare-release.outputs.release_id }}
      applied_release_id:
        value: ${{ jobs.deploy-managed.outputs.release_id }}
      run_id:
        value: ${{ github.run_id }}
      manifest_artifact_id:
        value: ${{ jobs.prepare-release.outputs.manifest_artifact_id }}
      manifest_sha256:
        value: ${{ jobs.prepare-release.outputs.manifest_sha256 }}
      media_sha256:
        value: ${{ jobs.prepare-release.outputs.media_sha256 }}
      web:
        value: ${{ jobs.prepare-web.outputs.web }}
      restored_source_release_id:
        value: ${{ jobs.deploy-managed.outputs.restored_source_release_id }}
      pages_deployment_id:
        value: ${{ jobs.deploy-web.outputs.pages_deployment_id }}

run-name: Release ${{ inputs.target_sha }}

permissions:
  contents: read
  actions: read
  deployments: write
  id-token: write

env:
  TARGET_SHA: ${{ inputs.target_sha }}

concurrency:
  group: ${{ inputs.orchestrated && format('chalk-release-child-{0}', github.run_id) || format('chalk-environment-{0}', inputs.managed_environment) }}
  cancel-in-progress: false

jobs:
  # Every fresh build needs the exact target to have passed the Gate on master, like nightly and promote check.
  # The check runs the workflow's own release tooling, not the target's.
  require-gate:
    name: Require a green master Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require the target's latest master Gate run to pass
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_RUN_ID: ${{ inputs.manifest_run_id }}
          ENFORCE_ENTRY_OWNERSHIP: ${{ inputs.enforce_entry_ownership }}
          RELEASE_MANAGED: ${{ inputs.release_managed }}
          DEPLOY_MANAGED: ${{ inputs.deploy_managed }}
          DEPLOY_WEB: ${{ inputs.deploy_web }}
        run: python3 scripts/releases/release.py require_gate

  plan-managed:
    name: Plan managed components
    needs: require-gate
    if: (inputs.release_managed || inputs.deploy_managed) && inputs.manifest_run_id == ''
    runs-on: ubuntu-24.04
    outputs:
      build_set: ${{ steps.plan.outputs.build_set }}
      release_id: ${{ steps.plan.outputs.release_id }}
      should_publish: ${{ steps.plan.outputs.should_publish }}
      recorder_control: ${{ steps.plan.outputs.recorder_control }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Set up Go for recorder dependency planning
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Validate release source and pre-deploy contracts
        env:
          DEPLOY_MANAGED: ${{ inputs.deploy_managed }}
          RELEASE_MANAGED: ${{ inputs.release_managed }}
          MANAGED_ENVIRONMENT: ${{ inputs.managed_environment }}
        run: scripts/releases/check-contracts.sh --plan

      - name: Download stable release manifest
        if: inputs.stable_manifest_run_id != '' && inputs.stable_manifest_artifact_id == ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.stable_manifest_run_id }}
          pattern: release-manifest-*
          path: ${{ runner.temp }}/stable-download
          merge-multiple: true

      - name: Download exact build baseline artifact
        if: inputs.stable_manifest_run_id != '' && inputs.stable_manifest_artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.stable_manifest_run_id }}
          artifact-ids: ${{ inputs.stable_manifest_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/stable-download

      - name: Plan changed components
        id: plan
        env:
          DEPLOY_MANAGED: ${{ inputs.deploy_managed }}
          PLAN_ROOT: ${{ runner.temp }}/managed-release-plan
          ENABLE_RECORDER_CONTROL: ${{ inputs.enable_recorder_control }}
          ENFORCE_ENTRY_OWNERSHIP: ${{ inputs.enforce_entry_ownership }}
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_ROOT"

          stable_manifest=""
          if [[ -n "${{ inputs.stable_manifest_run_id }}" ]]; then
            mapfile -t manifests < <(find "${{ runner.temp }}/stable-download" -type f -name '*.json' ! -name '*.media.json' | sort)
            if [[ "${#manifests[@]}" != 1 ]]; then
              echo "expected exactly one stable release manifest, found ${#manifests[@]}" >&2
              exit 1
            fi
            stable_manifest="$PLAN_ROOT/stable-manifest.json"
            cp "${manifests[0]}" "$stable_manifest"
            media="${manifests[0]%.json}.media.json"
            if [[ -f "$media" ]]; then cp "$media" "$PLAN_ROOT/stable-media.json"; fi
            base_sha="$(jq -er '.source_revision' "$stable_manifest")"
            git cat-file -e "${base_sha}^{commit}"
            git merge-base --is-ancestor "$base_sha" "$TARGET_SHA" || {
              echo "stable manifest source is not an ancestor of target_sha" >&2
              exit 1
            }
            mapfile -d '' changed_paths < <(git diff --name-only -z "$base_sha...$TARGET_SHA")
            if [[ "${#changed_paths[@]}" == 0 ]]; then
              infrastructure/managed-episode/scripts/plan-release-components --component none > "$PLAN_ROOT/plan.json"
            else
              infrastructure/managed-episode/scripts/plan-release-components -- "${changed_paths[@]}" > "$PLAN_ROOT/plan.json"
            fi
          else
            infrastructure/managed-episode/scripts/plan-release-components --component both > "$PLAN_ROOT/plan.json"
          fi

          recorder_control="$ENABLE_RECORDER_CONTROL"
          if [[ "${{ inputs.managed_environment }}" != nightly && -n "$stable_manifest" ]] && jq -e '.images | has("recorder_control")' "$stable_manifest" >/dev/null; then
            recorder_control=true
          fi
          if [[ "${{ inputs.managed_environment }}" == nightly && "$recorder_control" != true && -n "$stable_manifest" ]]; then
            jq 'del(.images.recorder_control)' "$stable_manifest" > "$PLAN_ROOT/backend-baseline.json"
            mv "$PLAN_ROOT/backend-baseline.json" "$stable_manifest"
          elif [[ "$recorder_control" == true ]] && { [[ -z "$stable_manifest" ]] || ! jq -e '.images | has("recorder_control")' "$stable_manifest" >/dev/null; }; then
            infrastructure/managed-episode/scripts/plan-release-components --component both > "$PLAN_ROOT/plan.json"
          fi
          jq -e '.build_set == [] or .build_set == ["api"] or .build_set == ["sync"] or .build_set == ["api", "sync"]' "$PLAN_ROOT/plan.json" >/dev/null
          classification="$(jq -r '.classification' "$PLAN_ROOT/plan.json")"
          build_set="$(jq -c '.build_set' "$PLAN_ROOT/plan.json")"
          if [[ "$classification" == none && "$build_set" != '[]' ]]; then
            echo "runtime-only classification must not request application images" >&2
            exit 1
          fi
          if [[ "$classification" == none && ( "$DEPLOY_MANAGED" == "true" || "${ENFORCE_ENTRY_OWNERSHIP:-false}" == true ) ]]; then
            should_publish=true
          else
            should_publish="$(jq -r 'if (.build_set | length) > 0 then "true" else "false" end' "$PLAN_ROOT/plan.json")"
          fi
          if [[ "$DEPLOY_MANAGED" == "true" && "$should_publish" != "true" ]]; then
            echo "deploy_managed requires an application component or runtime-only change" >&2
            exit 1
          fi
          release_id="managed-episode-$(date -u +%Y%m%dT%H%M%SZ)-${TARGET_SHA:0:8}-$(openssl rand -hex 4)"
          {
            printf 'build_set=%s\n' "$build_set"
            printf 'should_publish=%s\n' "$should_publish"
            printf 'release_id=%s\n' "$release_id"
            printf 'recorder_control=%s\n' "$recorder_control"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release plan
        uses: actions/upload-artifact@v4
        with:
          name: managed-release-plan-${{ steps.plan.outputs.release_id }}
          path: ${{ runner.temp }}/managed-release-plan
          retention-days: 7
          if-no-files-found: error

      - name: Plan summary
        env:
          PLAN_FILE: ${{ runner.temp }}/managed-release-plan/plan.json
        run: |
          {
            echo "## Managed release plan"
            echo "- source: \`$TARGET_SHA\`"
            echo "- classification: \`$(jq -r '.classification' "$PLAN_FILE")\`"
            echo "- build: \`$(jq -c '.build_set' "$PLAN_FILE")\`"
            echo "- recorder CPU image affected: \`$(jq -r '.recorder_image_affected' "$PLAN_FILE")\`"
            echo "- restart closure: \`$(jq -c '.restart_closure' "$PLAN_FILE")\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-managed-images:
    name: Build ${{ matrix.component }} image
    needs: plan-managed
    if: always() && !cancelled() && needs.plan-managed.outputs.should_publish == 'true' && needs.plan-managed.outputs.build_set != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan-managed.outputs.build_set) }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      ECR_REGISTRY: 688819141892.dkr.ecr.ap-southeast-1.amazonaws.com
      COMPONENT: ${{ matrix.component }}
      RELEASE_ID: ${{ needs.plan-managed.outputs.release_id }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::688819141892:role/chalk-ci-image-publish
          aws-region: ap-southeast-1

      - name: Verify signing profile is active
        run: |
          status="$(aws signer get-signing-profile --profile-name chalk_production_ecr --query status --output text)"
          if [[ "$status" != "Active" ]]; then
            echo "managed signing profile is not active (status: $status)" >&2
            exit 1
          fi

      - name: Login to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: build
        run: |
          case "$COMPONENT" in
            api)
              source_context="api_source=apps/api"
              dockerfile="infrastructure/managed-episode/images/api.Dockerfile"
              repository="chalk-api"
              ;;
            sync)
              source_context="sync_source=apps/sync"
              dockerfile="infrastructure/managed-episode/images/sync.Dockerfile"
              repository="chalk-sync"
              ;;
            *)
              echo "unsupported component: $COMPONENT" >&2
              exit 1
              ;;
          esac

          metadata_file="${RUNNER_TEMP}/${COMPONENT}-metadata.json"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=mode=max \
            --build-context "$source_context" \
            --cache-from "type=gha,scope=chalk-${COMPONENT}" \
            --cache-to "type=gha,scope=chalk-${COMPONENT},mode=max" \
            --file "$dockerfile" \
            --build-arg RELEASE_ID="$RELEASE_ID" \
            --build-arg SOURCE_REVISION="$TARGET_SHA" \
            --tag "$ECR_REGISTRY/${repository}:$RELEASE_ID" \
            --metadata-file "$metadata_file" \
            --push \
            infrastructure/managed-episode
          digest="$(jq -er '."containerimage.digest"' "$metadata_file")"
          printf '%s\n' "$ECR_REGISTRY/${repository}@$digest" > "${RUNNER_TEMP}/${COMPONENT}-image.txt"
          printf 'repository=%s\n' "$repository" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

          if [[ "$COMPONENT" == api && "${{ needs.plan-managed.outputs.recorder_control }}" == true ]]; then
            control_metadata="${RUNNER_TEMP}/recorder-control-metadata.json"
            docker buildx build \
              --platform linux/arm64 --provenance=mode=max \
              --build-context api_source=apps/api \
              --cache-from type=gha,scope=chalk-recorder-control \
              --cache-to type=gha,scope=chalk-recorder-control,mode=max \
              --file infrastructure/managed-episode/images/recorder-control.Dockerfile \
              --build-arg RELEASE_ID="$RELEASE_ID" --build-arg SOURCE_REVISION="$TARGET_SHA" \
              --tag "$ECR_REGISTRY/chalk-api:recorder-$RELEASE_ID" \
              --metadata-file "$control_metadata" --push infrastructure/managed-episode
            control_digest="$(jq -er '."containerimage.digest"' "$control_metadata")"
            printf '%s\n' "$ECR_REGISTRY/chalk-api@$control_digest" > "${RUNNER_TEMP}/recorder-control-image.txt"
            printf 'control_digest=%s\n' "$control_digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for managed signing
        run: |
          digests=("${{ steps.build.outputs.digest }}")
          if [[ -n "${{ steps.build.outputs.control_digest }}" ]]; then
            digests+=("${{ steps.build.outputs.control_digest }}")
          fi
          for digest in "${digests[@]}"; do
          for attempt in $(seq 1 60); do
            status="$(aws ecr describe-image-signing-status --repository-name "${{ steps.build.outputs.repository }}" --image-id imageDigest="$digest" --query 'signingStatuses[0].status' --output text 2>/dev/null || echo PENDING)"
            if [[ "$status" == "COMPLETE" ]]; then
              break
            fi
            if [[ "$status" == "FAILED" ]]; then
              echo "managed signing failed for $COMPONENT" >&2
              exit 1
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "managed signing did not complete for $COMPONENT (last status: $status)" >&2
              exit 1
            fi
            sleep 10
          done
          done

      - name: Upload immutable image reference
        uses: actions/upload-artifact@v4
        with:
          name: managed-image-${{ matrix.component }}-${{ env.RELEASE_ID }}
          path: |
            ${{ runner.temp }}/${{ matrix.component }}-image.txt
            ${{ runner.temp }}/recorder-control-image.txt
          retention-days: 7
          if-no-files-found: error

  build-media:
    name: Build immutable media release archives
    needs: plan-managed
    if: needs.plan-managed.outputs.should_publish == 'true' && needs.plan-managed.outputs.recorder_control == 'true' && inputs.managed_environment == 'nightly'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: nightly
    env:
      CHALK_MANAGED_RECORDER_CONFIG_PARAMETER: ${{ vars.CHALK_MANAGED_RECORDER_CONFIG_PARAMETER }}
      CHALK_MEDIA_ARTIFACT_BUCKET: ${{ vars.CHALK_MEDIA_ARTIFACT_BUCKET }}
      CHALK_TRANSCRIPTION_CORPUS_DIGEST: ${{ vars.CHALK_TRANSCRIPTION_CORPUS_DIGEST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CHALK_MANAGED_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CHALK_MANAGED_AWS_REGION }}
          role-duration-seconds: 3600
      - uses: actions/download-artifact@v4
        with:
          name: managed-release-plan-${{ needs.plan-managed.outputs.release_id }}
          path: ${{ runner.temp }}/media-plan
      - name: Prefer the qualified environment pins, including a deploy-only first install
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/releases/media.py baseline --output "$RUNNER_TEMP/media-plan/stable-media.json"
      - name: Build first-install or changed capture archive
        run: |
          args=()
          baseline="$RUNNER_TEMP/media-plan/stable-media.json"
          if [[ -f "$baseline" ]]; then args+=(--baseline "$baseline"); fi
          python3 scripts/releases/media.py build_archives --role capture "${args[@]}" --directory "$RUNNER_TEMP/media-build" --output "$RUNNER_TEMP/media.json"
      - name: Refresh credentials before the render build
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CHALK_MANAGED_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CHALK_MANAGED_AWS_REGION }}
          role-duration-seconds: 3600
      - name: Build first-install or changed render archive
        run: |
          args=()
          baseline="$RUNNER_TEMP/media-plan/stable-media.json"
          if [[ -f "$baseline" ]]; then args+=(--baseline "$baseline"); fi
          python3 scripts/releases/media.py build_archives --role render "${args[@]}" --directory "$RUNNER_TEMP/media-build" --output "$RUNNER_TEMP/media.json"
      - name: Refresh credentials before dispatcher publication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CHALK_MANAGED_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CHALK_MANAGED_AWS_REGION }}
          role-duration-seconds: 3600
      - name: Check whether dispatcher inputs changed
        id: zip-plan
        run: |
          args=()
          baseline="$RUNNER_TEMP/media-plan/stable-media.json"
          if [[ -f "$baseline" ]]; then args+=(--baseline "$baseline"); fi
          python3 scripts/releases/media.py zip_needed "${args[@]}"
      - name: Qualify and build dispatcher ZIP
        if: steps.zip-plan.outputs.build_zip == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/media-build
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/transcription-dispatcher test
          scripts/transcription-dispatcher/validate-contract.sh
          scripts/transcription-dispatcher/build-release.sh '${{ needs.plan-managed.outputs.release_id }}'
          archive=("$ARTIFACT_DIR"/*.zip)
          scripts/transcription-dispatcher/verify-artifact.sh "${archive[0]}"
      - name: Freeze versioned dispatcher ZIP and recorder image identities
        run: |
          args=()
          baseline="$RUNNER_TEMP/media-plan/stable-media.json"
          if [[ -f "$baseline" ]]; then args+=(--baseline "$baseline"); fi
          python3 scripts/releases/media.py publish_zip "${args[@]}" --release-id '${{ needs.plan-managed.outputs.release_id }}' --directory "$RUNNER_TEMP/media-build" --output "$RUNNER_TEMP/media.json"
      - uses: actions/upload-artifact@v4
        with:
          name: media-members-${{ needs.plan-managed.outputs.release_id }}
          path: ${{ runner.temp }}/media.json
          retention-days: 90
          if-no-files-found: error

  publish-managed-manifest:
    name: Publish managed release manifest
    outputs:
      artifact_id: ${{ steps.manifest-upload.outputs.artifact-id }}
      media_sha256: ${{ steps.media-hash.outputs.sha256 }}
    needs: [plan-managed, build-managed-images, build-media]
    if: >-
      always() &&
      needs.plan-managed.outputs.should_publish == 'true' &&
      (needs.build-media.result == 'success' || (needs.build-media.result == 'skipped' && (inputs.managed_environment != 'nightly' || needs.plan-managed.outputs.recorder_control != 'true'))) &&
      (needs.build-managed-images.result == 'success' || (needs.build-managed-images.result == 'skipped' && needs.plan-managed.outputs.build_set == '[]'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}

      - name: Download release plan
        uses: actions/download-artifact@v4
        with:
          pattern: managed-release-plan-${{ needs.plan-managed.outputs.release_id }}
          path: ${{ runner.temp }}/managed-release-plan
          merge-multiple: true

      - name: Download built image references
        if: needs.plan-managed.outputs.build_set != '[]'
        uses: actions/download-artifact@v4
        with:
          pattern: managed-image-*-${{ needs.plan-managed.outputs.release_id }}
          path: ${{ runner.temp }}/managed-images
          merge-multiple: true

      - name: Download immutable media members
        if: needs.build-media.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: media-members-${{ needs.plan-managed.outputs.release_id }}
          path: ${{ runner.temp }}/media-members

      - name: Generate component-aware manifest
        env:
          RELEASE_ID: ${{ needs.plan-managed.outputs.release_id }}
          PLAN_ROOT: ${{ runner.temp }}/managed-release-plan
          IMAGE_ROOT: ${{ runner.temp }}/managed-images
          BUILD_JOB_RESULT: ${{ needs.build-managed-images.result }}
          BUILD_SET: ${{ needs.plan-managed.outputs.build_set }}
          ENFORCE_ENTRY_OWNERSHIP: ${{ inputs.enforce_entry_ownership }}
        run: |
          set -euo pipefail
          mkdir -p "$IMAGE_ROOT"
          if [[ "$BUILD_JOB_RESULT" == skipped && "$BUILD_SET" != '[]' ]]; then
            echo "skipped managed image build cannot publish a nonempty build set" >&2
            exit 1
          fi
          plan="$PLAN_ROOT/plan.json"
          affected="$(jq -r 'if (.affected_components | length) == 0 then "none" else (.affected_components | join(",")) end' "$plan")"
          output="infrastructure/managed-episode/generated/${RELEASE_ID}.json"
          args=(
            --affected-components "$affected"
            --architectures linux/arm64
            --source-revision "$TARGET_SHA"
            --release-id "$RELEASE_ID"
            --output "$output"
          )
          if [[ -f "$PLAN_ROOT/stable-manifest.json" ]]; then
            args+=(--stable-manifest "$PLAN_ROOT/stable-manifest.json")
          fi
          if jq -e '.affected_components | index("api") != null' "$plan" >/dev/null; then
            args+=(--api-image "$(<"$IMAGE_ROOT/api-image.txt")")
          fi
          if [[ -f "$IMAGE_ROOT/recorder-control-image.txt" ]]; then
            args+=(--recorder-control-image "$(<"$IMAGE_ROOT/recorder-control-image.txt")")
          fi
          if jq -e '.affected_components | index("sync") != null' "$plan" >/dev/null; then
            args+=(--sync-image "$(<"$IMAGE_ROOT/sync-image.txt")")
          fi
          if [[ "${ENFORCE_ENTRY_OWNERSHIP:-false}" == true ]]; then
            args+=(--enforce-entry-ownership)
          fi
          infrastructure/managed-episode/scripts/generate-release-manifest "${args[@]}"

      - name: Bind media members to the backend artifact
        if: needs.plan-managed.outputs.recorder_control == 'true'
        id: media-hash
        env:
          RELEASE_ID: ${{ needs.plan-managed.outputs.release_id }}
        run: |
          destination="infrastructure/managed-episode/generated/$RELEASE_ID.media.json"
          if [[ -f "$RUNNER_TEMP/media-members/media.json" ]]; then
            cp "$RUNNER_TEMP/media-members/media.json" "$destination"
          elif [[ -f "$RUNNER_TEMP/managed-release-plan/stable-media.json" ]]; then
            cp "$RUNNER_TEMP/managed-release-plan/stable-media.json" "$destination"
          fi
          if [[ -f "$destination" ]]; then echo "sha256=$(sha256sum "$destination" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"; fi

      - name: Upload release manifest
        id: manifest-upload
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.plan-managed.outputs.release_id }}
          path: infrastructure/managed-episode/generated/${{ needs.plan-managed.outputs.release_id }}*.json
          retention-days: 90
          if-no-files-found: error

  deploy-managed:
    name: Deploy managed release to ${{ inputs.managed_environment }}
    needs: prepare-release
    if: always() && (!cancelled() || inputs.pages_rollback_id != '') && inputs.deploy_managed && needs.prepare-release.result == 'success'
    outputs:
      release_id: ${{ steps.result.outputs.release_id }}
      restored_source_release_id: ${{ steps.result.outputs.restored_source_release_id }}
    runs-on: ubuntu-24.04
    # Host polling is bounded to 30 minutes; leave time for guarded dispatcher plans.
    timeout-minutes: 60
    environment: ${{ inputs.managed_environment }}
    concurrency:
      group: deploy-managed-${{ inputs.managed_environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: write
      id-token: write
    steps:
      - name: Checkout deployment tooling from workflow revision
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '')
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '')
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - name: Download exact release manifest
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '')
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.prepare-release.outputs.manifest_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare-release.outputs.run_id }}
          path: ${{ runner.temp }}/managed-release

      - name: Verify exact backend and media bytes before credentials
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '')
        env:
          EXPECTED_SHA256: ${{ needs.prepare-release.outputs.manifest_sha256 }}
          EXPECTED_MEDIA_SHA256: ${{ needs.prepare-release.outputs.media_sha256 }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          python -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"managed-release"/(os.environ["RELEASE_ID"]+".json"); assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ["EXPECTED_SHA256"]'
          if [[ -n "$EXPECTED_MEDIA_SHA256" ]]; then
            python -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"managed-release"/(os.environ["RELEASE_ID"]+".media.json"); assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ["EXPECTED_MEDIA_SHA256"]'
          fi

      - name: Retain exact production rollback bytes before host mutation
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '') && inputs.managed_environment == 'production'
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          MANIFEST_SHA256: ${{ needs.prepare-release.outputs.manifest_sha256 }}
          MANIFEST_ARTIFACT_ID: ${{ needs.prepare-release.outputs.manifest_artifact_id }}
        run: python3 scripts/releases/release.py retain_production --directory "${{ runner.temp }}/managed-release"

      - name: Validate managed deployment configuration
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '')
        env:
          CHALK_MANAGED_AWS_REGION: ${{ vars.CHALK_MANAGED_AWS_REGION }}
          CHALK_MANAGED_DEPLOY_ROLE_ARN: ${{ vars.CHALK_MANAGED_DEPLOY_ROLE_ARN }}
          CHALK_MANAGED_INSTANCE_ID: ${{ vars.CHALK_MANAGED_INSTANCE_ID }}
          CHALK_MANAGED_LOG_GROUP_NAME: ${{ vars.CHALK_MANAGED_LOG_GROUP_NAME }}
          CHALK_MANAGED_PARAMETER_PREFIX: ${{ vars.CHALK_MANAGED_PARAMETER_PREFIX }}
          CHALK_MANAGED_SSM_DOCUMENT_NAME: ${{ vars.CHALK_MANAGED_SSM_DOCUMENT_NAME }}
        run: |
          set -euo pipefail
          required_variables=(
            CHALK_MANAGED_AWS_REGION
            CHALK_MANAGED_DEPLOY_ROLE_ARN
            CHALK_MANAGED_INSTANCE_ID
            CHALK_MANAGED_LOG_GROUP_NAME
            CHALK_MANAGED_PARAMETER_PREFIX
            CHALK_MANAGED_SSM_DOCUMENT_NAME
          )
          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "GitHub Environment variable ${variable_name} is required" >&2
              exit 1
            fi
          done

      - name: Configure managed deployment credentials
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CHALK_MANAGED_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CHALK_MANAGED_AWS_REGION }}
          role-duration-seconds: 3600

      - name: Set up OpenTofu for dispatcher binding
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '')
        uses: ./.github/actions/setup-opentofu

      - name: Install doctl for read-only snapshot validation
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '')
        uses: digitalocean/action-doctl@v2
        with:
          no_auth: "true"

      - uses: actions/setup-go@v5
        if: inputs.managed_environment == 'nightly'
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Deploy, health-check, and prove release
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '')
        env:
          GH_TOKEN: ${{ github.token }}
          CHALK_MANAGED_AWS_REGION: ${{ vars.CHALK_MANAGED_AWS_REGION }}
          CHALK_MANAGED_INSTANCE_ID: ${{ vars.CHALK_MANAGED_INSTANCE_ID }}
          CHALK_MANAGED_LOG_GROUP_NAME: ${{ vars.CHALK_MANAGED_LOG_GROUP_NAME }}
          CHALK_MANAGED_PARAMETER_PREFIX: ${{ vars.CHALK_MANAGED_PARAMETER_PREFIX }}
          CHALK_MANAGED_SSM_DOCUMENT_NAME: ${{ vars.CHALK_MANAGED_SSM_DOCUMENT_NAME }}
          CHALK_MANAGED_RECORDER_CONFIG_PARAMETER: ${{ vars.CHALK_MANAGED_RECORDER_CONFIG_PARAMETER || format('/chalk/{0}/release/recorder.json', inputs.managed_environment) }}
          CHALK_MEDIA_ARTIFACT_BUCKET: ${{ vars.CHALK_MEDIA_ARTIFACT_BUCKET }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          MANAGED_ENVIRONMENT: ${{ inputs.managed_environment }}
          MANAGED_SECRET_EXCLUSIONS: ${{ inputs.managed_secret_exclusions || vars.CHALK_MANAGED_SECRET_EXCLUSIONS }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          manifest="${{ runner.temp }}/managed-release/${RELEASE_ID}.json"
          jq -e --arg source "$TARGET_SHA" --arg release "$RELEASE_ID" \
            '.source_revision == $source and .release_id == $release' "$manifest" >/dev/null
          args=(
            --manifest "$manifest"
            --proof-file "${{ runner.temp }}/managed-deployment.json"
            --environment "$MANAGED_ENVIRONMENT"
            --region "$CHALK_MANAGED_AWS_REGION"
            --instance-id "$CHALK_MANAGED_INSTANCE_ID"
            --document-name "$CHALK_MANAGED_SSM_DOCUMENT_NAME"
            --document infrastructure/managed-episode/ssm/chalk-managed-episode-deploy.json
            --parameter-prefix "$CHALK_MANAGED_PARAMETER_PREFIX"
            --request-id "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.${RELEASE_ID}"
            --log-group-name "$CHALK_MANAGED_LOG_GROUP_NAME"
            --timeout-seconds 1800
          )
          args+=(--adopt-existing-release)
          recorder_control="$(jq -r '.images | has("recorder_control")' "$manifest")"
          if [[ "$recorder_control" == true && -n "$CHALK_MANAGED_RECORDER_CONFIG_PARAMETER" ]]; then
            args+=(--dispatcher-config-parameter "$CHALK_MANAGED_RECORDER_CONFIG_PARAMETER")
          fi
          while IFS= read -r secret_id; do
            secret_id="${secret_id#"${secret_id%%[![:space:]]*}"}"
            secret_id="${secret_id%"${secret_id##*[![:space:]]}"}"
            if [[ -n "$secret_id" ]]; then
              args+=(--exclude-secret "$secret_id")
            fi
          done < <(printf '%s\n' "$MANAGED_SECRET_EXCLUSIONS" | tr ',' '\n')

          if [[ "$MANAGED_ENVIRONMENT" == nightly ]]; then
            [[ "$CHALK_MANAGED_PARAMETER_PREFIX" == /chalk/nightly/managed-episode ]] || {
              echo 'nightly requires its own managed parameter prefix' >&2
              exit 1
            }
          fi
          if [[ "$MANAGED_ENVIRONMENT" == nightly && "$recorder_control" == true ]]; then
            [[ "$CHALK_MANAGED_RECORDER_CONFIG_PARAMETER" == /chalk/nightly/* ]] || {
              echo 'nightly requires its own dispatcher configuration and state (PR #268, scheduler_state=DISABLED initially)' >&2
              exit 1
            }
          fi
          node scripts/deploy/deploy-managed-release.mjs "${args[@]}" --dry-run > "$RUNNER_TEMP/managed-preflight.json"
          if [[ "$MANAGED_ENVIRONMENT" == nightly ]]; then
            python3 scripts/releases/release.py invalidate
          fi
          media="${manifest%.json}.media.json"
          if [[ -f "$media" ]]; then
            python3 scripts/releases/media.py pin_archives --manifest "$manifest" --output "$media"
          fi
          node scripts/deploy/deploy-managed-release.mjs "${args[@]}"
          if [[ "$MANAGED_ENVIRONMENT" == nightly && -f "$media" ]]; then
            python3 scripts/releases/media.py qualify --manifest "$manifest" --output "$media" --directory "$RUNNER_TEMP/media-qualification"
            python3 scripts/releases/media.py record_current --manifest "$manifest" --output "$media" --directory "$RUNNER_TEMP/media-qualification"
          fi

      - name: Capture applied identity under the environment lock
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '')
        id: result
        env:
          EXPECTED_RELEASE: ${{ needs.prepare-release.outputs.release_id }}
          SOURCE_RELEASE: ${{ inputs.reuse_release_id }}
          DEPLOYMENT_RESULT: ${{ runner.temp }}/managed-deployment.json
        run: |
          jq -e --arg expected "$EXPECTED_RELEASE" '.release_id == $expected and .status == "deployed" and .health == "passed" and .deployment_phase == "complete" and .rolled_back == false' "$DEPLOYMENT_RESULT"
          echo "release_id=$EXPECTED_RELEASE" >> "$GITHUB_OUTPUT"
          echo "restored_source_release_id=$SOURCE_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Mark the retained production manifest healthy
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '') && inputs.managed_environment == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.retained.outputs.deployment_id }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          DEPLOYMENT_RESULT: ${{ runner.temp }}/managed-deployment.json
        run: python3 scripts/releases/release.py complete_production

      - name: Managed deployment summary
        if: always()
        env:
          DEPLOYMENT_RESULT: ${{ runner.temp }}/managed-deployment.json
          MANAGED_ENVIRONMENT: ${{ inputs.managed_environment }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          SOURCE_RELEASE_ID: ${{ inputs.reuse_release_id || needs.prepare-release.outputs.release_id }}
        run: |
          # shellcheck disable=SC2016
          {
            printf '## Managed release: %s\n\nSource: `%s`\nApplied: `%s`\n\n' "$MANAGED_ENVIRONMENT" "$SOURCE_RELEASE_ID" "$RELEASE_ID"
            if [[ -s "$DEPLOYMENT_RESULT" ]]; then
              printf '```json\n'
              jq '{deployment_phase, status, health, release_id, request_id, rolled_back, ssm_command_id, document_version, dispatcher_binding}' "$DEPLOYMENT_RESULT"
              printf '```\n'
            else
              printf 'Deployment did not complete. Inspect the failed step and its SSM command ID; do not bypass CI.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain managed deployment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-deployment-${{ needs.prepare-release.outputs.release_id }}
          path: ${{ runner.temp }}/managed-deployment.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Retain signed media boot receipts
        if: always() && inputs.managed_environment == 'nightly'
        uses: actions/upload-artifact@v4
        with:
          name: media-qualification-${{ needs.prepare-release.outputs.release_id }}
          path: ${{ runner.temp }}/media-qualification/*-receipt.json
          retention-days: 90
          if-no-files-found: ignore

  build-web:
    name: Build web-${{ matrix.target }} once
    needs: require-gate
    if: >-
      !cancelled() && needs.require-gate.result == 'success' && inputs.deploy_web && inputs.manifest_run_id == ''
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: ${{ fromJSON(inputs.managed_environment == 'nightly' && '["nightly","production"]' || '["production"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout requested web source independently of release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          path: build-source
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: build-source
      - name: Build selected public endpoints
        env:
          WEB_TARGET: ${{ matrix.target }}
        run: python3 scripts/releases/web.py build --target "$WEB_TARGET" --sha "$TARGET_SHA" --source-root "$GITHUB_WORKSPACE/build-source"
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.target }}-${{ github.run_attempt }}
          path: web-output/web-${{ matrix.target }}.tar.gz
          retention-days: 90
          if-no-files-found: error

  prepare-web:
    needs: build-web
    if: always() && !cancelled() && needs.build-web.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.refs.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/releases/release.py webrefs

  prepare-release:
    name: Verify source and prepare deployment envelope
    needs: [plan-managed, publish-managed-manifest]
    if: >-
      always() && (!cancelled() || inputs.pages_rollback_id != '') &&
      (inputs.manifest_run_id != '' || needs.publish-managed-manifest.result == 'success')
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
      manifest_artifact_id: ${{ steps.upload.outputs.artifact-id || needs.publish-managed-manifest.outputs.artifact_id }}
      manifest_sha256: ${{ steps.prepare.outputs.manifest_sha256 }}
      media_sha256: ${{ steps.prepare.outputs.media_sha256 }}
      run_id: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '')
        with:
          fetch-depth: 0
      - name: Verify source hash before preparing fresh reuse envelope
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '')
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.manifest_run_id || github.run_id }}
          SOURCE_RELEASE_ID: ${{ inputs.reuse_release_id || needs.plan-managed.outputs.release_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.manifest_artifact_id || needs.publish-managed-manifest.outputs.artifact_id }}
          SOURCE_SHA256: ${{ inputs.manifest_sha256 }}
          SOURCE_MEDIA_SHA256: ${{ inputs.media_sha256 || needs.publish-managed-manifest.outputs.media_sha256 }}
          MANAGED_ENVIRONMENT: ${{ inputs.managed_environment }}
          ROLLBACK_MEDIA: ${{ inputs.rollback_media }}
          REUSE: ${{ inputs.manifest_run_id != '' }}
        run: |
          args=()
          if [[ "$REUSE" == true ]]; then args+=(--reuse); fi
          python3 scripts/releases/release.py prepare "${args[@]}"
      - uses: actions/upload-artifact@v4
        id: upload
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '') && (inputs.manifest_run_id != '')
        with:
          name: release-manifest-${{ steps.prepare.outputs.release_id }}
          path: release-input/${{ steps.prepare.outputs.release_id }}*.json
          retention-days: 90
          if-no-files-found: error

  deploy-web:
    name: Deploy selected web or restore Pages
    outputs:
      pages_deployment_id: ${{ steps.restore.outputs.pages_deployment_id }}
    needs: [prepare-web, deploy-managed]
    if: >-
      always() && (!cancelled() || inputs.pages_rollback_id != '') && inputs.deploy_web &&
      (inputs.pages_rollback_id != '' || needs.deploy-managed.result == 'success' || (!inputs.deploy_managed && needs.deploy-managed.result == 'skipped')) &&
      (inputs.manifest_run_id != '' || needs.prepare-web.result == 'success')
    runs-on: ubuntu-24.04
    environment: ${{ inputs.managed_environment }}
    env:
      # Preserve today's production destination; new configuration is nightly-only.
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.managed_environment == 'production' && '5281943bd26d5bdcf4c3915606cd6bfb' || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAGES_PROJECT: ${{ vars.CHALK_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '')
      - name: Select the explicit production Pages destination
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '') && (inputs.managed_environment == 'production')
        run: |
          node --input-type=module -e 'import { PRODUCTION_PROJECT } from "./scripts/deploy/deploy-web-release.mjs"; console.log("PAGES_PROJECT=" + PRODUCTION_PROJECT)' >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '') && (inputs.pages_rollback_id == '')
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '') && (inputs.pages_rollback_id == '')
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '') && (inputs.pages_rollback_id == '')
      - name: Record the current nightly write before any web mutation
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '') && inputs.managed_environment == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BACKEND_RELEASE_ID: ${{ needs.deploy-managed.outputs.release_id }}
        run: python3 scripts/releases/release.py invalidate
      - name: Upload verified prebuilt archive without rebuilding
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '') && (inputs.pages_rollback_id == '')
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_TARGET: ${{ inputs.managed_environment }}
          ARTIFACT_RUN_ID: ${{ inputs.manifest_run_id || github.run_id }}
          WEB_ARTIFACT: ${{ inputs.web_artifact || toJSON(fromJSON(needs.prepare-web.outputs.web || '{}')[inputs.managed_environment]) }}
        run: python3 scripts/releases/web.py deploy --target "$WEB_TARGET" --sha "$TARGET_SHA"
      - name: Restore the saved Pages production deployment
        id: restore
        if: always() && !failure() && (!cancelled() || inputs.pages_rollback_id != '') && (inputs.pages_rollback_id != '')
        env:
          PAGES_ROLLBACK_ID: ${{ inputs.pages_rollback_id }}
        run: python3 scripts/releases/web.py rollback
