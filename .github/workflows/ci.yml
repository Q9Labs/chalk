name: Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character commit SHA whose pull request passed the Gate workflow
        required: true
        type: string
      release_managed:
        description: Build the changed API or Sync image and emit a managed release manifest
        required: true
        default: true
        type: boolean
      deploy_managed:
        description: Deploy the managed release through the pinned SSM controller
        required: true
        default: false
        type: boolean
      enable_recorder_control:
        description: First enablement of colocated recording controls (requires approved secrets and direct TLS ingress)
        required: true
        default: false
        type: boolean
      managed_environment:
        description: Configured GitHub environment and managed host target
        required: true
        default: nightly
        type: string
      managed_secret_exclusions:
        description: Comma-separated canonical runtime input IDs allowed to be missing
        required: false
        type: string
      stable_manifest_run_id:
        description: Run ID whose release manifest is the current stable baseline; omit only for the first release
        required: false
        type: string
      stable_manifest_artifact_id:
        description: Exact build baseline artifact within the baseline run (recommended after reruns)
        required: false
        type: string
      deploy_web:
        description: Run the CI web deployment fallback
        required: true
        default: false
        type: boolean
      build_release_set:
        description: Build both web targets and freeze the qualified runtime members
        type: boolean
        default: false
      manifest_run_id:
        description: Exact artifact-producing run to reuse; skips planning and all builds
        type: string
      manifest_artifact_id:
        description: Exact immutable backend artifact ID (reuse mode)
        type: string
      manifest_sha256:
        description: SHA256 of backend manifest bytes (reuse mode)
        type: string
      reuse_release_id:
        description: Frozen release ID (reuse mode)
        type: string
      release_set_artifact_id:
        description: Exact immutable release-set artifact ID (reuse mode)
        type: string
      release_set_sha256:
        description: SHA256 of release-set.json bytes (reuse mode)
        type: string
      dry_run:
        description: Validate inputs and print commands without building or deploying
        type: boolean
        default: false
      adopt_existing_release:
        description: Explicit one-time adoption of a legacy host; never needed for a fresh host
        type: boolean
        default: false

  workflow_call:
    inputs:
      target_sha:
        description: Full 40-character commit SHA whose pull request passed the Gate workflow
        required: false
        type: string
      release_managed:
        description: Build the changed API or Sync image and emit a managed release manifest
        required: false
        default: true
        type: boolean
      deploy_managed:
        description: Deploy the managed release through the pinned SSM controller
        required: false
        default: false
        type: boolean
      enable_recorder_control:
        description: First enablement of colocated recording controls (requires approved secrets and direct TLS ingress)
        required: false
        default: false
        type: boolean
      managed_environment:
        description: Configured GitHub environment and managed host target
        required: false
        default: nightly
        type: string
      managed_secret_exclusions:
        description: Comma-separated canonical runtime input IDs allowed to be missing
        required: false
        type: string
      stable_manifest_run_id:
        description: Run ID whose release manifest is the current stable baseline; omit only for the first release
        required: false
        type: string
      stable_manifest_artifact_id:
        description: Exact build baseline artifact within the baseline run (recommended after reruns)
        required: false
        type: string
      deploy_web:
        description: Run the CI web deployment fallback
        required: false
        default: false
        type: boolean
      build_release_set:
        description: Build both web targets and freeze the qualified runtime members
        type: boolean
        default: false
      manifest_run_id:
        description: Exact artifact-producing run to reuse; skips planning and all builds
        type: string
      manifest_artifact_id:
        description: Exact immutable backend artifact ID (reuse mode)
        type: string
      manifest_sha256:
        description: SHA256 of backend manifest bytes (reuse mode)
        type: string
      reuse_release_id:
        description: Frozen release ID (reuse mode)
        type: string
      release_set_artifact_id:
        description: Exact immutable release-set artifact ID (reuse mode)
        type: string
      release_set_sha256:
        description: SHA256 of release-set.json bytes (reuse mode)
        type: string
      orchestrated:
        description: Internal caller owns the environment lock through proof and rollback
        type: boolean
        default: false
      dry_run:
        description: Validate inputs and print commands without building or deploying
        type: boolean
        default: false
      adopt_existing_release:
        description: Explicit one-time adoption of a legacy host; never needed for a fresh host
        type: boolean
        default: false
    outputs:
      release_id:
        value: ${{ jobs.prepare-release.outputs.release_id }}
      run_id:
        value: ${{ jobs.prepare-release.outputs.run_id }}
      manifest_artifact_id:
        value: ${{ jobs.prepare-release.outputs.manifest_artifact_id }}
      manifest_sha256:
        value: ${{ jobs.prepare-release.outputs.manifest_sha256 }}
      set_artifact_id:
        value: ${{ jobs.prepare-release.outputs.set_artifact_id }}
      set_sha256:
        value: ${{ jobs.prepare-release.outputs.set_sha256 }}
      activated_at:
        value: ${{ jobs.activation.outputs.activated_at }}

run-name: Release ${{ inputs.target_sha }}

permissions:
  contents: read
  actions: read
  deployments: write
  id-token: write

env:
  TARGET_SHA: ${{ inputs.target_sha }}

concurrency:
  group: ${{ inputs.orchestrated && format('chalk-release-child-{0}', github.run_id) || format('chalk-environment-{0}', inputs.managed_environment) }}
  cancel-in-progress: false

jobs:
  plan-managed:
    name: Plan managed components
    if: (inputs.release_managed || inputs.deploy_managed) && inputs.manifest_run_id == '' && !inputs.dry_run
    runs-on: ubuntu-24.04
    outputs:
      build_set: ${{ steps.plan.outputs.build_set }}
      release_id: ${{ steps.plan.outputs.release_id }}
      should_publish: ${{ steps.plan.outputs.should_publish }}
      recorder_control: ${{ steps.plan.outputs.recorder_control }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Set up Go for recorder dependency planning
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Verify exact release SHA
        env:
          DEPLOY_MANAGED: ${{ inputs.deploy_managed }}
          RELEASE_MANAGED: ${{ inputs.release_managed }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]]; then
            echo "checkout does not match target_sha" >&2
            exit 1
          fi
          if [[ "$DEPLOY_MANAGED" == "true" && "$RELEASE_MANAGED" != "true" ]]; then
            echo "deploy_managed requires release_managed" >&2
            exit 1
          fi

      - name: Validate managed runtime contracts
        run: |
          infrastructure/managed-episode/scripts/test-deployment-controller
          node --test scripts/deploy/deploy-managed-release.test.mjs

      - name: Download stable release manifest
        if: inputs.stable_manifest_run_id != '' && inputs.stable_manifest_artifact_id == ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.stable_manifest_run_id }}
          pattern: release-manifest-*
          path: ${{ runner.temp }}/stable-download
          merge-multiple: true

      - name: Download exact build baseline artifact
        if: inputs.stable_manifest_run_id != '' && inputs.stable_manifest_artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.stable_manifest_run_id }}
          artifact-ids: ${{ inputs.stable_manifest_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/stable-download

      - name: Plan changed components
        id: plan
        env:
          DEPLOY_MANAGED: ${{ inputs.deploy_managed }}
          PLAN_ROOT: ${{ runner.temp }}/managed-release-plan
          ENABLE_RECORDER_CONTROL: ${{ inputs.enable_recorder_control }}
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_ROOT"

          stable_manifest=""
          if [[ -n "${{ inputs.stable_manifest_run_id }}" ]]; then
            mapfile -t manifests < <(find "${{ runner.temp }}/stable-download" -type f -name '*.json' | sort)
            if [[ "${#manifests[@]}" != 1 ]]; then
              echo "expected exactly one stable release manifest, found ${#manifests[@]}" >&2
              exit 1
            fi
            stable_manifest="$PLAN_ROOT/stable-manifest.json"
            cp "${manifests[0]}" "$stable_manifest"
            base_sha="$(jq -er '.source_revision' "$stable_manifest")"
            git cat-file -e "${base_sha}^{commit}"
            git merge-base --is-ancestor "$base_sha" "$TARGET_SHA" || {
              echo "stable manifest source is not an ancestor of target_sha" >&2
              exit 1
            }
            mapfile -d '' changed_paths < <(git diff --name-only -z "$base_sha...$TARGET_SHA")
            if [[ "${#changed_paths[@]}" == 0 ]]; then
              infrastructure/managed-episode/scripts/plan-release-components --component none > "$PLAN_ROOT/plan.json"
            else
              infrastructure/managed-episode/scripts/plan-release-components -- "${changed_paths[@]}" > "$PLAN_ROOT/plan.json"
            fi
          else
            infrastructure/managed-episode/scripts/plan-release-components --component both > "$PLAN_ROOT/plan.json"
          fi

          recorder_control="$ENABLE_RECORDER_CONTROL"
          if [[ -n "$stable_manifest" ]] && jq -e '.images | has("recorder_control")' "$stable_manifest" >/dev/null; then
            recorder_control=true
          elif [[ "$ENABLE_RECORDER_CONTROL" == true ]]; then
            infrastructure/managed-episode/scripts/plan-release-components --component both > "$PLAN_ROOT/plan.json"
          fi
          jq -e '.build_set == [] or .build_set == ["api"] or .build_set == ["sync"] or .build_set == ["api", "sync"]' "$PLAN_ROOT/plan.json" >/dev/null
          classification="$(jq -r '.classification' "$PLAN_ROOT/plan.json")"
          build_set="$(jq -c '.build_set' "$PLAN_ROOT/plan.json")"
          if [[ "$classification" == none && "$build_set" != '[]' ]]; then
            echo "runtime-only classification must not request application images" >&2
            exit 1
          fi
          if [[ "$DEPLOY_MANAGED" == "true" && "$classification" == none ]]; then
            should_publish=true
          else
            should_publish="$(jq -r 'if (.build_set | length) > 0 then "true" else "false" end' "$PLAN_ROOT/plan.json")"
          fi
          if [[ "$DEPLOY_MANAGED" == "true" && "$should_publish" != "true" ]]; then
            echo "deploy_managed requires an application component or runtime-only change" >&2
            exit 1
          fi
          release_id="managed-episode-$(date -u +%Y%m%dT%H%M%SZ)-${TARGET_SHA:0:8}-$(openssl rand -hex 4)"
          {
            printf 'build_set=%s\n' "$build_set"
            printf 'should_publish=%s\n' "$should_publish"
            printf 'release_id=%s\n' "$release_id"
            printf 'recorder_control=%s\n' "$recorder_control"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release plan
        uses: actions/upload-artifact@v4
        with:
          name: managed-release-plan-${{ steps.plan.outputs.release_id }}
          path: ${{ runner.temp }}/managed-release-plan
          retention-days: 7
          if-no-files-found: error

      - name: Plan summary
        env:
          PLAN_FILE: ${{ runner.temp }}/managed-release-plan/plan.json
        run: |
          {
            echo "## Managed release plan"
            echo "- source: \`$TARGET_SHA\`"
            echo "- classification: \`$(jq -r '.classification' "$PLAN_FILE")\`"
            echo "- build: \`$(jq -c '.build_set' "$PLAN_FILE")\`"
            echo "- recorder CPU image affected: \`$(jq -r '.recorder_image_affected' "$PLAN_FILE")\`"
            echo "- restart closure: \`$(jq -c '.restart_closure' "$PLAN_FILE")\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-managed-images:
    name: Build ${{ matrix.component }} image
    needs: plan-managed
    if: needs.plan-managed.outputs.should_publish == 'true' && needs.plan-managed.outputs.build_set != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan-managed.outputs.build_set) }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      ECR_REGISTRY: 688819141892.dkr.ecr.ap-southeast-1.amazonaws.com
      COMPONENT: ${{ matrix.component }}
      RELEASE_ID: ${{ needs.plan-managed.outputs.release_id }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::688819141892:role/chalk-ci-image-publish
          aws-region: ap-southeast-1

      - name: Verify signing profile is active
        run: |
          status="$(aws signer get-signing-profile --profile-name chalk_production_ecr --query status --output text)"
          if [[ "$status" != "Active" ]]; then
            echo "managed signing profile is not active (status: $status)" >&2
            exit 1
          fi

      - name: Login to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: build
        run: |
          case "$COMPONENT" in
            api)
              source_context="api_source=apps/api"
              dockerfile="infrastructure/managed-episode/images/api.Dockerfile"
              repository="chalk-api"
              ;;
            sync)
              source_context="sync_source=apps/sync"
              dockerfile="infrastructure/managed-episode/images/sync.Dockerfile"
              repository="chalk-sync"
              ;;
            *)
              echo "unsupported component: $COMPONENT" >&2
              exit 1
              ;;
          esac

          metadata_file="${RUNNER_TEMP}/${COMPONENT}-metadata.json"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=mode=max \
            --build-context "$source_context" \
            --cache-from "type=gha,scope=chalk-${COMPONENT}" \
            --cache-to "type=gha,scope=chalk-${COMPONENT},mode=max" \
            --file "$dockerfile" \
            --build-arg RELEASE_ID="$RELEASE_ID" \
            --build-arg SOURCE_REVISION="$TARGET_SHA" \
            --tag "$ECR_REGISTRY/${repository}:$RELEASE_ID" \
            --metadata-file "$metadata_file" \
            --push \
            infrastructure/managed-episode
          digest="$(jq -er '."containerimage.digest"' "$metadata_file")"
          printf '%s\n' "$ECR_REGISTRY/${repository}@$digest" > "${RUNNER_TEMP}/${COMPONENT}-image.txt"
          printf 'repository=%s\n' "$repository" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

          if [[ "$COMPONENT" == api && "${{ needs.plan-managed.outputs.recorder_control }}" == true ]]; then
            control_metadata="${RUNNER_TEMP}/recorder-control-metadata.json"
            docker buildx build \
              --platform linux/arm64 --provenance=mode=max \
              --build-context api_source=apps/api \
              --cache-from type=gha,scope=chalk-recorder-control \
              --cache-to type=gha,scope=chalk-recorder-control,mode=max \
              --file infrastructure/managed-episode/images/recorder-control.Dockerfile \
              --build-arg RELEASE_ID="$RELEASE_ID" --build-arg SOURCE_REVISION="$TARGET_SHA" \
              --tag "$ECR_REGISTRY/chalk-api:recorder-$RELEASE_ID" \
              --metadata-file "$control_metadata" --push infrastructure/managed-episode
            control_digest="$(jq -er '."containerimage.digest"' "$control_metadata")"
            printf '%s\n' "$ECR_REGISTRY/chalk-api@$control_digest" > "${RUNNER_TEMP}/recorder-control-image.txt"
            printf 'control_digest=%s\n' "$control_digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for managed signing
        run: |
          digests=("${{ steps.build.outputs.digest }}")
          if [[ -n "${{ steps.build.outputs.control_digest }}" ]]; then
            digests+=("${{ steps.build.outputs.control_digest }}")
          fi
          for digest in "${digests[@]}"; do
          for attempt in $(seq 1 60); do
            status="$(aws ecr describe-image-signing-status --repository-name "${{ steps.build.outputs.repository }}" --image-id imageDigest="$digest" --query 'signingStatuses[0].status' --output text 2>/dev/null || echo PENDING)"
            if [[ "$status" == "COMPLETE" ]]; then
              break
            fi
            if [[ "$status" == "FAILED" ]]; then
              echo "managed signing failed for $COMPONENT" >&2
              exit 1
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "managed signing did not complete for $COMPONENT (last status: $status)" >&2
              exit 1
            fi
            sleep 10
          done
          done

      - name: Upload immutable image reference
        uses: actions/upload-artifact@v4
        with:
          name: managed-image-${{ matrix.component }}-${{ env.RELEASE_ID }}
          path: |
            ${{ runner.temp }}/${{ matrix.component }}-image.txt
            ${{ runner.temp }}/recorder-control-image.txt
          retention-days: 7
          if-no-files-found: error

  publish-managed-manifest:
    name: Publish managed release manifest
    outputs:
      artifact_id: ${{ steps.manifest-upload.outputs.artifact-id }}
    needs: [plan-managed, build-managed-images]
    if: >-
      always() &&
      needs.plan-managed.outputs.should_publish == 'true' &&
      (needs.build-managed-images.result == 'success' || (needs.build-managed-images.result == 'skipped' && needs.plan-managed.outputs.build_set == '[]'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}

      - name: Download release plan
        uses: actions/download-artifact@v4
        with:
          pattern: managed-release-plan-${{ needs.plan-managed.outputs.release_id }}
          path: ${{ runner.temp }}/managed-release-plan
          merge-multiple: true

      - name: Download built image references
        if: needs.plan-managed.outputs.build_set != '[]'
        uses: actions/download-artifact@v4
        with:
          pattern: managed-image-*-${{ needs.plan-managed.outputs.release_id }}
          path: ${{ runner.temp }}/managed-images
          merge-multiple: true

      - name: Generate component-aware manifest
        env:
          RELEASE_ID: ${{ needs.plan-managed.outputs.release_id }}
          PLAN_ROOT: ${{ runner.temp }}/managed-release-plan
          IMAGE_ROOT: ${{ runner.temp }}/managed-images
          BUILD_JOB_RESULT: ${{ needs.build-managed-images.result }}
          BUILD_SET: ${{ needs.plan-managed.outputs.build_set }}
        run: |
          set -euo pipefail
          mkdir -p "$IMAGE_ROOT"
          if [[ "$BUILD_JOB_RESULT" == skipped && "$BUILD_SET" != '[]' ]]; then
            echo "skipped managed image build cannot publish a nonempty build set" >&2
            exit 1
          fi
          plan="$PLAN_ROOT/plan.json"
          affected="$(jq -r 'if (.affected_components | length) == 0 then "none" else (.affected_components | join(",")) end' "$plan")"
          output="infrastructure/managed-episode/generated/${RELEASE_ID}.json"
          args=(
            --affected-components "$affected"
            --architectures linux/arm64
            --source-revision "$TARGET_SHA"
            --release-id "$RELEASE_ID"
            --output "$output"
          )
          if [[ -f "$PLAN_ROOT/stable-manifest.json" ]]; then
            args+=(--stable-manifest "$PLAN_ROOT/stable-manifest.json")
          fi
          if jq -e '.affected_components | index("api") != null' "$plan" >/dev/null; then
            args+=(--api-image "$(<"$IMAGE_ROOT/api-image.txt")")
          fi
          if [[ -f "$IMAGE_ROOT/recorder-control-image.txt" ]]; then
            args+=(--recorder-control-image "$(<"$IMAGE_ROOT/recorder-control-image.txt")")
          fi
          if jq -e '.affected_components | index("sync") != null' "$plan" >/dev/null; then
            args+=(--sync-image "$(<"$IMAGE_ROOT/sync-image.txt")")
          fi
          infrastructure/managed-episode/scripts/generate-release-manifest "${args[@]}"

      - name: Upload release manifest
        id: manifest-upload
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.plan-managed.outputs.release_id }}
          path: infrastructure/managed-episode/generated/${{ needs.plan-managed.outputs.release_id }}.json
          retention-days: 365
          if-no-files-found: error

  deploy-managed:
    name: Deploy managed release to ${{ inputs.managed_environment }}
    needs: [prepare-release, runtime-preflight]
    if: >-
      always() && !cancelled() && inputs.deploy_managed &&
      needs.prepare-release.result == 'success' && !inputs.dry_run &&
      (needs.runtime-preflight.result == 'success' || needs.prepare-release.outputs.set_artifact_id == '')
    runs-on: ubuntu-24.04
    # Host polling is bounded to 30 minutes; leave time for guarded dispatcher plans.
    timeout-minutes: 60
    environment: ${{ inputs.managed_environment }}
    concurrency:
      group: deploy-managed-${{ inputs.managed_environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout deployment tooling from workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - name: Download exact release manifest
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.prepare-release.outputs.manifest_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare-release.outputs.run_id }}
          path: ${{ runner.temp }}/managed-release

      - uses: ./.github/actions/release-tools

      - name: Verify exact backend bytes before credentials
        env:
          EXPECTED_SHA256: ${{ needs.prepare-release.outputs.manifest_sha256 }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          python -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"managed-release"/(os.environ["RELEASE_ID"]+".json"); assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ["EXPECTED_SHA256"]'

      - name: Validate managed deployment configuration
        env:
          CHALK_MANAGED_AWS_REGION: ${{ vars.CHALK_MANAGED_AWS_REGION }}
          CHALK_MANAGED_DEPLOY_ROLE_ARN: ${{ vars.CHALK_MANAGED_DEPLOY_ROLE_ARN }}
          CHALK_MANAGED_INSTANCE_ID: ${{ vars.CHALK_MANAGED_INSTANCE_ID }}
          CHALK_MANAGED_LOG_GROUP_NAME: ${{ vars.CHALK_MANAGED_LOG_GROUP_NAME }}
          CHALK_MANAGED_PARAMETER_PREFIX: ${{ vars.CHALK_MANAGED_PARAMETER_PREFIX }}
          CHALK_MANAGED_SSM_DOCUMENT_NAME: ${{ vars.CHALK_MANAGED_SSM_DOCUMENT_NAME }}
        run: |
          set -euo pipefail
          required_variables=(
            CHALK_MANAGED_AWS_REGION
            CHALK_MANAGED_DEPLOY_ROLE_ARN
            CHALK_MANAGED_INSTANCE_ID
            CHALK_MANAGED_LOG_GROUP_NAME
            CHALK_MANAGED_PARAMETER_PREFIX
            CHALK_MANAGED_SSM_DOCUMENT_NAME
          )
          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "GitHub Environment variable ${variable_name} is required" >&2
              exit 1
            fi
          done

      - name: Configure managed deployment credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CHALK_MANAGED_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CHALK_MANAGED_AWS_REGION }}
          role-duration-seconds: 3600

      - name: Set up OpenTofu for dispatcher binding
        uses: ./.github/actions/setup-opentofu

      - name: Deploy, health-check, and prove release
        env:
          CHALK_MANAGED_AWS_REGION: ${{ vars.CHALK_MANAGED_AWS_REGION }}
          CHALK_MANAGED_INSTANCE_ID: ${{ vars.CHALK_MANAGED_INSTANCE_ID }}
          CHALK_MANAGED_LOG_GROUP_NAME: ${{ vars.CHALK_MANAGED_LOG_GROUP_NAME }}
          CHALK_MANAGED_PARAMETER_PREFIX: ${{ vars.CHALK_MANAGED_PARAMETER_PREFIX }}
          CHALK_MANAGED_SSM_DOCUMENT_NAME: ${{ vars.CHALK_MANAGED_SSM_DOCUMENT_NAME }}
          CHALK_MANAGED_RECORDER_CONFIG_PARAMETER: ${{ vars.CHALK_MANAGED_RECORDER_CONFIG_PARAMETER }}
          MANAGED_ENVIRONMENT: ${{ inputs.managed_environment }}
          MANAGED_SECRET_EXCLUSIONS: ${{ inputs.managed_secret_exclusions || vars.CHALK_MANAGED_SECRET_EXCLUSIONS }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          manifest="${{ runner.temp }}/managed-release/${RELEASE_ID}.json"
          jq -e --arg source "$TARGET_SHA" --arg release "$RELEASE_ID" \
            '.source_revision == $source and .release_id == $release' "$manifest" >/dev/null
          args=(
            --manifest "$manifest"
            --proof-file "${{ runner.temp }}/managed-deployment.json"
            --environment "$MANAGED_ENVIRONMENT"
            --region "$CHALK_MANAGED_AWS_REGION"
            --instance-id "$CHALK_MANAGED_INSTANCE_ID"
            --document-name "$CHALK_MANAGED_SSM_DOCUMENT_NAME"
            --document infrastructure/managed-episode/ssm/chalk-managed-episode-deploy.json
            --parameter-prefix "$CHALK_MANAGED_PARAMETER_PREFIX"
            --request-id "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            --log-group-name "$CHALK_MANAGED_LOG_GROUP_NAME"
            --timeout-seconds 1800
          )
          if [[ "${{ inputs.adopt_existing_release }}" == true ]]; then
            args+=(--adopt-existing-release)
          fi
          if [[ -n "$CHALK_MANAGED_RECORDER_CONFIG_PARAMETER" ]]; then
            args+=(--dispatcher-config-parameter "$CHALK_MANAGED_RECORDER_CONFIG_PARAMETER")
          fi
          while IFS= read -r secret_id; do
            secret_id="${secret_id#"${secret_id%%[![:space:]]*}"}"
            secret_id="${secret_id%"${secret_id##*[![:space:]]}"}"
            if [[ -n "$secret_id" ]]; then
              args+=(--exclude-secret "$secret_id")
            fi
          done < <(printf '%s\n' "$MANAGED_SECRET_EXCLUSIONS" | tr ',' '\n')

          node scripts/deploy/deploy-managed-release.mjs "${args[@]}"

      - name: Managed deployment summary
        if: always()
        env:
          DEPLOYMENT_RESULT: ${{ runner.temp }}/managed-deployment.json
          MANAGED_ENVIRONMENT: ${{ inputs.managed_environment }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          # shellcheck disable=SC2016
          {
            printf '## Managed release: %s\n\nRelease: `%s`\n\n' "$MANAGED_ENVIRONMENT" "$RELEASE_ID"
            if [[ -s "$DEPLOYMENT_RESULT" ]]; then
              printf '```json\n'
              jq '{deployment_phase, status, health, release_id, request_id, rolled_back, ssm_command_id, document_version, dispatcher_binding}' "$DEPLOYMENT_RESULT"
              printf '```\n'
            else
              printf 'Deployment did not complete. Inspect the failed step and its SSM command ID; do not bypass CI.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain managed deployment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-deployment-${{ needs.prepare-release.outputs.release_id }}
          path: ${{ runner.temp }}/managed-deployment.json
          if-no-files-found: ignore
          retention-days: 90

  build-web:
    name: Build web-${{ matrix.target }} once
    if: inputs.build_release_set && inputs.manifest_run_id == '' && !inputs.dry_run
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [nightly, production]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
      - uses: ./.github/actions/release-tools
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build target-specific public configuration
        env:
          WEB_TARGET: ${{ matrix.target }}
        run: python scripts/releases/web.py build --target "$WEB_TARGET" --sha "$TARGET_SHA" --output web-output
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.target }}-${{ github.run_attempt }}
          path: web-output/web-${{ matrix.target }}.tar.gz
          retention-days: 365
          if-no-files-found: error

  publish-release-set:
    needs: [plan-managed, publish-managed-manifest, build-web]
    if: >-
      always() && !cancelled() && inputs.build_release_set && inputs.manifest_run_id == '' && !inputs.dry_run &&
      needs.publish-managed-manifest.result == 'success' && needs.build-web.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.assemble.outputs.sha256 }}
      manifest_sha256: ${{ steps.assemble.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-tools
      - name: Locate both immutable web artifacts
        id: web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts/releases')
          from github_release import GitHub, outputs
          api = GitHub()
          artifacts = list(api.pages(f"actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts", 'artifacts'))
          values = {}
          for target in ('nightly', 'production'):
              matches = [a for a in artifacts if a['name'] == f"web-{target}-{os.environ['GITHUB_RUN_ATTEMPT']}" and not a['expired']]
              assert len(matches) == 1, f'expected one {target} artifact'
              values[target] = matches[0]['id']
          outputs(values)
          PY
      - name: Freeze and validate the complete set
        id: assemble
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.plan-managed.outputs.release_id }}
          MANIFEST_ARTIFACT_ID: ${{ needs.publish-managed-manifest.outputs.artifact_id }}
          WEB_NIGHTLY_ARTIFACT_ID: ${{ steps.web.outputs.nightly }}
          WEB_PRODUCTION_ARTIFACT_ID: ${{ steps.web.outputs.production }}
          RUNTIME_RUN_ID: ${{ vars.CHALK_QUALIFIED_RUNTIME_RUN_ID }}
          RUNTIME_ARTIFACT_ID: ${{ vars.CHALK_QUALIFIED_RUNTIME_ARTIFACT_ID }}
          RUNTIME_SHA256: ${{ vars.CHALK_QUALIFIED_RUNTIME_SHA256 }}
        run: python scripts/releases/release.py assemble --directory release-output
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: release-set-${{ github.run_attempt }}
          path: release-output/release-set.json
          retention-days: 365
          if-no-files-found: error

  prepare-release:
    name: Resolve immutable deployment inputs
    needs: [plan-managed, publish-managed-manifest, publish-release-set]
    if: >-
      always() && !cancelled() && !inputs.dry_run &&
      (inputs.manifest_run_id != '' ||
       (needs.publish-managed-manifest.result == 'success' &&
        (!inputs.build_release_set || needs.publish-release-set.result == 'success')))
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.resolve.outputs.release_id }}
      run_id: ${{ inputs.manifest_run_id || github.run_id }}
      manifest_artifact_id: ${{ steps.resolve.outputs.manifest_artifact_id }}
      manifest_sha256: ${{ steps.resolve.outputs.manifest_sha256 }}
      set_artifact_id: ${{ inputs.release_set_artifact_id || needs.publish-release-set.outputs.artifact_id }}
      set_sha256: ${{ inputs.release_set_sha256 || needs.publish-release-set.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-tools
      - name: Reject incomplete reuse or mixed build/reuse mode
        env:
          REUSE: ${{ inputs.manifest_run_id }}
          REUSE_ID: ${{ inputs.reuse_release_id }}
          MANIFEST_ID: ${{ inputs.manifest_artifact_id }}
          MANIFEST_HASH: ${{ inputs.manifest_sha256 }}
          SET_ID: ${{ inputs.release_set_artifact_id }}
          SET_HASH: ${{ inputs.release_set_sha256 }}
          BUILD: ${{ inputs.release_managed || inputs.build_release_set }}
        run: |
          if [[ -n "$REUSE" ]]; then
            test "$BUILD" = false
            test -n "$REUSE_ID" && test -n "$MANIFEST_ID" && test -n "$MANIFEST_HASH" && test -n "$SET_ID" && test -n "$SET_HASH"
          fi
      - name: Resolve exact bytes, never use the baseline as a reuse selector
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.manifest_run_id || github.run_id }}
          RELEASE_ID: ${{ inputs.reuse_release_id || needs.plan-managed.outputs.release_id }}
          MANIFEST_ARTIFACT_ID: ${{ inputs.manifest_artifact_id || needs.publish-managed-manifest.outputs.artifact_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 || needs.publish-release-set.outputs.manifest_sha256 }}
          SET_ARTIFACT_ID: ${{ inputs.release_set_artifact_id || needs.publish-release-set.outputs.artifact_id }}
          SET_SHA256: ${{ inputs.release_set_sha256 || needs.publish-release-set.outputs.sha256 }}
        run: |
          if [[ -n "$SET_ARTIFACT_ID" ]]; then
            python scripts/releases/release.py resolve
          else
            python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts/releases')
          from github_release import GitHub, outputs
          from release_set import digest, require
          api = GitHub()
          data = api.artifact(os.environ['RUN_ID'], os.environ['MANIFEST_ARTIFACT_ID'], os.environ['RELEASE_ID'] + '.json')
          require(not os.environ.get('MANIFEST_SHA256') or digest(data) == os.environ['MANIFEST_SHA256'], 'manifest checksum mismatch')
          outputs({'release_id': os.environ['RELEASE_ID'], 'manifest_artifact_id': os.environ['MANIFEST_ARTIFACT_ID'], 'manifest_sha256': digest(data)})
          PY
          fi

  runtime-preflight:
    needs: prepare-release
    if: inputs.deploy_managed && needs.prepare-release.outputs.set_artifact_id != ''
    runs-on: ubuntu-24.04
    environment: ${{ inputs.managed_environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CHALK_MANAGED_AWS_REGION: ${{ vars.CHALK_MANAGED_AWS_REGION }}
      CHALK_MANAGED_PARAMETER_PREFIX: ${{ vars.CHALK_MANAGED_PARAMETER_PREFIX }}
      CHALK_MANAGED_RECORDER_CONFIG_PARAMETER: ${{ vars.CHALK_MANAGED_RECORDER_CONFIG_PARAMETER }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-tools
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.prepare-release.outputs.set_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare-release.outputs.run_id }}
          path: release-input
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CHALK_MANAGED_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CHALK_MANAGED_AWS_REGION }}
      - name: Require qualified runtime pins before any deployment
        env:
          RELEASE_TARGET: ${{ inputs.managed_environment }}
        run: python scripts/releases/observe.py --target "$RELEASE_TARGET" --release-set release-input/release-set.json --preflight

  deploy-web:
    name: Upload prebuilt web-${{ inputs.managed_environment }}
    needs: [prepare-release, deploy-managed]
    if: >-
      always() && !cancelled() && inputs.deploy_web && !inputs.dry_run &&
      needs.prepare-release.result == 'success' &&
      (!inputs.deploy_managed || needs.deploy-managed.result == 'success')
    runs-on: ubuntu-24.04
    environment: ${{ inputs.managed_environment }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-tools
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.prepare-release.outputs.set_artifact_id }}
          run-id: ${{ needs.prepare-release.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-input
      - name: Fetch the exact prebuilt web archive
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_TARGET: ${{ inputs.managed_environment }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts/releases')
          from github_release import GitHub
          from release_set import validate
          value = validate(json.loads(pathlib.Path('release-input/release-set.json').read_text()))
          target = os.environ['WEB_TARGET']
          member = value['web'][target]
          data = GitHub().artifact(value['run_id'], member['artifact_id'], f'web-{target}.tar.gz', member['sha256'])
          pathlib.Path(f'release-input/web-{target}.tar.gz').write_bytes(data)
          PY
      - name: Upload without build or Functions compilation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WEB_TARGET: ${{ inputs.managed_environment }}
          PAGES_PROJECT: ${{ vars.CHALK_PAGES_PROJECT }}
        run: python scripts/releases/web.py deploy --target "$WEB_TARGET" --release-set release-input/release-set.json --archive "release-input/web-$WEB_TARGET.tar.gz" --project "$PAGES_PROJECT"

  activation:
    needs: [prepare-release, deploy-managed, deploy-web]
    if: >-
      always() && !cancelled() && inputs.deploy_managed && inputs.deploy_web &&
      needs.deploy-managed.result == 'success' && needs.deploy-web.result == 'success'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.managed_environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      activated_at: ${{ steps.time.outputs.activated_at }}
    env:
      CHALK_MANAGED_AWS_REGION: ${{ vars.CHALK_MANAGED_AWS_REGION }}
      CHALK_MANAGED_INSTANCE_ID: ${{ vars.CHALK_MANAGED_INSTANCE_ID }}
      CHALK_MANAGED_PARAMETER_PREFIX: ${{ vars.CHALK_MANAGED_PARAMETER_PREFIX }}
      CHALK_MANAGED_RECORDER_CONFIG_PARAMETER: ${{ vars.CHALK_MANAGED_RECORDER_CONFIG_PARAMETER }}
      CHALK_RELEASE_OBSERVER_DOCUMENT_NAME: ${{ vars.CHALK_RELEASE_OBSERVER_DOCUMENT_NAME }}
      CHALK_RELEASE_OBSERVER_DOCUMENT_VERSION: ${{ vars.CHALK_RELEASE_OBSERVER_DOCUMENT_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-tools
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare-release.outputs.set_artifact_id }}
          merge-multiple: true
          run-id: ${{ needs.prepare-release.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-input
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CHALK_MANAGED_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CHALK_MANAGED_AWS_REGION }}
      - name: Confirm served tuple before the call
        env:
          RELEASE_TARGET: ${{ inputs.managed_environment }}
        run: python scripts/releases/observe.py --target "$RELEASE_TARGET" --release-set release-input/release-set.json
      - id: time
        run: echo "activated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  dry-run:
    if: inputs.dry_run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-tools
      - name: Print build configuration only
        run: |
          python scripts/releases/web.py build --target nightly --sha "$TARGET_SHA" --dry-run
          python scripts/releases/web.py build --target production --sha "$TARGET_SHA" --dry-run
          echo 'No credentials requested, artifacts built, or deployments dispatched.'
  proof-direct:
    needs: [prepare-release, activation]
    if: "!inputs.orchestrated"
    uses: ./.github/workflows/real-call-proof.yml
    with:
      environment: ${{ inputs.managed_environment }}
      proofs: smoke transcript
    secrets: inherit

  observe-direct:
    needs: [prepare-release, activation, proof-direct]
    if: always() && !inputs.orchestrated && needs.activation.result == 'success'
    uses: ./.github/workflows/release-observation.yml
    with:
      environment: ${{ inputs.managed_environment }}
      target_sha: ${{ inputs.target_sha }}
      run_id: ${{ needs.prepare-release.outputs.run_id }}
      release_id: ${{ needs.prepare-release.outputs.release_id }}
      set_artifact_id: ${{ needs.prepare-release.outputs.set_artifact_id }}
      set_sha256: ${{ needs.prepare-release.outputs.set_sha256 }}
      manifest_artifact_id: ${{ needs.prepare-release.outputs.manifest_artifact_id }}
      manifest_sha256: ${{ needs.prepare-release.outputs.manifest_sha256 }}
      activated_at: ${{ needs.activation.outputs.activated_at }}
      deploy_result: success
      proof_result: ${{ needs.proof-direct.result == 'success' && needs.proof-direct.outputs.result || 'failed' }}
    secrets: inherit
