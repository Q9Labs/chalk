name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/master' }}

jobs:
  gate:
    name: Smart gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache-dependency-path: apps/api/go.sum

      - name: Setup Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: 1.19.5

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.3

      - name: Cache Semgrep downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: semgrep-${{ runner.os }}-${{ runner.arch }}-py3.12-1.166.0

      - name: Install Semgrep
        run: pipx install semgrep==1.166.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smart gate
        env:
          CHALK_E2E_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          GATE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          GATE_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            pnpm run gate -- --full
          else
            pnpm run gate
          fi

  publish-api-images:
    name: Publish API images
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-api-images
      cancel-in-progress: false
    env:
      AWS_REGION: ap-southeast-1
      ECR_REGISTRY: 688819141892.dkr.ecr.ap-southeast-1.amazonaws.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::688819141892:role/chalk-ci-image-publish
          aws-region: ap-southeast-1

      - name: Verify signing profile is active
        run: |
          status="$(aws signer get-signing-profile --profile-name chalk_production_ecr --query status --output text)"
          if [[ "$status" != "Active" ]]; then
            echo "Signer profile chalk_production_ecr is not Active (status: $status); refusing to publish unsigned images." >&2
            exit 1
          fi

      - name: Login to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute release id
        id: release
        run: |
          release_id="managed-episode-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:8}-$(openssl rand -hex 4)"
          printf 'id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        id: build-api
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=mode=max \
            --build-context api_source=apps/api \
            --file infrastructure/managed-episode/images/api.Dockerfile \
            --build-arg RELEASE_ID="${{ steps.release.outputs.id }}" \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$ECR_REGISTRY/chalk-api:${{ steps.release.outputs.id }}" \
            --metadata-file /tmp/api-metadata.json \
            --push \
            infrastructure/managed-episode
          printf 'digest=%s\n' "$(jq -r '."containerimage.digest"' /tmp/api-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push Sync image
        id: build-sync
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=mode=max \
            --build-context sync_source=apps/sync \
            --file infrastructure/managed-episode/images/sync.Dockerfile \
            --build-arg RELEASE_ID="${{ steps.release.outputs.id }}" \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$ECR_REGISTRY/chalk-sync:${{ steps.release.outputs.id }}" \
            --metadata-file /tmp/sync-metadata.json \
            --push \
            infrastructure/managed-episode
          printf 'digest=%s\n' "$(jq -r '."containerimage.digest"' /tmp/sync-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Wait for managed signing
        run: |
          for repo_digest in "chalk-api ${{ steps.build-api.outputs.digest }}" "chalk-sync ${{ steps.build-sync.outputs.digest }}"; do
            read -r repo digest <<<"$repo_digest"
            for attempt in $(seq 1 60); do
              status="$(aws ecr describe-image-signing-status --repository-name "$repo" --image-id imageDigest="$digest" --query 'signingStatuses[0].status' --output text 2>/dev/null || echo PENDING)"
              if [[ "$status" == "COMPLETE" ]]; then
                echo "$repo@$digest signing COMPLETE"
                break
              fi
              if [[ "$status" == "FAILED" ]]; then
                echo "Managed signing FAILED for $repo@$digest" >&2
                aws ecr describe-image-signing-status --repository-name "$repo" --image-id imageDigest="$digest" \
                  --query 'signingStatuses[0].failureReason' --output text >&2 || true
                exit 1
              fi
              if [[ "$attempt" == 60 ]]; then
                echo "Managed signing did not reach COMPLETE for $repo@$digest (last status: $status)" >&2
                exit 1
              fi
              sleep 10
            done
          done

      - name: Generate release manifest
        run: |
          ./infrastructure/managed-episode/scripts/generate-release-manifest \
            --api-image "$ECR_REGISTRY/chalk-api@${{ steps.build-api.outputs.digest }}" \
            --sync-image "$ECR_REGISTRY/chalk-sync@${{ steps.build-sync.outputs.digest }}" \
            --architectures linux/arm64 \
            --source-revision "$GITHUB_SHA" \
            --release-id "${{ steps.release.outputs.id }}" \
            --output "infrastructure/managed-episode/generated/${{ steps.release.outputs.id }}.json"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ steps.release.outputs.id }}
          path: infrastructure/managed-episode/generated/${{ steps.release.outputs.id }}.json
          retention-days: 90
          if-no-files-found: error

      - name: Release summary
        run: |
          {
            echo "## Release ${{ steps.release.outputs.id }}"
            echo "- source: \`$GITHUB_SHA\`"
            echo "- api: \`$ECR_REGISTRY/chalk-api@${{ steps.build-api.outputs.digest }}\`"
            echo "- sync: \`$ECR_REGISTRY/chalk-sync@${{ steps.build-sync.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    name: Deploy web
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: "5281943bd26d5bdcf4c3915606cd6bfb"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web workspace dependencies
        run: pnpm --filter "web^..." run build

      - name: Build production web
        env:
          CHALK_ENVIRONMENT: production
          CHALK_EPISODE_DIAGNOSTICS: hosted
          CHALK_EPISODE_DIAGNOSTICS_PRODUCTION_OPT_IN: "true"
          CHALK_EPISODE_DIAGNOSTICS_GATEWAY: verified
          VITE_API_URL: https://api.chalkmeet.com
          VITE_CHALK_TELEMETRY_ENABLED: "false"
        run: pnpm --filter web run build

      - name: Deploy staging web
        id: deploy-staging
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          deployment_output="$(npx wrangler pages deploy dist/client --project-name chalk-staging --branch staging --commit-hash "$GITHUB_SHA" --commit-dirty=false)"
          printf '%s\n' "$deployment_output"
          deployment_url="$(printf '%s\n' "$deployment_output" | grep 'Take a peek over at' | grep -Eo 'https://[[:alnum:]-]+\.chalk-staging\.pages\.dev' | tail -n 1 || true)"
          if [[ -z "$deployment_url" ]]; then
            echo "Wrangler did not print an exact staging deployment URL." >&2
            exit 1
          fi
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify staging web
        run: node scripts/deploy/verify-web-deploy.mjs "${{ steps.deploy-staging.outputs.url }}" "$GITHUB_SHA"

      - name: Deploy production web
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy dist/client --project-name chalk --branch master --commit-hash "$GITHUB_SHA" --commit-dirty=false

      - name: Verify production web
        run: node scripts/deploy/verify-web-deploy.mjs https://chalkmeet.com "$GITHUB_SHA" --production
