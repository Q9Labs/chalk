name: CodeQL

# A push to master analyses only the languages whose files changed in it, so alerts land on the default branch, where code
# scanning tracks them. The weekly run analyses every language, so anything a push skips is analysed within a week. Pull
# requests and merge groups do not run it: the push analyses the same code that landed, a merge-queue ref is deleted after
# its group, and alerts on it would not show on master. It is not a required check, so an alert never blocks a merge.
# Run it by hand on a branch with `workflow_dispatch`.
on:
  push:
    branches: [master]
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  languages:
    name: Select CodeQL languages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.select.outputs.languages }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Select languages
        id: select
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            node scripts/gates/codeql-languages.mjs "${PUSH_BEFORE_SHA}" >> "${GITHUB_OUTPUT}"
          else
            node scripts/gates/codeql-languages.mjs --full >> "${GITHUB_OUTPUT}"
          fi
          cat "${GITHUB_OUTPUT}"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    # A failed selection analyses every language.
    if: ${{ !cancelled() && (needs.languages.result != 'success' || needs.languages.outputs.languages != '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.result == 'success' && needs.languages.outputs.languages || '["actions", "go", "javascript-typescript", "python"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/api/go.mod
          cache: false

      # Same languages, build modes, default queries and categories as the default setup this replaces, so existing
      # alerts carry over.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          dependency-caching: true

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
