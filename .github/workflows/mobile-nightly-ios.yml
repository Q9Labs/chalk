name: iOS nightly TestFlight

on:
  workflow_run:
    workflows: [Cut nightly]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      source_run:
        description: Cut nightly run to build (its id); the run must be the current cut
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: chalk-ios-testflight-release
  cancel-in-progress: false
  queue: max

jobs:
  ios:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-26
    environment: production-signing
    timeout-minutes: 120
    steps:
      # A scheduled cut ships the newest green commit, which can be older than the run's head_sha, so the revision to
      # build is the one the passing cut recorded. Anything but the current passing cut is skipped.
      - name: Find the revision of the current passing cut
        id: cut
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=nightly&task=nightly-cut&per_page=1" \
            --jq ".[0] | select(.payload.proof_run_id == \"$SOURCE_RUN\" and .payload.proof_result == \"passed\") | .sha")
          if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "Run $SOURCE_RUN is not the current passing nightly cut; nothing to upload."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.cut.outputs.verified == 'true'
        with:
          ref: ${{ steps.cut.outputs.sha }}
      - uses: 1password/install-cli-action@9a0c9dd934086b7ab1d90115d455bda1c53c2bdb
        if: steps.cut.outputs.verified == 'true'
      - name: Skip when nothing in the app changed since the last upload
        id: decide
        if: steps.cut.outputs.verified == 'true'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ASC_CREDENTIAL_ITEM_ID: ${{ vars.ASC_CREDENTIAL_ITEM_ID }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run }}
          SOURCE_SHA: ${{ steps.cut.outputs.sha }}
        run: bash apps/mobile/scripts/release/publish-nightly-ios.sh decide
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.decide.outputs.build == 'true'
        with:
          version: 12.8.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.decide.outputs.build == 'true'
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install dependencies
        if: steps.decide.outputs.build == 'true'
        run: pnpm install --frozen-lockfile
      # CocoaPods reads the embedded whiteboard bundle, and the Release archive bundles the workspace SDKs from their built dist.
      - name: Build workspace SDKs
        if: steps.decide.outputs.build == 'true'
        run: pnpm --filter @q9labsai/chalk-mobile run prepare:native-dependencies
      - name: Install CocoaPods dependencies
        if: steps.decide.outputs.build == 'true'
        working-directory: apps/mobile
        run: pod install --project-directory=ios
      - name: Build and upload the verified revision to TestFlight
        if: steps.decide.outputs.build == 'true'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ASC_CREDENTIAL_ITEM_ID: ${{ vars.ASC_CREDENTIAL_ITEM_ID }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run }}
          SOURCE_SHA: ${{ steps.cut.outputs.sha }}
        run: bash apps/mobile/scripts/release/publish-nightly-ios.sh publish
      - name: Keep the dSYMs
        if: steps.decide.outputs.build == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chalk-ios-nightly-dsyms-${{ github.run_id }}
          path: ${{ runner.temp }}/chalk-ios-dsyms/*.zip
          if-no-files-found: ignore
          retention-days: 14
