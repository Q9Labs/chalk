name: Hotfix rehearsal
run-name: Hotfix rehearsal ${{ inputs.sha }}
# Rehearses what a production hotfix asks of a host, on a host this run creates and ends: build the hotfix release on the newest held
# nightly cut, deliver the cut, then the hotfix over it, then roll back to the cut as the Release job does (a fresh envelope of the
# older source) (scripts/nightly-host-proof/run). The Pages rollback is rehearsed on the nightly Pages project, which nobody serves
# (scripts/releases/web.py rehearse). After the hotfix leg and after the rollback leg the host serves nightly-api.chalkmeet.com and
# runs a real call through it (the camera-share proof on the Cloudflare plane, without recording). The recorder path is not run here:
# the per-cut lanes cover it, and Hotfix runs the full smoke on production after every hotfix.
# Cost: one on-demand t4g.small for about 20 minutes, under 0.02 USD, plus the build minutes of a release.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA on master whose push Gate passed, newer than the newest held nightly cut
        required: true
        type: string
permissions: {}
concurrency:
  group: chalk-nightly-host-proof-run
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # Planning downloads the manifest of a cut that is not promoted.
      contents: read
      deployments: read
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
    outputs:
      baseline: ${{ steps.plan.outputs.baseline }}
    steps:
      - name: Refuse non-master dispatch before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a master commit with a green push Gate and name the newest held cut as the baseline
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HOTFIX_SHA: ${{ inputs.sha }}
          HOTFIX_ENVIRONMENT: nightly
        run: python3 scripts/releases/hotfix.py plan
  release:
    # Builds the hotfix release and its nightly web archive on the baseline, as Hotfix does, and deploys nothing.
    needs: plan
    permissions:
      contents: write # ci.yml's deploy job declares it, and a caller must grant what a called workflow declares.
      actions: read
      deployments: write
      id-token: write
      packages: write # Release publishes the application images to GHCR.
      attestations: write
    uses: ./.github/workflows/ci.yml
    with:
      target_sha: ${{ inputs.sha }}
      managed_environment: nightly
      release_managed: true
      deploy_managed: false
      publish_runtime_only: true
      build_web: true
      orchestrated: true
      stable_manifest_run_id: ${{ fromJSON(needs.plan.outputs.baseline).run_id }}
      stable_manifest_artifact_id: ${{ fromJSON(needs.plan.outputs.baseline).manifest_artifact_id }}
      enable_recorder_control: false
    secrets: inherit
  rehearse:
    name: Deliver the cut, the hotfix, then roll back, with a call after each
    needs: [plan, release]
    runs-on: ubuntu-24.04
    # The environment accepts master only, and only it can assume the AWS role: a pull request never reaches AWS.
    environment:
      name: nightly-host-proof
      deployment: false
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      # What the call proof needs, as the Nightly cloudflare-plane lane installs it (nightly-proofs.yml).
      - name: Install proof dependencies
        run: pnpm install --frozen-lockfile --filter @q9labsai/chalk-client...
      - uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg imagemagick espeak fonts-dejavu-core
      - name: Install ImageMagick 7 entry point
        run: |
          # shellcheck disable=SC2016
          printf '#!/bin/sh\nif [ "$1" = montage ]; then shift; exec montage "$@"; fi\nexec convert "$@"\n' | sudo tee /usr/local/bin/magick > /dev/null
          sudo chmod +x /usr/local/bin/magick
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - name: Download the baseline's release manifest
        uses: ./.github/actions/download-sealed
        with:
          key: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
          name: release-manifest-${{ fromJSON(needs.plan.outputs.baseline).release_id }}
          path: ${{ runner.temp }}/baseline
          run-id: ${{ fromJSON(needs.plan.outputs.baseline).run_id }}
          merge-multiple: true
      - name: Download the hotfix release's manifest
        uses: ./.github/actions/download-sealed
        with:
          key: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
          name: release-manifest-${{ needs.release.outputs.release_id }}
          path: ${{ runner.temp }}/hotfix
          run-id: ${{ needs.release.outputs.run_id }}
          merge-multiple: true
      - name: Configure the host-proof role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.CHALK_HOST_PROOF_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-duration-seconds: 3600
      - name: Deliver the cut, then the hotfix, then roll back
        env:
          AMI: ${{ secrets.CHALK_HOST_PROOF_AMI }}
          SUBNET: ${{ secrets.CHALK_HOST_PROOF_SUBNET }}
          SECURITY_GROUP: ${{ secrets.CHALK_HOST_PROOF_SECURITY_GROUP }}
          BASELINE_RELEASE: ${{ fromJSON(needs.plan.outputs.baseline).release_id }}
          HOTFIX_RELEASE: ${{ needs.release.outputs.release_id }}
        run: |
          scripts/nightly-host-proof/run --manifest "$RUNNER_TEMP/baseline/$BASELINE_RELEASE.json" \
            --then "$RUNNER_TEMP/hotfix/$HOTFIX_RELEASE.json" --rollback-manifest "$RUNNER_TEMP/baseline/$BASELINE_RELEASE.json" --call-proof \
            --run-id "$GITHUB_RUN_ID" --ami "$AMI" --subnet "$SUBNET" --security-group "$SECURITY_GROUP" --summary "$GITHUB_STEP_SUMMARY"
  pages:
    name: Upload the web, then restore the saved Pages deployment
    needs: [plan, release]
    runs-on: ubuntu-24.04
    # The restore puts back the deployment saved at the start, so it must not overlap a nightly Release that deploys web.
    concurrency:
      group: chalk-environment-nightly
      cancel-in-progress: false
    environment:
      name: nightly
      deployment: false
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
      # The account id is an environment secret so no workflow file or log carries it.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      # The Pages-only credential cannot deploy Workers. Probe both live routes and fail closed.
      CLOUDFLARE_VENDOR_WORKER_VERIFY_ONLY: "true"
      PAGES_PROJECT: ${{ vars.CHALK_PAGES_PROJECT }}
    steps:
      - name: Refuse non-master dispatch before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - name: Upload the hotfix web archive, then restore the Pages deployment that was live
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ needs.release.outputs.run_id }}
          WEB_ARTIFACT: ${{ toJSON(fromJSON(needs.release.outputs.web).nightly) }}
          HOTFIX_SHA: ${{ inputs.sha }}
        run: python3 scripts/releases/web.py rehearse --target nightly --sha "$HOTFIX_SHA"
