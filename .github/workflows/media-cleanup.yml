name: Clean completed media builders
on:
  workflow_run:
    workflows: [Release, Cut nightly, Promote newest held nightly]
    types: [completed]
permissions:
  contents: read
jobs:
  cleanup:
    if: github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nightly
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Reclaim only builders and temporary access owned by this completed run
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          COMPLETED_MEDIA_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 scripts/releases/media.py cleanup_cloud
