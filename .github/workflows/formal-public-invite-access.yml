name: Public invite access model

# Model-checks the public invite, arrival and access grants in the API. See
# .agents/skills/public-invite-access-formal/SKILL.md. Keep these paths in step with
# the skill's coverage record.
on:
  pull_request:
    paths:
      - apps/api/db/queries/sync_lifecycle.sql
      - apps/api/db/queries/episode_live.sql
      - apps/api/internal/publicinvites/**
      - apps/api/internal/publicinviteapp/**
      - apps/api/internal/adapters/postgres/public_invites.go
      - apps/api/internal/adapters/postgres/public_episode_admission.go
      - apps/api/internal/adapters/postgres/episode_public_join.go
      - tools/formal/public-invite-access/**
      - .github/workflows/formal-public-invite-access.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-public-invite-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Public invite access model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-24.04 ships Java 17, which TLC needs.
      - name: Model-check public invite access
        run: tools/formal/public-invite-access/run.sh
