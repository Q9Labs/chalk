name: Episode lifecycle model

# Model-checks the Episode lifecycle and admission. See
# .agents/skills/episode-lifecycle-formal/SKILL.md. Keep these paths in step with
# the skill's coverage record.
on:
  pull_request:
    paths:
      - apps/api/internal/adapters/postgres/episode_lifecycle_create.go
      - apps/api/internal/adapters/postgres/episode_control.go
      - apps/api/internal/adapters/postgres/public_episode_admission.go
      - apps/api/db/queries/sync_lifecycle.sql
      - apps/sync/lib/chalk_sync/stateholder/postgres/lifecycle.ex
      - apps/sync/lib/chalk_sync/stateholder/postgres/lifecycle/**
      - apps/sync/lib/chalk_sync/stateholder/postgres/sql/lifecycle.ex
      - apps/sync/lib/chalk_sync/stateholder/postgres/external_operation_planner.ex
      - apps/sync/lib/chalk_sync/stateholder/postgres/external_operation_planner/**
      - apps/sync/lib/chalk_sync/stateholder/postgres/sql/external_operation_planner.ex
      - apps/sync/lib/chalk_sync/stateholder/postgres/external_operation_finalizer.ex
      - apps/sync/lib/chalk_sync/stateholder/postgres/external_operation_finalizer/**
      - apps/sync/lib/chalk_sync/stateholder/postgres/sql/external_operation_finalizer.ex
      - apps/sync/lib/chalk_sync/external_operation_consumer.ex
      - apps/sync/lib/chalk_sync/external_operation_consumer/**
      - tools/formal/episode-lifecycle/**
      - tools/formal/tla2tools.sh
      - .github/workflows/formal-episode-lifecycle.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-episode-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Episode lifecycle model
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-24.04 ships Java 17, which TLC needs.
      - name: Model-check the Episode lifecycle and admission
        run: tools/formal/episode-lifecycle/run.sh
