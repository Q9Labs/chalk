name: Daily OSV

on:
  schedule:
    - cron: "27 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-osv-issue
  cancel-in-progress: false
  queue: max

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.8.1
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .tool-versions
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/api/go.mod
          cache: false
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Scan every OSV finding
        id: osv
        run: bash scripts/gates/osv-scanner.sh
      - name: Open or update the standing security issue
        if: failure() && steps.osv.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label=security-osv-daily
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --color D93F0B --force
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state all --limit 1 --json number --jq '.[0].number // empty')"
          body="Daily full OSV scan failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This scan has no baseline; review every finding in the scan output."
          if [[ -z "$issue" ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" --title 'Daily OSV findings' --body "$body"
          else
            gh issue reopen "$issue" --repo "$GITHUB_REPOSITORY"
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
