name: Infrastructure drift

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: chalk-infrastructure-drift
  cancel-in-progress: false

jobs:
  drift:
    # Disabled until the state/lease and cloud-read permission contract is met.
    if: vars.CHALK_ALCHEMY_DRIFT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: ./.github/actions/setup-js
      - name: Assume the Alchemy drift role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.CHALK_ALCHEMY_DRIFT_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Check registered cutovers and notify Oncall
        env:
          ONCALL_WEBHOOK_URL: ${{ secrets.ONCALL_WEBHOOK_URL }}
        run: pnpm --dir infrastructure exec tsx platform/check-drift.mjs
