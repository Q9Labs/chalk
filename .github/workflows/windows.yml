name: Windows

# Proves that a developer on native Windows (PowerShell, no WSL) can install, check, build and test the repository.
# The Gate workflow stays the merge authority on Linux; this job covers what only a Windows checkout can break:
# line endings, path handling, .cmd shims and POSIX shell syntax in scripts.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "scratchpad/**"
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "scratchpad/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chalk-windows-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  # A registry that answers 500 for a moment must not fail a job: pnpm retries its fetches longer than its default of two.
  PNPM_CONFIG_FETCH_RETRIES: "5"
  PNPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"

jobs:
  windows:
    name: Windows
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-js

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            features/media/sfu/go.sum

      # Every step runs even when an earlier one failed, so one run reports every Windows break.
      - name: Test native Windows dev orchestration
        run: node --test scripts/dev/*.test.mjs

      - name: Check types
        if: ${{ !cancelled() }}
        run: pnpm run check-types

      # Lint type-checks each package against its dependencies' built output, so the build comes first.
      # One task at a time: the web, whiteboard and React Native builds each run `tsc --build` over the client's declarations, so together they race on its build info, and parallel Metro and tsup runs can exhaust a Windows runner's desktop heap (exit 0xC0000142).
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm run build --concurrency=1

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm run lint

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: pnpm run format:check

      # The pre-commit hook runs this on staged files; CI has none, so it checks the files the change touched.
      - name: Run the fast gate
        if: ${{ !cancelled() }}
        run: pnpm run gate:fast -- --base "$env:GATE_BASE_REF"
        env:
          GATE_BASE_REF: ${{ (github.event_name == 'push' && github.event.before) || format('origin/{0}', github.base_ref || 'master') }}
          # A manual run on master changes no files, and an empty scope is not a failure there.
          GATE_ALLOW_EMPTY: "1"

      - name: Check generated files
        if: ${{ !cancelled() }}
        run: pnpm run check:generated

      - name: Build, vet and test the API
        if: ${{ !cancelled() }}
        working-directory: apps/api
        # pwsh stops only on the last native command, so these three run in bash, which stops at the first failure.
        shell: bash
        run: |
          go build ./...
          go vet ./...
          go test -short ./...

      - name: Build, vet and test the SFU
        if: ${{ !cancelled() }}
        working-directory: features/media/sfu
        # pwsh stops only on the last native command, so these three run in bash, which stops at the first failure.
        shell: bash
        run: |
          go build ./...
          go vet ./...
          go test -short ./...

      # The packed web consumer test drives Chromium and fails in CI when the browser is missing.
      - name: Resolve Windows Playwright cache key
        id: playwright-key
        if: ${{ !cancelled() }}
        run: |
          $version = (pnpm --dir sdks/typescript/client exec playwright --version).Trim().Split(" ")[-1]
          "key=playwright-$version-chromium-windows-$env:RUNNER_ARCH" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Cache Chromium for Windows
        id: playwright-cache
        if: ${{ !cancelled() }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ steps.playwright-key.outputs.key }}

      - name: Install Chromium
        if: ${{ !cancelled() && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm --dir sdks/typescript/client exec playwright install chromium

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: pnpm run test
