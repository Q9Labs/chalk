name: Packed web SDK consumer

# The Gate runs the packed consumer in Chromium on every pull request that touches these packages.
# Firefox and WebKit have not failed alone in the last 30 days, so the three-browser run happens nightly,
# and on a pull request only when its own workflow or browser setup changes.
on:
  pull_request:
    paths:
      - ".github/actions/setup-playwright/**"
      - ".github/workflows/sdk-web-consumer-e2e.yml"
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packed-web-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packed-consumer:
    name: Packed artifacts in real browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-js

      - name: Install browser runtimes
        timeout-minutes: 12
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium firefox webkit

      - name: Prove the clean packed consumer
        run: node tools/sdk-web-consumer-e2e/scripts/run.mjs --browsers=chromium,firefox,webkit
