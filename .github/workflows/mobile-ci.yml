name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chalk-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Mobile type checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.26.2

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 25.6.1
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare mobile workspace dependencies
        run: pnpm --filter @q9labsai/chalk-mobile run prepare:native-dependencies

      - name: Check mobile types
        run: pnpm --filter @q9labsai/chalk-mobile run check-types

  android:
    name: Unsigned Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.26.2

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 25.6.1
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare native dependencies
        run: pnpm --filter @q9labsai/chalk-mobile run prepare:native-dependencies

      - name: Build unsigned Android release
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Preserve unsigned Android evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chalk-android-unsigned
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: Unsigned iOS simulator build
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.26.2

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 25.6.1
          cache: pnpm

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: 3.3.12
          bundler-cache: true
          working-directory: apps/mobile

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile
        run: bundle exec pod install --project-directory=ios

      - name: Build for the iOS simulator
        run: >-
          xcodebuild
          -workspace apps/mobile/ios/Chalk.xcworkspace
          -scheme Chalk
          -configuration Debug
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          build
