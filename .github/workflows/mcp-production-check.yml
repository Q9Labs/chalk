name: MCP production check

# Connects to the hosted MCP server the way a client does: an unauthenticated call
# gets a 401 with OAuth discovery, then the proof tenant's API key runs initialize,
# tools/list and one tool call (listing Spaces, which the proof key's scopes allow). A 404 or a broken sign-in setup fails this run.
# It runs after each production Promote and on demand. A timer would repeat a proof that nothing has changed since the last run.

on:
  workflow_run:
    workflows: ["Promote newest held nightly"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment with a permanent proof Tenant
        type: environment
        default: production

permissions:
  contents: read

concurrency:
  group: mcp-production-check-${{ inputs.environment || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  mcp:
    name: MCP initialize, list tools and call a tool
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment || 'production' }}
      deployment: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
      - name: Check the hosted MCP server
        env:
          CHALK_PROOF_API_URL: ${{ secrets.CHALK_PROOF_API_URL }}
          CHALK_PROOF_API_KEY: ${{ secrets.CHALK_PROOF_API_KEY }}
          CHALK_MCP_EXPECT_OAUTH: ${{ vars.CHALK_MCP_EXPECT_OAUTH }}
        run: node scripts/mcp-proof/check.mjs
