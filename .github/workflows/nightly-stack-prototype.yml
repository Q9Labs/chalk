name: Nightly stack prototype

on:
  push:
    branches: [ci/nightly-stack-boot]
    paths:
      - scripts/nightly-stack/**
      - .github/workflows/nightly-stack-prototype.yml

permissions:
  contents: read

jobs:
  boot:
    name: Boot on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the images (not part of the boot time)
        run: |
          started=$(date +%s)
          docker build -q --build-context api_source=apps/api --build-context protocol_source=features/media/sfu/protocol \
            -f infrastructure/managed-episode/images/api.Dockerfile -t stack-api infrastructure/managed-episode > /dev/null &
          docker build -q --build-context sync_source=apps/sync -f infrastructure/managed-episode/images/sync.Dockerfile \
            -t stack-sync infrastructure/managed-episode > /dev/null &
          docker build -q -f infrastructure/sfu/Dockerfile -t stack-sfu features/media/sfu > /dev/null &
          wait
          echo "build wall: $(($(date +%s) - started))s"
          for image in stack-api stack-sync stack-sfu; do
            echo "$image compressed: $(docker save "$image" | gzip -1 | wc -c | awk '{printf "%.0f MB", $1 / 1048576}')"
          done
      - name: Boot the stack, cold Postgres and Redis pulls
        run: |
          echo "runner: $(uname -m), $(nproc) cpus, $(free -m | awk '/Mem/ {print $2}') MB"
          bash scripts/nightly-stack/boot --api-image stack-api --sync-image stack-sync --sfu-image stack-sfu \
            --migration-target "$(grep -o '[0-9]\{14\}' apps/api/db/migrations/embed.go | head -1)" --dir "$RUNNER_TEMP/stack"
          sed 's/=.*/=<set>/' "$RUNNER_TEMP/stack/proof.env"
      - name: Install the proof tools
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: |
          started=$(date +%s)
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick espeak fonts-dejavu-core > /dev/null
          printf '#!/bin/sh\nif [ "$1" = montage ]; then shift; exec montage "$@"; fi\nexec convert "$@"\n' | sudo tee /usr/local/bin/magick > /dev/null
          sudo chmod +x /usr/local/bin/magick
          echo "apt: $(($(date +%s) - started))s"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: matrix.runner == 'ubuntu-24.04-arm'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.runner == 'ubuntu-24.04-arm'
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install the proof dependencies and Chromium
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: |
          started=$(date +%s)
          pnpm install --frozen-lockfile --filter @q9labsai/chalk-client... > /dev/null
          echo "pnpm install: $(($(date +%s) - started))s"
          started=$(date +%s)
          pnpm --filter @q9labsai/chalk-client exec playwright install --with-deps chromium > /dev/null
          echo "chromium: $(($(date +%s) - started))s"
      - name: Camera share proof against the stack
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: |
          set -a
          . "$RUNNER_TEMP/stack/proof.env"
          set +a
          started=$(date +%s)
          status=0
          pnpm prod:proof camera-share --force-layer-switch || status=$?
          echo "camera-share: exit $status, $(($(date +%s) - started))s"
          uptime
          docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}'
          exit "$status"
      - name: Stack logs when the proof failed
        if: failure()
        run: |
          for name in api sync sfu; do echo "== $name"; docker logs --tail 60 "chalk-stack-$name" 2>&1 | grep -v '"/v1/sync"' | cut -c1-2500; done
          echo "== sdk reports"; docker logs chalk-stack-api 2>&1 | grep sdk.connection_report | jq -r '.report' | jq -c '.events[] | select(.outcome != "succeeded" and .outcome != "started")' | cut -c1-600 | head -30
          echo "== evidence"; find .private/prod-proof -maxdepth 3 -type f 2>/dev/null | head -30
          for f in $(find .private/prod-proof -name '*.json' -o -name '*.log' -o -name '*.txt' 2>/dev/null | head -8); do echo "-- $f"; head -c 1500 "$f"; echo; done
      - name: Stop the stack
        if: always()
        run: bash scripts/nightly-stack/boot down
