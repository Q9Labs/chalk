name: Promote newest held nightly
run-name: Promote ${{ inputs.expected_sha }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact held release revision approved for promotion
        type: string
        required: true
      capture_proofs:
        description: Run call-artifacts, the Recording and Transcript proof. Set false only when this deploy does not turn the capture flags on
        type: boolean
        default: true
      scorecard_override:
        description: Written reason to accept failed nightly Chalk SFU proof or gated scorecard results; leave blank to apply the gates
        type: string
        required: false
permissions:
  contents: read
  actions: read
  deployments: write
  id-token: write
concurrency:
  group: chalk-environment-production
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-24.04
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - name: Refuse non-master dispatch before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/master
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Choose newest held record and verify its Chalk SFU proof, exact SHA and rollback source
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_sha }}
          SCORECARD_OVERRIDE: ${{ inputs.scorecard_override }}
        run: python3 scripts/releases/release.py select
  approve:
    needs: select
    runs-on: ubuntu-24.04
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
    environment: production
    outputs:
      pages_deployment_id: ${{ steps.pages.outputs.pages_deployment_id }}
      rollback_media: ${{ steps.media.outputs.members }}
      npm_latest: ${{ steps.npm.outputs.npm_latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Recheck exact selection and Chalk SFU proof after approval under the production lock
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION: ${{ needs.select.outputs.selection }}
          SCORECARD_OVERRIDE: ${{ inputs.scorecard_override }}
        run: python3 scripts/releases/release.py recheck
      - name: Select the explicit production Pages destination
        run: |
          node --input-type=module -e 'import { PRODUCTION_PROJECT } from "./scripts/deploy/deploy-web-release.mjs"; console.log("PAGES_PROJECT=" + PRODUCTION_PROJECT)' >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.CHALK_MANAGED_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CHALK_MANAGED_AWS_REGION }}
      - name: Retain the live media pins before the first promotion changes them
        id: media
        env:
          CHALK_MANAGED_RECORDER_CONFIG_PARAMETER: ${{ vars.CHALK_MANAGED_RECORDER_CONFIG_PARAMETER || '/chalk/production/release/recorder.json' }}
          PREVIOUS_MEDIA_SHA256: ${{ fromJSON(needs.select.outputs.selection).previous.media_sha256 }}
        run: |
          if [[ -z "$PREVIOUS_MEDIA_SHA256" ]]; then
            python3 scripts/releases/media.py retain_runtime --environment production --output previous-media.json
            echo "members=$(python3 scripts/releases/seal.py text previous-media.json)" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the live production Pages deployment before any upload
        id: pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/releases/web.py current
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.8.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
      - name: Retain the live npm latest tags before the first promotion changes them
        id: npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/releases/npm_dist_tags.py retain --output previous-npm.json
      - name: Retain rollback source and saved Pages identity
        env:
          SELECTION: ${{ needs.select.outputs.selection }}
          PAGES_ID: ${{ steps.pages.outputs.pages_deployment_id }}
        run: |
          jq -n --argjson source "$SELECTION" --arg pages "$PAGES_ID" --argjson npm "$(cat previous-npm.json)" '{source:$source, pages_deployment_id:$pages, npm_latest:$npm}' > rollback.json
          echo "Rollback source and Pages identity retained in the sealed promotion-rollback artifact." >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/upload-sealed
        with:
          key: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
          name: promotion-rollback-${{ github.run_attempt }}
          path: |
            rollback.json
            previous-media.json
            previous-npm.json
          retention-days: 90
  chalk-sfu-spaces:
    # Runs before the deploy, on the release still in production. That release lets the public API move an allowlisted Space to chalk_sfu, and a plane stored that way survives the upgrade; the release that adds the per-Space setting refuses it. It runs the proof code of this master revision. A failure stops Promote before anything deploys.
    permissions:
      contents: read
    needs: [select, approve]
    uses: ./.github/workflows/real-call-proof.yml
    with:
      environment: production
      proofs: chalk-sfu-spaces
      media_plane: chalk_sfu
    secrets: inherit
  release:
    permissions:
      contents: write # Release's deploy job asks for it to hold the staging-SFU lease on nightly; the production path does not use it.
      actions: read
      deployments: write
      id-token: write
    needs: [select, approve, chalk-sfu-spaces]
    uses: ./.github/workflows/ci.yml
    with:
      target_sha: ${{ fromJSON(needs.select.outputs.selection).selection.target_sha }}
      release_managed: false
      deploy_managed: true
      managed_environment: production
      deploy_web: true
      orchestrated: true
      manifest_run_id: ${{ fromJSON(needs.select.outputs.selection).selection.run_id }}
      manifest_artifact_id: ${{ fromJSON(needs.select.outputs.selection).selection.manifest_artifact_id }}
      manifest_sha256: ${{ fromJSON(needs.select.outputs.selection).selection.manifest_sha256 }}
      reuse_release_id: ${{ fromJSON(needs.select.outputs.selection).selection.release_id }}
      media_sha256: ${{ fromJSON(needs.select.outputs.selection).selection.media_sha256 }}
      web_artifact: ${{ toJSON(fromJSON(needs.select.outputs.selection).selection.web.production) }}
      promotion_audit: ${{ toJSON(fromJSON(needs.select.outputs.selection).scorecard_override) }}
    secrets: inherit
  proof:
    permissions:
      contents: read
    needs: [select, release]
    uses: ./.github/workflows/real-call-proof.yml
    with:
      environment: production
      proofs: ${{ inputs.capture_proofs && 'leave-chalk-sfu camera-share chat-upload call-artifacts' || 'leave-chalk-sfu camera-share chat-upload' }}
      media_plane: chalk_sfu
      release_sha: ${{ fromJSON(needs.select.outputs.selection).selection.target_sha }}
    secrets: inherit
  scorecard:
    # The scorecard jobs only fail this run. No other job needs them and none reads their result, so they cannot start rollback.
    needs: [select, proof]
    if: needs.proof.result == 'success' && needs.proof.outputs.result == 'passed'
    outputs:
      over: ${{ steps.gate.outputs.over }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
      - name: Download the scorecard of the proof
        # The gate decides what a missing card means.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scorecard-promote-proof
          path: artifacts
      - name: Score the production proof against the nightly median
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SCORECARD_OVERRIDE: ${{ inputs.scorecard_override }}
          REVISION: ${{ fromJSON(needs.select.outputs.selection).selection.target_sha }}
        run: |
          # A held release from before the scorecard code existed uploads no card; every newer revision must.
          SCORECARD_EXPECTED=true
          if git cat-file -e "${REVISION}^{commit}" 2> /dev/null && ! git cat-file -e "${REVISION}:features/scorecard/adapters/proof.mjs" 2> /dev/null; then
            SCORECARD_EXPECTED=false
          fi
          export SCORECARD_EXPECTED
          features/scorecard/promote-gate.sh first artifacts/scorecard-proof.json
  scorecard-rerun:
    permissions:
      contents: read
    needs: [select, scorecard]
    if: needs.scorecard.outputs.over == 'true'
    uses: ./.github/workflows/real-call-proof.yml
    with:
      environment: production
      proofs: leave-chalk-sfu
      media_plane: chalk_sfu
      release_sha: ${{ fromJSON(needs.select.outputs.selection).selection.target_sha }}
      scorecard_label: rerun
    secrets: inherit
  scorecard-final:
    needs: [scorecard, scorecard-rerun]
    if: needs.scorecard.outputs.over == 'true' && needs.scorecard-rerun.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
      - name: Download the scorecard of the rerun
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scorecard-promote-rerun
          path: artifacts
      - name: Decide on the rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: features/scorecard/promote-gate.sh final artifacts/scorecard-proof.json
  rollback:
    permissions:
      contents: write # Release's deploy job asks for it to hold the staging-SFU lease on nightly; the production path does not use it.
      actions: read
      deployments: write
      id-token: write
    needs: [select, approve, release, proof]
    if: >-
      always() && needs.approve.result == 'success' && needs.release.result != 'skipped' &&
      (needs.release.result != 'success' || needs.proof.result != 'success' || needs.proof.outputs.result != 'passed')
    uses: ./.github/workflows/ci.yml
    with:
      target_sha: ${{ fromJSON(needs.select.outputs.selection).previous.target_sha }}
      release_managed: false
      deploy_managed: true
      managed_environment: production
      deploy_web: true
      orchestrated: true
      manifest_run_id: ${{ fromJSON(needs.select.outputs.selection).previous.run_id }}
      manifest_artifact_id: ${{ fromJSON(needs.select.outputs.selection).previous.manifest_artifact_id }}
      manifest_sha256: ${{ fromJSON(needs.select.outputs.selection).previous.manifest_sha256 }}
      reuse_release_id: ${{ fromJSON(needs.select.outputs.selection).previous.release_id }}
      media_sha256: ${{ fromJSON(needs.select.outputs.selection).previous.media_sha256 }}
      rollback_media: ${{ needs.approve.outputs.rollback_media }}
      pages_rollback_id: ${{ needs.approve.outputs.pages_deployment_id }}
    secrets: inherit
  rollback-npm:
    needs: [select, approve, release, proof, rollback]
    if: >-
      always() && needs.approve.result == 'success' && needs.release.result != 'skipped' &&
      (needs.release.result != 'success' || needs.proof.result != 'success' || needs.proof.outputs.result != 'passed')
    runs-on: ubuntu-24.04
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.8.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - name: Restore npm latest to the versions retained before promotion
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_NPM_LATEST: ${{ needs.approve.outputs.npm_latest }}
        run: python3 scripts/releases/npm_dist_tags.py restore
  result:
    needs: [select, approve, release, proof, rollback, rollback-npm]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Failed promotion stays failed; require explicit recovery evidence
        if: always() && needs.approve.result == 'success' && needs.release.result != 'skipped'
        env:
          DEPLOY_RESULT: ${{ needs.release.result }}
          PROOF_RESULT: ${{ needs.proof.result == 'success' && needs.proof.outputs.result || 'failed' }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
          NPM_ROLLBACK_RESULT: ${{ needs.rollback-npm.result }}
          SELECTION: ${{ needs.select.outputs.selection }}
          APPLIED_RELEASE: ${{ needs.release.outputs.applied_release_id }}
          ROLLBACK: ${{ toJSON(needs.rollback.outputs) }}
          PAGES_ID: ${{ needs.approve.outputs.pages_deployment_id }}
          ROLLBACK_MEDIA: ${{ needs.approve.outputs.rollback_media }}
        run: |
          python3 - <<'PYRESULT'
          import json
          import os
          import sys

          selection = json.loads(os.environ['SELECTION'])
          rollback = json.loads(os.environ.get('ROLLBACK') or '{}')
          passed = os.environ.get('DEPLOY_RESULT') == 'success' and os.environ.get('PROOF_RESULT') == 'passed'
          previous = selection['previous']
          recovered = (os.environ.get('ROLLBACK_RESULT') == 'success'
                       and os.environ.get('NPM_ROLLBACK_RESULT') == 'success'
                       and rollback.get('restored_source_release_id') == previous['release_id']
                       and bool(rollback.get('release_id'))
                       and rollback.get('applied_release_id') == rollback['release_id']
                       and bool(os.environ.get('PAGES_ID'))
                       and rollback.get('pages_deployment_id') == os.environ['PAGES_ID'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Source: {selection['selection']['release_id']}\n\nApplied: {os.environ.get('APPLIED_RELEASE', '')}\n\n")
              if not passed:
                  if recovered:
                      summary.write(f"RECOVERY VERIFIED — backend source {previous['release_id']}, applied envelope "
                                    f"{rollback['applied_release_id']}, Pages {rollback['pages_deployment_id']}\n\n")
                  else:
                      summary.write('RECOVERY NOT RUN — manual recovery required\n\n'
                                    'Recovery was skipped, cancelled, failed, or lacks explicit restoration evidence.\n\n'
                                    "npm latest may need restoring to the versions in the promotion-rollback artifact's rollback.json (`npm_latest`).\n\n"
                                    'Run the Release workflow from master with exactly these manual inputs:\n\n```json\n')
                      manual = dict(target_sha=previous['target_sha'], release_managed=False, deploy_managed=True,
                                    managed_environment='production', deploy_web=True, manifest_run_id=previous['run_id'],
                                    manifest_artifact_id=previous['manifest_artifact_id'], manifest_sha256=previous['manifest_sha256'],
                                    reuse_release_id=previous['release_id'], pages_rollback_id=os.environ['PAGES_ID'],
                                    media_sha256=previous.get('media_sha256', ''), rollback_media=os.environ.get('ROLLBACK_MEDIA', ''))
                      summary.write(json.dumps(manual, indent=2) + '\n```\n')
          if not passed:
              sys.exit('promotion failed; consult the recovery evidence and manual Release inputs in the summary')
          PYRESULT
      - name: Refused or skipped promotion stays red
        if: always() && (needs.approve.result != 'success' || needs.release.result == 'skipped')
        run: exit 1
  github-release:
    # A release is published as verified, so it waits for the scorecard decision. A failed scorecard job holds it back; it never starts rollback.
    needs: [select, result, scorecard, scorecard-rerun, scorecard-final]
    if: ${{ !cancelled() && needs.result.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Publish verified production release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: production
          TARGET_SHA: ${{ fromJSON(needs.select.outputs.selection).selection.target_sha }}
          PREVIOUS_SHA: ${{ fromJSON(needs.select.outputs.selection).previous.target_sha }}
        run: python3 scripts/releases/publish_github_release.py
