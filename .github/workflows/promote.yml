name: Promote newest held nightly
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Select and verify exact artifacts without deploying
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  deployments: write
  id-token: write
concurrency:
  group: chalk-environment-production
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
      target_sha: ${{ steps.select.outputs.target_sha }}
      release_id: ${{ steps.select.outputs.release_id }}
      set_artifact_id: ${{ steps.select.outputs.set_artifact_id }}
      set_sha256: ${{ steps.select.outputs.set_sha256 }}
      manifest_artifact_id: ${{ steps.select.outputs.manifest_artifact_id }}
      manifest_sha256: ${{ steps.select.outputs.manifest_sha256 }}
      deployment_id: ${{ steps.select.outputs.deployment_id }}
      previous_run_id: ${{ steps.select.outputs.previous_run_id }}
      previous_target_sha: ${{ steps.select.outputs.previous_target_sha }}
      previous_release_id: ${{ steps.select.outputs.previous_release_id }}
      previous_set_artifact_id: ${{ steps.select.outputs.previous_set_artifact_id }}
      previous_set_sha256: ${{ steps.select.outputs.previous_set_sha256 }}
      previous_manifest_artifact_id: ${{ steps.select.outputs.previous_manifest_artifact_id }}
      previous_manifest_sha256: ${{ steps.select.outputs.previous_manifest_sha256 }}
      previous_deployment_id: ${{ steps.select.outputs.previous_deployment_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-tools
      - name: Pick newest available held nightly and verify rollback bytes
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CHALK_IMMUTABLE_REPLAY_READY: ${{ vars.CHALK_IMMUTABLE_REPLAY_READY }}
        run: python scripts/releases/release.py select
  approve:
    needs: select
    if: "!inputs.dry_run"
    runs-on: ubuntu-24.04
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CHALK_MANAGED_AWS_REGION: ${{ vars.CHALK_MANAGED_AWS_REGION }}
      CHALK_MANAGED_INSTANCE_ID: ${{ vars.CHALK_MANAGED_INSTANCE_ID }}
      CHALK_MANAGED_PARAMETER_PREFIX: ${{ vars.CHALK_MANAGED_PARAMETER_PREFIX }}
      CHALK_MANAGED_RECORDER_CONFIG_PARAMETER: ${{ vars.CHALK_MANAGED_RECORDER_CONFIG_PARAMETER }}
      CHALK_RELEASE_OBSERVER_DOCUMENT_NAME: ${{ vars.CHALK_RELEASE_OBSERVER_DOCUMENT_NAME }}
      CHALK_RELEASE_OBSERVER_DOCUMENT_VERSION: ${{ vars.CHALK_RELEASE_OBSERVER_DOCUMENT_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-tools
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CHALK_MANAGED_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CHALK_MANAGED_AWS_REGION }}
      - name: Resolve rollback bytes after approval
        env:
          RUN_ID: ${{ needs.select.outputs.previous_run_id }}
          TARGET_SHA: ${{ needs.select.outputs.previous_target_sha }}
          RELEASE_ID: ${{ needs.select.outputs.previous_release_id }}
          SET_ARTIFACT_ID: ${{ needs.select.outputs.previous_set_artifact_id }}
          SET_SHA256: ${{ needs.select.outputs.previous_set_sha256 }}
          MANIFEST_ARTIFACT_ID: ${{ needs.select.outputs.previous_manifest_artifact_id }}
          MANIFEST_SHA256: ${{ needs.select.outputs.previous_manifest_sha256 }}
        run: python scripts/releases/release.py resolve
      - name: Confirm the rollback set is what production currently serves
        run: python scripts/releases/observe.py --target production --release-set release-input/release-set.json
      - name: Recheck held record after protected-environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ needs.select.outputs.deployment_id }}
          SET_SHA256: ${{ needs.select.outputs.set_sha256 }}
        run: python scripts/releases/release.py recheck
  release:
    needs: [select, approve]
    uses: ./.github/workflows/ci.yml
    with:
      target_sha: ${{ needs.select.outputs.target_sha }}
      release_managed: false
      deploy_managed: true
      managed_environment: production
      deploy_web: true
      orchestrated: true
      manifest_run_id: ${{ needs.select.outputs.run_id }}
      manifest_artifact_id: ${{ needs.select.outputs.manifest_artifact_id }}
      manifest_sha256: ${{ needs.select.outputs.manifest_sha256 }}
      reuse_release_id: ${{ needs.select.outputs.release_id }}
      release_set_artifact_id: ${{ needs.select.outputs.set_artifact_id }}
      release_set_sha256: ${{ needs.select.outputs.set_sha256 }}
    secrets: inherit
  proof:
    needs: release
    uses: ./.github/workflows/real-call-proof.yml
    with:
      environment: production
      proofs: smoke transcript
    secrets: inherit
  observe:
    needs: [select, release, proof]
    if: always() && needs.release.result != 'skipped'
    uses: ./.github/workflows/release-observation.yml
    with:
      environment: production
      source_deployment_id: ${{ needs.select.outputs.deployment_id }}
      activated_at: ${{ needs.release.outputs.activated_at }}
      deploy_result: ${{ needs.release.result }}
      proof_result: ${{ needs.proof.result == 'success' && needs.proof.outputs.result || 'failed' }}
      run_id: ${{ needs.select.outputs.run_id }}
      target_sha: ${{ needs.select.outputs.target_sha }}
      release_id: ${{ needs.select.outputs.release_id }}
      set_artifact_id: ${{ needs.select.outputs.set_artifact_id }}
      set_sha256: ${{ needs.select.outputs.set_sha256 }}
      manifest_artifact_id: ${{ needs.select.outputs.manifest_artifact_id }}
      manifest_sha256: ${{ needs.select.outputs.manifest_sha256 }}
    secrets: inherit
  rollback:
    needs: [select, release, observe]
    if: >-
      always() && !inputs.dry_run && needs.release.result != 'skipped' &&
      (needs.release.result != 'success' || needs.observe.result != 'success')
    uses: ./.github/workflows/ci.yml
    with:
      release_managed: false
      deploy_managed: true
      managed_environment: production
      deploy_web: true
      orchestrated: true
      target_sha: ${{ needs.select.outputs.previous_target_sha }}
      manifest_run_id: ${{ needs.select.outputs.previous_run_id }}
      manifest_artifact_id: ${{ needs.select.outputs.previous_manifest_artifact_id }}
      manifest_sha256: ${{ needs.select.outputs.previous_manifest_sha256 }}
      reuse_release_id: ${{ needs.select.outputs.previous_release_id }}
      release_set_artifact_id: ${{ needs.select.outputs.previous_set_artifact_id }}
      release_set_sha256: ${{ needs.select.outputs.previous_set_sha256 }}
    secrets: inherit
  rollback-proof:
    needs: rollback
    uses: ./.github/workflows/real-call-proof.yml
    with:
      environment: production
      proofs: smoke transcript
    secrets: inherit
  rollback-observe:
    needs: [select, rollback, rollback-proof]
    if: always() && needs.rollback.result != 'skipped'
    uses: ./.github/workflows/release-observation.yml
    with:
      environment: production
      activated_at: ${{ needs.rollback.outputs.activated_at }}
      deploy_result: ${{ needs.rollback.result }}
      proof_result: ${{ needs.rollback-proof.result == 'success' && needs.rollback-proof.outputs.result || 'failed' }}
      run_id: ${{ needs.select.outputs.previous_run_id }}
      target_sha: ${{ needs.select.outputs.previous_target_sha }}
      release_id: ${{ needs.select.outputs.previous_release_id }}
      set_artifact_id: ${{ needs.select.outputs.previous_set_artifact_id }}
      set_sha256: ${{ needs.select.outputs.previous_set_sha256 }}
      manifest_artifact_id: ${{ needs.select.outputs.previous_manifest_artifact_id }}
      manifest_sha256: ${{ needs.select.outputs.previous_manifest_sha256 }}
    secrets: inherit
  result:
    needs: [release, observe, rollback, rollback-observe]
    if: always() && !inputs.dry_run
    runs-on: ubuntu-24.04
    steps:
      - name: A failed promotion stays failed even after a healthy rollback
        env:
          RELEASE: ${{ needs.release.result }}
          OBSERVATION: ${{ needs.observe.result }}
          ROLLBACK: ${{ needs.rollback.result }}
          ROLLBACK_OBSERVATION: ${{ needs.rollback-observe.result }}
        run: |
          printf 'Release=%s Proof/identity=%s Rollback=%s Rollback-proof=%s\n' "$RELEASE" "$OBSERVATION" "$ROLLBACK" "$ROLLBACK_OBSERVATION" >> "$GITHUB_STEP_SUMMARY"
          test "$RELEASE/$OBSERVATION" = success/success
