name: Promote newest held nightly
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: write
  id-token: write
concurrency:
  group: chalk-environment-production
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Choose newest held record and verify that exact choice and rollback source
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/releases/release.py select
  approve:
    needs: select
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      pages_deployment_id: ${{ steps.pages.outputs.pages_deployment_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recheck exact selection after approval under the production lock
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION: ${{ needs.select.outputs.selection }}
        run: python3 scripts/releases/release.py recheck
      - name: Save the live production Pages deployment before any upload
        id: pages
        env:
          CLOUDFLARE_ACCOUNT_ID: "5281943bd26d5bdcf4c3915606cd6bfb"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: chalk-web
        run: |
          python3 scripts/releases/web.py current
      - name: Retain rollback source and saved Pages identity
        env:
          SELECTION: ${{ needs.select.outputs.selection }}
          PAGES_ID: ${{ steps.pages.outputs.pages_deployment_id }}
        run: |
          jq -n --argjson source "$SELECTION" --arg pages "$PAGES_ID" '{source:$source, pages_deployment_id:$pages}' > rollback.json
          cat rollback.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-rollback-${{ github.run_attempt }}
          path: rollback.json
          retention-days: 365
  release:
    needs: [select, approve]
    uses: ./.github/workflows/ci.yml
    with:
      target_sha: ${{ fromJSON(needs.select.outputs.selection).selection.target_sha }}
      release_managed: false
      deploy_managed: true
      managed_environment: production
      deploy_web: true
      orchestrated: true
      manifest_run_id: ${{ fromJSON(needs.select.outputs.selection).selection.run_id }}
      manifest_artifact_id: ${{ fromJSON(needs.select.outputs.selection).selection.manifest_artifact_id }}
      manifest_sha256: ${{ fromJSON(needs.select.outputs.selection).selection.manifest_sha256 }}
      reuse_release_id: ${{ fromJSON(needs.select.outputs.selection).selection.release_id }}
      web_artifact: ${{ toJSON(fromJSON(needs.select.outputs.selection).selection.web.production) }}
    secrets: inherit
  proof:
    needs: release
    uses: ./.github/workflows/real-call-proof.yml
    with:
      environment: production
      proofs: smoke transcript
    secrets: inherit
  rollback:
    needs: [select, approve, release, proof]
    if: >-
      always() && needs.approve.result == 'success' && needs.release.result != 'skipped' &&
      (needs.release.result != 'success' || needs.proof.result != 'success' || needs.proof.outputs.result != 'passed')
    uses: ./.github/workflows/ci.yml
    with:
      target_sha: ${{ fromJSON(needs.select.outputs.selection).previous.target_sha }}
      release_managed: false
      deploy_managed: true
      managed_environment: production
      deploy_web: true
      orchestrated: true
      manifest_run_id: ${{ fromJSON(needs.select.outputs.selection).previous.run_id }}
      manifest_artifact_id: ${{ fromJSON(needs.select.outputs.selection).previous.manifest_artifact_id }}
      manifest_sha256: ${{ fromJSON(needs.select.outputs.selection).previous.manifest_sha256 }}
      reuse_release_id: ${{ fromJSON(needs.select.outputs.selection).previous.release_id }}
      pages_rollback_id: ${{ needs.approve.outputs.pages_deployment_id }}
    secrets: inherit
  result:
    needs: [select, approve, release, proof, rollback]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Failed promotion stays failed even after successful rollback
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
          PROOF_RESULT: ${{ needs.proof.result == 'success' && needs.proof.outputs.result || 'failed' }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
          SOURCE_RELEASE: ${{ fromJSON(needs.select.outputs.selection || '{}').selection.release_id }}
          APPLIED_RELEASE: ${{ needs.release.outputs.applied_release_id }}
          ROLLBACK_RELEASE: ${{ needs.rollback.outputs.applied_release_id }}
        run: |
          printf 'Source: %s\nApplied: %s\nRollback: %s (%s)\n' "$SOURCE_RELEASE" "$APPLIED_RELEASE" "$ROLLBACK_RELEASE" "$ROLLBACK_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ROLLBACK_RESULT" != skipped && "$ROLLBACK_RESULT" != success ]]; then
            echo 'ROLLBACK FAILED: manual recovery required' >&2
            exit 1
          fi
          test "$RELEASE_RESULT" = success && test "$PROOF_RESULT" = passed
