name: SFU bench reaper

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: chalk-sfu-bench-reaper
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reuse the DO token already used by the managed nightly deploy workflow.
    environment:
      name: nightly
      deployment: false
    steps:
      - name: Refuse non-master dispatch before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/master
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-doctl
      - name: Delete bench Droplets older than four hours
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DIGITALOCEAN_ACCESS_TOKEN" || { echo "Missing existing nightly DO token" >&2; exit 1; }
          features/media/sfu/scripts/bench/bench reap 4
      - name: Delete SSH keys of finished latency runs
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The latency lane names its key chalk-sfu-bench-latency-<run id>-<attempt> and deletes it itself; this covers a runner that died.
          doctl compute ssh-key list --format ID,Name --no-header | while read -r id name; do
            case "$name" in chalk-sfu-bench-latency-*) ;; *) continue ;; esac
            run=${name#chalk-sfu-bench-latency-}
            run=${run%%-*}
            status=$(gh run view "$run" --json status --jq .status 2> /dev/null || echo unknown)
            if [ "$status" = completed ]; then doctl compute ssh-key delete "$id" --force; fi
          done
