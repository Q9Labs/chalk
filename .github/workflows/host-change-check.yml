name: Host change check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      drill:
        description: Send one marked test notification to Oncall instead of checking the node.
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: host-change-check-${{ github.run_id }}

jobs:
  check:
    name: Check host changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .tool-versions
      - name: Assume the CloudTrail read role
        if: ${{ !inputs.drill }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.CHALK_HOST_CHANGE_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Read host calls and API starts, then notify Oncall
        env:
          CHALK_AXIOM_QUERY_TOKEN: ${{ secrets.CHALK_AXIOM_QUERY_TOKEN }}
          CHALK_AXIOM_LOG_DATASET: ${{ secrets.CHALK_AXIOM_LOG_DATASET }}
          ONCALL_WEBHOOK_URL: ${{ secrets.ONCALL_WEBHOOK_URL }}
          PRODUCTION_INSTANCE_ID: ${{ secrets.CHALK_PRODUCTION_INSTANCE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          HOST_CHANGE_CHECK_DRILL: ${{ inputs.drill }}
        run: node infrastructure/host-change-alert/host-change-check.mjs
