name: Recorder infrastructure contract

on:
  pull_request:
    paths:
      - "infrastructure/recorder/**"
      - "infrastructure/uptime-worker/src/**"
      - "scripts/recorder/**"
      - ".github/workflows/recorder-infrastructure.yml"
      - ".github/actions/setup-opentofu/**"
      - ".tool-versions"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recorder-infrastructure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate recorder IaC without provider mutation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.8.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up OpenTofu
        uses: ./.github/actions/setup-opentofu

      - name: Recorder contract gate
        run: pnpm run recorder:gate
