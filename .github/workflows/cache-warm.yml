name: Cache warm-up

# The merge queue tests every commit before it lands on master, so master pushes no longer run the Gate. Pull requests
# and queue groups can read caches only from master, so this job builds the Go packages once per push and saves the
# Go build cache under the keys the Gate jobs restore. The Gate's Metro cache is not saved any more; the mobile export
# starts cold when it runs.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: chalk-cache-warm
  cancel-in-progress: true

jobs:
  go:
    name: Warm Go caches
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/api/go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-api-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/**/*.go') }}
          restore-keys: go-api-${{ runner.os }}-

      # Compiles every package and test binary, with and without the race detector, without running any test.
      - name: Compile Go packages and tests
        working-directory: apps/api
        env:
          GOFLAGS: -buildvcs=false
        run: |
          go build ./...
          go test -vet=off -run '^$' ./...
          go test -race -vet=off -run '^$' ./...

      - name: Save root checks Go cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-root-checks-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/**/*.go') }}

      - name: Save API Go cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-api-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/**/*.go') }}

      - name: Save Sync Go cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-sync-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/**/*.go') }}

  tofu:
    name: Warm OpenTofu providers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OpenTofu
        uses: ./.github/actions/setup-opentofu

      - name: Save the pinned doctl download for deploys and rollbacks
        uses: ./.github/actions/setup-doctl

      # The managed deploy restores this cache and never saves it. This job saves it once, after both inits succeed.
      - name: Look for the managed deploy provider cache
        id: deploy-providers
        uses: ./.github/actions/cache-tofu-providers

      - name: Download the managed deploy providers
        if: steps.deploy-providers.outputs.cache-hit != 'true'
        run: |
          bash scripts/recorder/tofu-init.sh infrastructure/nightly/transcription
          bash scripts/recorder/tofu-init.sh infrastructure/opentofu/modules/aws-transcription-dispatcher

      - name: Save the managed deploy providers
        if: steps.deploy-providers.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ steps.deploy-providers.outputs.key }}

      - name: Check for a saved provider cache
        id: saved
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: tofu-providers-${{ runner.os }}-${{ hashFiles('infrastructure/recorder/.terraform.lock.hcl') }}
          lookup-only: true

      - name: Download providers
        if: steps.saved.outputs.cache-hit != 'true'
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          bash scripts/recorder/tofu-init.sh infrastructure/recorder

      - name: Save providers
        if: steps.saved.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: tofu-providers-${{ runner.os }}-${{ hashFiles('infrastructure/recorder/.terraform.lock.hcl') }}

  scanners:
    name: Warm scanner downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for saved scanner downloads
        id: saved
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/chalk-scanner-downloads
          key: scanner-downloads-${{ runner.os }}-${{ hashFiles('.github/actions/setup-scanners/action.yml') }}
          lookup-only: true

      - name: Download scanners
        if: steps.saved.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-scanners

      - name: Save scanner downloads
        if: steps.saved.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/chalk-scanner-downloads
          key: scanner-downloads-${{ runner.os }}-${{ hashFiles('.github/actions/setup-scanners/action.yml') }}

  sync:
    name: Warm Mix dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for saved Mix dependencies
        id: saved
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            apps/sync/deps
            apps/sync/_build
          key: sync-mix-${{ runner.os }}-${{ hashFiles('apps/sync/mix.lock') }}
          lookup-only: true

      - name: Set up Erlang and Elixir
        if: steps.saved.outputs.cache-hit != 'true'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      # Same fetch, retry and test-environment compile that apps/sync/scripts/gate.sh runs.
      - name: Fetch and compile Mix dependencies
        if: steps.saved.outputs.cache-hit != 'true'
        working-directory: apps/sync
        env:
          MIX_ENV: test
        run: |
          for delay in 10 30 0; do
            mix deps.get --check-locked && break
            ((delay)) || exit 1
            sleep "$delay"
          done
          mix compile

      - name: Save Mix dependencies
        if: steps.saved.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            apps/sync/deps
            apps/sync/_build
          key: sync-mix-${{ runner.os }}-${{ hashFiles('apps/sync/mix.lock') }}
