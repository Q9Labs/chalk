name: Retain audited recovery evidence
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: Base64-encoded JSON containing exact recovery evidence and checksums
        type: string
        required: true
permissions:
  contents: read
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and retain exact recovery bytes without deployment access
        id: evidence
        env:
          BUNDLE: ${{ inputs.bundle }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/releases')
          from release import retained_manifest, complete_production
          bundle = json.loads(base64.b64decode(os.environ['BUNDLE'], validate=True))
          decoded = {}
          for name, item in bundle.items():
              data = base64.b64decode(item['base64'], validate=True)
              assert hashlib.sha256(data).hexdigest() == item['sha256'], 'evidence checksum mismatch'
              decoded[name] = data
          manifest = json.loads(decoded['manifest'])
          release_id = manifest['release_id']
          assert re.fullmatch(r'[a-zA-Z0-9-]+', release_id), 'invalid release identity'
          retained_manifest(dict(target_sha=manifest['source_revision'], release_id=release_id,
                                 manifest_sha256=bundle['manifest']['sha256'],
                                 manifest_base64=bundle['manifest']['base64']))
          subprocess.run(['git', 'merge-base', '--is-ancestor', manifest['source_revision'], 'origin/master'], check=True)
          from media import validate_members
          validate_members(json.loads(decoded['media']))
          root = Path('recovery-evidence')
          root.mkdir()
          (root / (release_id + '.json')).write_bytes(decoded['manifest'])
          (root / (release_id + '.media.json')).write_bytes(decoded['media'])
          proof = root / 'original-successful-rollback-proof.json'
          proof.write_bytes(decoded['proof'])
          os.environ.update(RELEASE_ID=release_id, DEPLOYMENT_RESULT=str(proof), DEPLOYMENT_ID='VALIDATION-NO-WRITE')
          class Sink:
              def request(self, route, body):
                  assert route == 'deployments/VALIDATION-NO-WRITE/statuses'
                  assert body == {'state': 'success', 'auto_inactive': False}
          complete_production(Sink(), None)
          (root / 'fresh-host-verification.json').write_bytes(decoded['verification'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('release_id=' + release_id + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Exact recovery manifest, runtime media, original proof, and fresh host verification retained. No production access or mutation.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ steps.evidence.outputs.release_id }}
          path: recovery-evidence/
          retention-days: 90
          if-no-files-found: error
