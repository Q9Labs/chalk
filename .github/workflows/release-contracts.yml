name: Release contracts

# Release CI repeats the plan checks (check-contracts.sh --plan) before every deploy, so a change to the code those checks
# inspect needs no run here. This run adds what release CI does not: the workflow lint, the dispatcher and recorder image
# checks, the OpenTofu validation and the Podman cleanup contract. It runs when their inputs change.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/nightly.yml
      - .github/workflows/promote.yml
      - .github/workflows/npm-publish.yml
      - .github/workflows/real-call-proof.yml
      - .github/workflows/web-call-proof.yml
      - .github/workflows/release-contracts.yml
      - .github/actions/setup-opentofu/**
      - .github/actions/setup-doctl/**
      - .github/actions/cache-tofu-providers/**
      - scripts/releases/**
      - scripts/deploy/**
      - scripts/transcription-dispatcher/**
      - infrastructure/managed-episode/**
      - infrastructure/recorder/**
      - infrastructure/nightly/**
      - infrastructure/opentofu/modules/aws-transcription-dispatcher/**
      - infrastructure/opentofu/modules/cloudflare-r2-transcription-lifecycle/**
      - apps/transcription-dispatcher/**
      - .tool-versions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chalk-release-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  podman-image-cleanup:
    name: Podman 4.9 image cleanup contract
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Ubuntu's Podman
        run: |
          sudo apt-get update -qq
          version="$(apt-cache madison podman | awk '$3 ~ /^4[.]9[.]/{print $3; exit}')"
          test -n "$version"
          sudo apt-get install -y --allow-downgrades "podman=$version"
      - name: Run the rendered Quadlet units through Podman's generator
        run: bash infrastructure/managed-episode/scripts/test-quadlet-generator
      - name: Capture real storage behavior without cloud access
        shell: bash
        run: |
          set -o pipefail
          sudo bash infrastructure/managed-episode/scripts/test-podman-image-cleanup 2>&1 | tee "${RUNNER_TEMP}/podman-image-cleanup.log"
      - name: Keep the observed Podman trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: podman-image-cleanup-trace
          path: ${{ runner.temp }}/podman-image-cleanup.log
          retention-days: 7
          if-no-files-found: error
  contracts:
    name: Pre-deploy release contracts
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
      - uses: ./.github/actions/setup-opentofu
      - name: Install pinned workflow lint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check every release contract without cloud credentials
        run: scripts/releases/check-contracts.sh
      - name: Keep complete contract logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-contract-logs
          path: ${{ runner.temp }}/chalk-release-contracts
          retention-days: 7
          if-no-files-found: ignore
