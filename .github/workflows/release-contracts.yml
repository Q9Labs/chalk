name: Release contracts

# Release CI repeats the plan checks (check-contracts.sh --plan) before every deploy, so a change to the code those checks
# inspect needs no run here. This run adds what release CI does not: the workflow lint, the dispatcher and recorder image
# checks, the infrastructure validation and the Podman cleanup contract. It runs when their inputs change.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/**
      - .github/actionlint.yaml
      - .github/actions/setup-opentofu/**
      - .github/actions/setup-doctl/**
      - scripts/releases/**
      - scripts/deploy/**
      - scripts/transcription-dispatcher/**
      - infrastructure/**
      - apps/transcription-dispatcher/**
      - .tool-versions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chalk-release-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  podman-image-cleanup:
    name: Podman 4.9 image cleanup contract
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ubuntu's Podman
        run: |
          sudo apt-get update -qq
          version="$(apt-cache madison podman | awk '$3 ~ /^4[.]9[.]/{print $3; exit}')"
          test -n "$version"
          sudo apt-get install -y --allow-downgrades "podman=$version"
      - name: Check the database URL rule for each environment
        run: bash infrastructure/managed-episode/scripts/test-validate-database-url
      - name: Run the rendered Quadlet units through Podman's generator
        run: bash infrastructure/managed-episode/scripts/test-quadlet-generator
      - name: Capture real storage behavior without cloud access
        shell: bash
        run: |
          set -o pipefail
          sudo bash infrastructure/managed-episode/scripts/test-podman-image-cleanup 2>&1 | tee "${RUNNER_TEMP}/podman-image-cleanup.log"
      - name: Keep the observed Podman trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: podman-image-cleanup-trace
          path: ${{ runner.temp }}/podman-image-cleanup.log
          retention-days: 7
          if-no-files-found: error
  contracts:
    name: Pre-deploy release contracts
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: ./.github/actions/setup-js
        with:
          cache: "false"
          install: "false"
      - uses: ./.github/actions/setup-opentofu
      - name: Restore OpenTofu providers
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: tofu-providers-${{ runner.os }}-${{ hashFiles('infrastructure/recorder/.terraform.lock.hcl') }}
      - name: Use the OpenTofu provider cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
      - name: Restore pinned workflow lint
        id: actionlint-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/chalk-actionlint
          key: chalk-actionlint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}
      - name: Install pinned workflow lint
        run: |
          bin_dir="${HOME}/.cache/chalk-actionlint"
          mkdir -p "${bin_dir}"
          if [[ ! -x "${bin_dir}/actionlint" ]]; then
            GOBIN="${bin_dir}" go install "github.com/rhysd/actionlint/cmd/actionlint@v$(scripts/lib/tool-version.sh actionlint)"
          fi
          echo "${bin_dir}" >> "$GITHUB_PATH"
      - name: Check every release contract without cloud credentials
        run: scripts/releases/check-contracts.sh
      - name: Keep complete contract logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-contract-logs
          path: ${{ runner.temp }}/chalk-release-contracts
          retention-days: 7
          if-no-files-found: ignore
