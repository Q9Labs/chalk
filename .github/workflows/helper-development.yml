name: Helper development installers

on:
  workflow_dispatch:
    inputs:
      web_origin:
        description: Non-production Chalk web origin (leave blank for the offline fixture)
      api_origin:
        description: Matching API origin
      sync_origin:
        description: Matching Sync origin
      pair_ticket_public_key:
        description: Public Ed25519 ticket verification key (base64url)

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: macos-arm64
            bundle: app
            artifact: apps/helper/src-tauri/target/release/bundle/macos/Chalk-Helper-dev-arm64.zip
          - runner: windows-2025
            name: windows-x64
            bundle: nsis
            artifact: apps/helper/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check native dependency exclusions
        shell: bash
        run: |
          tree="$(cargo tree --locked --manifest-path src-tauri/Cargo.toml --prefix none --edges normal,build,dev)"
          if grep -Eq '^(glib|proc-macro-error|chrono) v' <<< "$tree"; then
            echo "::error::A dependency excluded from the Helper lockfile audit is compiled for this target."
            exit 1
          fi
      - name: Test the Helper
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features fixture
      - name: Build local development installer
        env:
          HELPER_BUNDLE: ${{ matrix.bundle }}
          CHALK_HELPER_WEB_ORIGIN: ${{ inputs.web_origin }}
          CHALK_HELPER_API_ORIGIN: ${{ inputs.api_origin }}
          CHALK_HELPER_SYNC_ORIGIN: ${{ inputs.sync_origin }}
          CHALK_HELPER_PAIR_TICKET_PUBLIC_KEY: ${{ inputs.pair_ticket_public_key }}
        shell: bash
        run: |
          if [[ -n "$CHALK_HELPER_WEB_ORIGIN$CHALK_HELPER_API_ORIGIN$CHALK_HELPER_SYNC_ORIGIN$CHALK_HELPER_PAIR_TICKET_PUBLIC_KEY" ]]; then
            : "${CHALK_HELPER_WEB_ORIGIN:?Required for a live development build}"
            : "${CHALK_HELPER_API_ORIGIN:?Required for a live development build}"
            : "${CHALK_HELPER_SYNC_ORIGIN:?Required for a live development build}"
            : "${CHALK_HELPER_PAIR_TICKET_PUBLIC_KEY:?Required for a live development build}"
          else
            unset CHALK_HELPER_WEB_ORIGIN CHALK_HELPER_API_ORIGIN CHALK_HELPER_SYNC_ORIGIN CHALK_HELPER_PAIR_TICKET_PUBLIC_KEY
          fi
          npx --yes @tauri-apps/cli@2.12.6 build --ci --bundles "$HELPER_BUNDLE" --features fixture
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent "Chalk Helper.app" Chalk-Helper-dev-arm64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chalk-helper-dev-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - name: Measure Chrome monitor capture on Windows
        if: runner.os == 'Windows'
        run: node probe/windows-chrome.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && runner.os == 'Windows'
        with:
          name: windows-monitor-capture
          path: apps/helper/windows-capture-result.json
          if-no-files-found: warn
