name: Nightly proofs

# Proves a cut on a throwaway stack. Each proof is a lane: its own arm runner boots Postgres, Redis, the cut's API and Sync
# images and a Chalk SFU built from the cut (scripts/nightly-stack), runs the proof against it, and throws everything away.
# Lanes share nothing, so they run side by side with no lease, and the first failed lane cancels the others.
on:
  workflow_call:
    inputs:
      release_sha:
        description: Full commit SHA of the cut
        required: true
        type: string
      release_id:
        description: Release whose manifest names the API and Sync images (image_source manifest)
        default: ""
        type: string
      proofs:
        description: Space-separated proofs, one lane each
        required: true
        type: string
      image_source:
        description: manifest pulls the cut's published images; build builds them from the revision (used to test this workflow)
        default: manifest
        type: string
    outputs:
      result:
        description: passed when every lane passed, failed otherwise
        value: ${{ jobs.proof.outputs.result }}
      failure:
        description: proof-failed when a lane failed, empty otherwise
        value: ${{ jobs.proof.outputs.failure }}
      results:
        description: One <proof>=passed|failed|not-run entry per lane
        value: ${{ jobs.proof.outputs.results }}
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA to prove (a branch revision is fine with image_source build)
        required: true
        type: string
      proofs:
        description: Space-separated proofs, one lane each
        default: camera-share
        type: string
      image_source:
        description: Build the images from the revision (a dispatch has no release to pull)
        default: build
        type: choice
        options: [build]

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      - name: List the lanes
        id: lanes
        env:
          PROOFS: ${{ inputs.proofs }}
        run: |
          set -euo pipefail
          [[ "$PROOFS" =~ ^[a-z-]+( [a-z-]+)*$ ]]
          echo "lanes=$(jq -cn --arg proofs "$PROOFS" '$proofs | split(" ")')" >> "$GITHUB_OUTPUT"

  lane:
    name: Prove ${{ matrix.proof }}
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    # The environment supplies the evidence recipient; a proof here makes no deployment.
    environment:
      name: nightly
      deployment: false
    strategy:
      fail-fast: true
      matrix:
        proof: ${{ fromJSON(needs.prepare.outputs.lanes) }}
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
      IMAGE_SOURCE: ${{ inputs.image_source }}
      PROOF: ${{ matrix.proof }}
    steps:
      - name: Refuse a pull of published images outside master
        if: inputs.image_source == 'manifest'
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/master
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the revision to be merged before dependency installation
        if: inputs.image_source == 'manifest'
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install proof dependencies
        run: pnpm install --frozen-lockfile --filter @q9labsai/chalk-client...
      - uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg imagemagick espeak fonts-dejavu-core age
      - name: Install ImageMagick 7 entry point
        run: |
          printf '#!/bin/sh\nif [ "$1" = montage ]; then shift; exec montage "$@"; fi\nexec convert "$@"\n' | sudo tee /usr/local/bin/magick > /dev/null
          sudo chmod +x /usr/local/bin/magick
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - name: Validate evidence recipient
        env:
          EVIDENCE_RECIPIENT: ${{ vars.CHALK_PROOF_EVIDENCE_RECIPIENT }}
        run: |
          test -n "$EVIDENCE_RECIPIENT" || { echo "Missing required variable CHALK_PROOF_EVIDENCE_RECIPIENT" >&2; exit 1; }
          printf '' | age --recipient "$EVIDENCE_RECIPIENT" --output /dev/null

      - name: Configure AWS credentials
        if: inputs.image_source == 'manifest'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.CHALK_IMAGE_PUBLISH_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Download the release manifest
        if: inputs.image_source == 'manifest'
        uses: ./.github/actions/download-sealed
        with:
          key: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
          name: release-manifest-${{ inputs.release_id }}
          path: ${{ runner.temp }}/manifest
          merge-multiple: true
      - name: Name the images
        id: images
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ECR_REGISTRY: ${{ secrets.CHALK_ECR_REGISTRY }}
        run: |
          set -euo pipefail
          if [ "$IMAGE_SOURCE" = manifest ]; then
            manifest="$RUNNER_TEMP/manifest/$RELEASE_ID.json"
            echo "api=$(jq -er '.images.api' "$manifest")" >> "$GITHUB_OUTPUT"
            echo "sync=$(jq -er '.images.sync' "$manifest")" >> "$GITHUB_OUTPUT"
            aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          else
            echo "api=stack-api" >> "$GITHUB_OUTPUT"
            echo "sync=stack-sync" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the images that the cut does not publish
        run: |
          set -euo pipefail
          # The Chalk SFU is built from the cut, so the proof runs its code. With image_source build, API and Sync are built too.
          docker build -q -f infrastructure/sfu/Dockerfile -t stack-sfu features/media/sfu > /dev/null &
          if [ "$IMAGE_SOURCE" = build ]; then
            docker build -q --build-context api_source=apps/api --build-context protocol_source=features/media/sfu/protocol \
              -f infrastructure/managed-episode/images/api.Dockerfile -t stack-api infrastructure/managed-episode > /dev/null &
            docker build -q --build-context sync_source=apps/sync -f infrastructure/managed-episode/images/sync.Dockerfile \
              -t stack-sync infrastructure/managed-episode > /dev/null &
          fi
          wait
      - name: Boot the stack
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          SYNC_IMAGE: ${{ steps.images.outputs.sync }}
        run: |
          bash scripts/nightly-stack/boot --api-image "$API_IMAGE" --sync-image "$SYNC_IMAGE" --sfu-image stack-sfu \
            --migration-target "$(grep -o '[0-9]\{14\}' apps/api/db/migrations/embed.go | head -1)" --dir "$RUNNER_TEMP/stack"
      - name: Keep private proof files in memory
        run: |
          mkdir -p .private /dev/shm/chalk-proof-private /dev/shm/chalk-proof-tmp
          chmod 700 /dev/shm/chalk-proof-private /dev/shm/chalk-proof-tmp
          sudo mount --bind /dev/shm/chalk-proof-private .private
          echo "TMPDIR=/dev/shm/chalk-proof-tmp" >> "$GITHUB_ENV"
      - name: Prove ${{ matrix.proof }}
        id: prove
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/stack/proof.env"
          set +a
          mkdir -p lane
          status=0
          start=$(date +%s)
          CHALK_PROOF_RUN_ID="nightly-$GITHUB_RUN_ID-$PROOF" pnpm prod:proof "$PROOF" || status=$?
          echo "$PROOF wall seconds: $(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 0 ]; then echo passed > "lane/$PROOF"; else echo failed > "lane/$PROOF"; fi
          exit "$status"
      - name: Say what the stack did when the proof failed
        if: failure()
        run: |
          for name in api sync sfu; do echo "== $name"; docker logs --tail 60 "chalk-stack-$name" 2>&1 | grep -v '"/v1/sync"' | cut -c1-1500; done
      - name: Encrypt private proof evidence
        if: always()
        env:
          EVIDENCE_RECIPIENT: ${{ vars.CHALK_PROOF_EVIDENCE_RECIPIENT }}
        run: |
          if [ -d .private/prod-proof ]; then
            mkdir -p .private/prod-proof-artifact
            tar -czf - -C .private prod-proof | age --recipient "$EVIDENCE_RECIPIENT" --output .private/prod-proof-artifact/evidence.tar.gz.age
          fi
      - name: Upload encrypted proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-proof-evidence-${{ matrix.proof }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .private/prod-proof-artifact/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
      - name: Upload the lane result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-lane-${{ matrix.proof }}
          path: lane/
          if-no-files-found: ignore
          retention-days: 1
      - name: Stop the stack
        if: always()
        run: bash scripts/nightly-stack/boot down

  proof:
    name: Proof result
    needs: [prepare, lane]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ steps.result.outputs.result }}
      failure: ${{ steps.result.outputs.failure }}
      results: ${{ steps.result.outputs.results }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nightly-lane-*
          path: lanes
          merge-multiple: true
      - name: Collect the lane results
        id: result
        env:
          LANES: ${{ needs.prepare.outputs.lanes }}
        run: |
          set -euo pipefail
          results=()
          failed=0
          for proof in $(jq -r '.[]' <<< "${LANES:-[]}"); do
            state=$(cat "lanes/$proof" 2> /dev/null || echo not-run)
            results+=("$proof=$state")
            [ "$state" = passed ] || failed=1
          done
          echo "results=${results[*]}" >> "$GITHUB_OUTPUT"
          echo "Proof results: ${results[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -eq 0 ] && [ "${#results[@]}" -gt 0 ]; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
            echo "failure=proof-failed" >> "$GITHUB_OUTPUT"
          fi
