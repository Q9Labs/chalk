name: Android nightly internal testing

on:
  workflow_run:
    workflows: [Cut nightly]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: chalk-android-internal-release
  cancel-in-progress: false
  queue: max

jobs:
  android:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: production-signing
    timeout-minutes: 120
    steps:
      - name: Confirm that a verified cut was recorded
        id: cut
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          result=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" --jq '.jobs[] | select(.name == "record") | .conclusion')
          if [[ "$result" == success ]]; then echo 'verified=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.cut.outputs.verified == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.cut.outputs.verified == 'true'
        with:
          version: 12.8.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.cut.outputs.verified == 'true'
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: steps.cut.outputs.verified == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: 1password/install-cli-action@9a0c9dd934086b7ab1d90115d455bda1c53c2bdb
        if: steps.cut.outputs.verified == 'true'
      - name: Install dependencies
        if: steps.cut.outputs.verified == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build and publish the verified revision to internal testing
        if: steps.cut.outputs.verified == 'true'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PLAY_CREDENTIALS: ${{ secrets.GPLAY_SERVICE_ACCOUNT_JSON }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash apps/mobile/scripts/release/publish-nightly-android.sh
