name: Android nightly internal testing

on:
  workflow_run:
    workflows: [Cut nightly]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: chalk-android-internal-release
  cancel-in-progress: false
  queue: max

jobs:
  android:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: production-signing
    timeout-minutes: 120
    steps:
      - name: Confirm that a verified cut was recorded
        id: cut
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          result=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" --jq '.jobs[] | select(.name == "record") | .conclusion')
          if [[ "$result" == success ]]; then echo 'verified=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cut.outputs.verified == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Skip when nothing in the app changed since the last release
        id: decide
        if: steps.cut.outputs.verified == 'true'
        env:
          PLAY_CREDENTIALS: ${{ secrets.GPLAY_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A cut that started before this script existed has the old publisher, which has no decide mode and would sign without credentials: build it as before.
          if [[ -f apps/mobile/scripts/release/nightly-app-paths.sh ]]; then bash apps/mobile/scripts/release/publish-nightly-android.sh decide; else echo 'build=true' >> "$GITHUB_OUTPUT"; fi
      - uses: ./.github/actions/setup-js
        if: steps.decide.outputs.build == 'true'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: steps.decide.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: 1password/install-cli-action@9a0c9dd934086b7ab1d90115d455bda1c53c2bdb # v2.0.2
        if: steps.decide.outputs.build == 'true'
      - name: Build and publish the verified revision to internal testing
        if: steps.decide.outputs.build == 'true'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PLAY_CREDENTIALS: ${{ secrets.GPLAY_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash apps/mobile/scripts/release/publish-nightly-android.sh publish
