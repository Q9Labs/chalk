name: Cut nightly
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: write
  id-token: write
concurrency:
  group: chalk-environment-nightly
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    permissions:
      contents: read
      actions: write
      deployments: write
    runs-on: ubuntu-24.04
    outputs:
      should_cut: ${{ steps.plan.outputs.should_cut }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
      transcribe: ${{ steps.plan.outputs.transcribe }}
      baseline_run_id: ${{ steps.plan.outputs.baseline_run_id }}
      baseline_artifact_id: ${{ steps.plan.outputs.baseline_artifact_id }}
      recorder_control: ${{ steps.plan.outputs.recorder_control }}
      previous_nightly_sha: ${{ steps.plan.outputs.previous_nightly_sha }}
    steps:
      - name: Refuse non-master dispatch before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/master
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Pin green master and select the current release baseline
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=()
          if [[ "$MANUAL" == true ]]; then args+=(--manual); fi
          python3 scripts/releases/release.py plan "${args[@]}"
  release:
    permissions:
      contents: write # The managed deploy takes the shared staging-SFU lease.
      actions: read
      deployments: write
      id-token: write
    needs: plan
    if: needs.plan.outputs.should_cut == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      target_sha: ${{ needs.plan.outputs.target_sha }}
      managed_environment: nightly
      release_managed: true
      deploy_managed: true
      deploy_web: true
      orchestrated: true
      stable_manifest_run_id: ${{ needs.plan.outputs.baseline_run_id }}
      stable_manifest_artifact_id: ${{ needs.plan.outputs.baseline_artifact_id }}
      enable_recorder_control: ${{ needs.plan.outputs.recorder_control == 'true' }}
    secrets: inherit
  proof:
    # The gate. It proves a real call on the own SFU (chalk_sfu) for the cut's revision: the call, its Recording,
    # export and Transcript, and a long call across media-access refreshes. The staging lease serializes it with
    # every other lane that drives the staging SFU, and a lease that stays busy fails the gate by name
    # (staging-sfu-lease-timeout, shown on the run and again by `record`).
    permissions:
      contents: write # Shared staging-SFU Git-ref lease.
    needs: [plan, release]
    uses: ./.github/workflows/real-call-proof.yml
    with:
      environment: nightly
      # long-call holds one call for about 11 minutes across media-access refreshes; nightly only.
      proofs: camera-share call-artifacts long-call
      media_plane: chalk_sfu
      # Only the first cut of a UTC day pays for a Transcript (the plan decides); every cut still records and checks the call.
      transcribe: ${{ needs.plan.outputs.transcribe == 'true' }}
      release_sha: ${{ needs.plan.outputs.target_sha }}
      scorecard_label: proof
    secrets: inherit
  web-e2e:
    needs: [release, proof]
    permissions:
      contents: write # Shared staging-SFU Git-ref lease.
    uses: ./.github/workflows/web-call-proof.yml
    with:
      environment: nightly
      media_plane: chalk_sfu
    secrets: inherit
  record:
    needs: [plan, release, proof, web-e2e, scorecard]
    if: always() && needs.plan.outputs.should_cut == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Record held or failed cut without rolling nightly back
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          TRANSCRIBE: ${{ needs.plan.outputs.transcribe }}
          RELEASE: ${{ toJSON(needs.release.outputs) }}
          DEPLOY_RESULT: ${{ needs.release.result }}
          # The gate is the chalk_sfu proof job; a lease timeout is named in PROOF_FAILURE.
          PROOF_RESULT: ${{ needs.proof.result == 'success' && needs.proof.outputs.result || 'failed' }}
          PROOF_FAILURE: ${{ needs.proof.outputs.failure }}
          PROOF_RESULTS: ${{ needs.proof.outputs.results }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result == 'success' && needs.web-e2e.outputs.result || 'failed' }}
          # Staging latency runs in staging-sfu-latency.yml; Promote reads its verdict for this SHA next to this one.
          OWN_SFU_RESULT: ${{ needs.proof.outputs.result == 'passed' && 'passed' || 'failed' }}
          SCORECARD_RESULT: ${{ needs.scorecard.outputs.result }}
        run: |
          python3 scripts/releases/release.py record
          if [ "$DEPLOY_RESULT" = success ] && [ "$PROOF_RESULT" != passed ]; then
            echo "::error title=Nightly gate failed: chalk_sfu proof::The chalk_sfu proof did not pass (${PROOF_FAILURE:-proof-failed}), so this cut is held. Results: ${PROOF_RESULTS:-none recorded}"
            echo "Proof results: ${PROOF_RESULTS:-none recorded}" >> "$GITHUB_STEP_SUMMARY"
          fi
          test "$DEPLOY_RESULT" = success && test "$PROOF_RESULT" = passed && test "$WEB_E2E_RESULT" = passed
  github-release:
    needs: [plan, record]
    if: needs.plan.outputs.should_cut == 'true' && needs.record.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Publish verified nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: nightly
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          PREVIOUS_SHA: ${{ needs.plan.outputs.previous_nightly_sha }}
        run: python3 scripts/releases/publish_github_release.py
  scorecard:
    # Slow or failed runs matter most to the trend, so this job runs whether or not the cut was released.
    needs: [plan, proof]
    if: always() && needs.plan.outputs.should_cut == 'true'
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ steps.evaluate.outputs.result }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
      - name: Download the nightly scorecards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scorecard-nightly-*
          path: artifacts/nightly
          merge-multiple: true
      - name: Evaluate gated budgets for this exact cut
        id: evaluate
        env:
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
        run: |
          mapfile -t cards < <(find artifacts/nightly -name "scorecard-*.json")
          node features/scorecard/evaluate.mjs --latency-deferred "$TARGET_SHA" "$GITHUB_RUN_ID" "${cards[@]}"
      - name: Score the nightly run and add it to the history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCORECARD_KEEP_ISSUE: "true"
        run: |
          cards=$(find artifacts/nightly -name "scorecard-*.json" 2> /dev/null || true)
          if [ -z "$cards" ]; then
            echo "No nightly scorecard in this run."
            exit 0
          fi
          # shellcheck disable=SC2086
          features/scorecard/nightly.sh $cards
