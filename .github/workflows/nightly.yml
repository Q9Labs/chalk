name: Cut nightly
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: write
  id-token: write
concurrency:
  group: chalk-environment-nightly
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    permissions:
      contents: read
      actions: write
      deployments: write
    runs-on: ubuntu-24.04
    outputs:
      should_cut: ${{ steps.plan.outputs.should_cut }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
      baseline_run_id: ${{ steps.plan.outputs.baseline_run_id }}
      baseline_artifact_id: ${{ steps.plan.outputs.baseline_artifact_id }}
      recorder_control: ${{ steps.plan.outputs.recorder_control }}
      previous_nightly_sha: ${{ steps.plan.outputs.previous_nightly_sha }}
    steps:
      - name: Refuse non-master dispatch before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/master
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Pin green master and select the current release baseline
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=()
          if [[ "$MANUAL" == true ]]; then args+=(--manual); fi
          python3 scripts/releases/release.py plan "${args[@]}"
  release:
    needs: plan
    if: needs.plan.outputs.should_cut == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      target_sha: ${{ needs.plan.outputs.target_sha }}
      managed_environment: nightly
      release_managed: true
      deploy_managed: true
      deploy_web: true
      orchestrated: true
      stable_manifest_run_id: ${{ needs.plan.outputs.baseline_run_id }}
      stable_manifest_artifact_id: ${{ needs.plan.outputs.baseline_artifact_id }}
      enable_recorder_control: ${{ needs.plan.outputs.recorder_control == 'true' }}
    secrets: inherit
  proof:
    permissions:
      contents: read
    needs: [plan, release]
    uses: ./.github/workflows/real-call-proof.yml
    with:
      environment: nightly
      proofs: leave smoke transcript
      release_sha: ${{ needs.plan.outputs.target_sha }}
    secrets: inherit
  own-sfu:
    permissions:
      contents: write # Shared staging-SFU Git-ref lease.
    # Promote requires this result, but it does not change whether the nightly cut is held.
    # The proof cleans up its Spaces and Episodes in every outcome.
    needs: [plan, release]
    if: needs.release.result == 'success'
    uses: ./.github/workflows/real-call-proof.yml
    with:
      environment: nightly
      proofs: camera-share
      media_plane: chalk_sfu
      latency: true
      release_sha: ${{ needs.plan.outputs.target_sha }}
      scorecard_label: chalk_sfu
    secrets: inherit
  cf-sfu-latency:
    permissions:
      contents: read
    # Cloudflare's action latency from the same runner and kit as own-sfu, for comparison. It runs after own-sfu so its
    # API traffic is not in the own-SFU contention window, and it never holds the cut: record does not need it.
    # The job and step timeouts are the 50 and 25 minutes of every other plane; 20 cycles take about 15.
    needs: [plan, release, own-sfu]
    if: always() && needs.release.result == 'success'
    uses: ./.github/workflows/real-call-proof.yml
    with:
      environment: nightly
      media_plane: cf_sfu
      latency: true
      latency_only: true
      release_sha: ${{ needs.plan.outputs.target_sha }}
      scorecard_label: cf_sfu
    secrets: inherit
  web-e2e:
    needs: [release, proof]
    uses: ./.github/workflows/web-call-proof.yml
    with:
      environment: nightly
    secrets: inherit
  record:
    needs: [plan, release, proof, own-sfu, web-e2e, scorecard]
    if: always() && needs.plan.outputs.should_cut == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Record held or failed cut without rolling nightly back
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          RELEASE: ${{ toJSON(needs.release.outputs) }}
          DEPLOY_RESULT: ${{ needs.release.result }}
          PROOF_RESULT: ${{ needs.proof.result == 'success' && needs.proof.outputs.result || 'failed' }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result == 'success' && needs.web-e2e.outputs.result || 'failed' }}
          # The shared job includes proof and latency: a failed latency measurement intentionally blocks promotion.
          OWN_SFU_RESULT: ${{ needs.own-sfu.result == 'skipped' && 'skipped' || needs.own-sfu.result == 'success' && needs.own-sfu.outputs.result || 'failed' }}
          SCORECARD_RESULT: ${{ needs.scorecard.outputs.result }}
        run: |
          python3 scripts/releases/release.py record
          test "$DEPLOY_RESULT" = success && test "$PROOF_RESULT" = passed && test "$WEB_E2E_RESULT" = passed
  github-release:
    needs: [plan, record]
    if: needs.plan.outputs.should_cut == 'true' && needs.record.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Publish verified nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: nightly
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          PREVIOUS_SHA: ${{ needs.plan.outputs.previous_nightly_sha }}
        run: python3 scripts/releases/publish_github_release.py
  scorecard:
    # Slow or failed runs matter most to the trend, so this job runs whether or not the cut was released.
    needs: [plan, proof, own-sfu, cf-sfu-latency]
    if: always() && needs.plan.outputs.should_cut == 'true'
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ steps.evaluate.outputs.result }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
      - name: Download the nightly scorecards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scorecard-nightly-*
          path: artifacts/nightly
          merge-multiple: true
      - name: Evaluate gated budgets for this exact cut
        id: evaluate
        env:
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
        run: |
          mapfile -t cards < <(find artifacts/nightly -name "scorecard-*.json")
          node features/scorecard/evaluate.mjs "$TARGET_SHA" "$GITHUB_RUN_ID" "${cards[@]}"
      - name: Score the nightly run and add it to the history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cards=$(find artifacts/nightly -name "scorecard-*.json" 2> /dev/null || true)
          if [ -z "$cards" ]; then
            echo "No nightly scorecard in this run."
            exit 0
          fi
          # shellcheck disable=SC2086
          features/scorecard/nightly.sh $cards
