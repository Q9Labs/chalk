name: Cut nightly
on:
  # A green Gate on master starts a cut at once; the hourly run is the safety net for a cut the 6-hour gap deferred.
  workflow_run:
    workflows: [Gate]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: write
  id-token: write
concurrency:
  group: chalk-environment-nightly
  cancel-in-progress: false
jobs:
  plan:
    # A Gate run that did not pass on master cuts nothing.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: write
      deployments: write
    runs-on: ubuntu-24.04
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
    outputs:
      should_cut: ${{ steps.plan.outputs.should_cut }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
      transcribe: ${{ steps.plan.outputs.transcribe }}
      baseline_run_id: ${{ steps.plan.outputs.baseline_run_id }}
      baseline_artifact_id: ${{ steps.plan.outputs.baseline_artifact_id }}
      recorder_control: ${{ steps.plan.outputs.recorder_control }}
      previous_nightly_sha: ${{ steps.plan.outputs.previous_nightly_sha }}
      recording_changed: ${{ steps.plan.outputs.recording_changed }}
    steps:
      - name: Refuse non-master dispatch before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/master
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Pin green master and select the current release baseline
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=()
          if [[ "$MANUAL" == true ]]; then args+=(--manual); fi
          python3 scripts/releases/release.py plan "${args[@]}"
  release:
    # Builds the cut once: the API and Sync images, the media archives and both web archives. Nothing is deployed; the proof
    # lanes run these images on a throwaway stack, and Promote ships the same bytes.
    permissions:
      contents: write # ci.yml's deploy job asks for it, and a caller must grant what a called workflow declares.
      actions: read
      deployments: write
      id-token: write
    needs: plan
    if: needs.plan.outputs.should_cut == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      target_sha: ${{ needs.plan.outputs.target_sha }}
      managed_environment: nightly
      release_managed: true
      deploy_managed: false
      build_web: true
      orchestrated: true
      # `plan` above required the target's green master Gate; the release does not wait for a runner to repeat it.
      gate_checked: true
      stable_manifest_run_id: ${{ needs.plan.outputs.baseline_run_id }}
      stable_manifest_artifact_id: ${{ needs.plan.outputs.baseline_artifact_id }}
      enable_recorder_control: ${{ needs.plan.outputs.recorder_control == 'true' }}
    secrets: inherit
  proof:
    # The gate. Each proof is a lane on its own runner with its own throwaway stack (scripts/nightly-stack), so the lanes
    # run side by side and the first failed lane cancels the rest. The web call proof is one of them.
    permissions:
      contents: read
      id-token: write
    needs: [plan, release]
    uses: ./.github/workflows/nightly-proofs.yml
    with:
      release_sha: ${{ needs.plan.outputs.target_sha }}
      release_id: ${{ needs.release.outputs.release_id }}
      proofs: camera-share long-call chat-upload leave-chalk-sfu latency-smoke web-call
      image_source: manifest
    secrets: inherit
  record:
    needs: [plan, release, proof, scorecard]
    if: always() && needs.plan.outputs.should_cut == 'true'
    runs-on: ubuntu-24.04
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Record the held or failed cut
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          TRANSCRIBE: ${{ needs.plan.outputs.transcribe }}
          RELEASE: ${{ toJSON(needs.release.outputs) }}
          RELEASE_RESULT: ${{ needs.release.result }}
          # The gate is the proof job: every lane, the web call included.
          PROOF_RESULT: ${{ needs.proof.result == 'success' && needs.proof.outputs.result || 'failed' }}
          PROOF_FAILURE: ${{ needs.proof.outputs.failure }}
          PROOF_RESULTS: ${{ needs.proof.outputs.results }}
          SCORECARD_RESULT: ${{ needs.scorecard.outputs.result }}
        run: |
          python3 scripts/releases/release.py record
          if [ "$RELEASE_RESULT" = success ] && [ "$PROOF_RESULT" != passed ]; then
            echo "::error title=Nightly gate failed::A proof lane did not pass (${PROOF_FAILURE:-proof-failed}), so this cut is held. Results: ${PROOF_RESULTS:-none recorded}"
            echo "Proof results: ${PROOF_RESULTS:-none recorded}" >> "$GITHUB_STEP_SUMMARY"
          fi
          test "$RELEASE_RESULT" = success && test "$PROOF_RESULT" = passed
  github-release:
    needs: [plan, record]
    if: needs.plan.outputs.should_cut == 'true' && needs.record.result == 'success'
    runs-on: ubuntu-24.04
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Publish verified nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: nightly
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          PREVIOUS_SHA: ${{ needs.plan.outputs.previous_nightly_sha }}
        run: python3 scripts/releases/publish_github_release.py
  scorecard:
    # Slow or failed runs matter most to the trend, so this job runs whether or not the cut was released.
    needs: [plan, proof]
    if: always() && needs.plan.outputs.should_cut == 'true'
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ steps.evaluate.outputs.result }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
      - name: Download the nightly scorecards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scorecard-nightly-*
          path: artifacts/nightly
          merge-multiple: true
      - name: Evaluate gated budgets for this exact cut
        id: evaluate
        env:
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
        run: |
          mapfile -t cards < <(find artifacts/nightly -name "scorecard-*.json")
          node features/scorecard/evaluate.mjs --latency-deferred "$TARGET_SHA" "$GITHUB_RUN_ID" "${cards[@]}"
      - name: Score the nightly run and add it to the history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCORECARD_KEEP_ISSUE: "true"
        run: |
          cards=$(find artifacts/nightly -name "scorecard-*.json" 2> /dev/null || true)
          if [ -z "$cards" ]; then
            echo "No nightly scorecard in this run."
            exit 0
          fi
          # shellcheck disable=SC2086
          features/scorecard/nightly.sh $cards
