name: Cloudflare egress check

on:
  pull_request:
    paths:
      - infrastructure/cloudflare-egress-alert/**
      - .github/workflows/cloudflare-egress-check.yml
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      drill:
        description: Send one marked test notification to Oncall instead of checking limits.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Egress check tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .tool-versions
      - run: node --test infrastructure/cloudflare-egress-alert/egress-check.test.mjs

  check:
    name: Check SFU and TURN egress
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .tool-versions
      - name: Read egress and notify Oncall
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          ONCALL_WEBHOOK_URL: ${{ secrets.ONCALL_WEBHOOK_URL }}
          EGRESS_CHECK_DRILL: ${{ inputs.drill }}
        run: node infrastructure/cloudflare-egress-alert/egress-check.mjs
