name: Nightly latency

# Chalk SFU action latency for the newest held cut, measured at the full 60 cycles on a Chalk SFU host that this run creates and
# deletes (nightly-proofs.yml, lane `latency`), so no other run shares it and nothing needs a lease. It runs only when no passed
# latency record covers the cut: a record covers a cut whose SHA descends from the measured one with no latency path changed
# since (features.json `media`, the latency kit and the stack; see release.py latency_paths). Promote reads the record and
# refuses a cut with changed latency paths and no covering record (chalk_sfu_proof_result=latency-missing).
# Cost: one s-2vcpu-2gb DigitalOcean host for about 55 minutes, about 0.05 USD, plus about 60 free runner minutes.
on:
  workflow_run:
    workflows: [Cut nightly]
    types: [completed]
  workflow_dispatch:
    inputs:
      samples:
        description: Latency cycles, 1 to 60. Fewer give a weaker p95; use it to try the workflow, not to promote
        type: string
        default: "60"

permissions: {}

concurrency:
  group: chalk-nightly-latency-run
  cancel-in-progress: false

jobs:
  target:
    name: Find the cut to measure
    runs-on: ubuntu-24.04
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Refuse non-master dispatch before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/master
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/releases/release.py latency_target
  latency:
    needs: target
    if: needs.target.outputs.sha != ''
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/nightly-proofs.yml
    with:
      release_sha: ${{ needs.target.outputs.sha }}
      proofs: latency
      image_source: build
      latency_samples: ${{ inputs.samples || '60' }}
    secrets: inherit
  record:
    # Slow or failed runs matter most to the trend, so this job scores whatever card exists and records the verdict.
    needs: [target, latency]
    if: always() && needs.target.outputs.sha != ''
    runs-on: ubuntu-24.04
    env:
      CHALK_RELEASE_SEAL_KEY: ${{ secrets.CHALK_RELEASE_SEAL_KEY }}
    timeout-minutes: 20
    permissions:
      contents: write
      deployments: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
      - name: Download the latency card
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scorecard-nightly-latency
          path: artifacts/nightly
          merge-multiple: true
      - name: Evaluate gated budgets for the measured SHA
        id: evaluate
        env:
          TARGET_SHA: ${{ needs.target.outputs.sha }}
        run: |
          mapfile -t cards < <(find artifacts/nightly -name "scorecard-*.json")
          node features/scorecard/evaluate.mjs "$TARGET_SHA" "$GITHUB_RUN_ID" "${cards[@]}"
      - name: Score the run and add it to the history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cards=$(find artifacts/nightly -name "scorecard-*.json" 2> /dev/null || true)
          if [ -z "$cards" ]; then
            echo "No latency scorecard in this run."
            exit 0
          fi
          # shellcheck disable=SC2086
          features/scorecard/nightly.sh $cards
      - name: Record the verdict for Promote
        # A run with fewer samples than the full 60 is a trial and records nothing.
        if: always() && (inputs.samples || '60') == '60'
        env:
          GH_TOKEN: ${{ github.token }}
          LATENCY_SAMPLES: ${{ inputs.samples || '60' }}
          TARGET_SHA: ${{ needs.target.outputs.sha }}
          LATENCY_RESULT: ${{ needs.latency.result == 'success' && needs.latency.outputs.result || 'failed' }}
          SCORECARD_RESULT: ${{ steps.evaluate.outputs.result }}
        run: python3 scripts/releases/release.py record_latency
