name: Release observation
on:
  workflow_call:
    inputs:
      run_id:
        type: string
        default: ""
      target_sha:
        type: string
        default: ""
      release_id:
        type: string
        default: ""
      set_artifact_id:
        type: string
        default: ""
      set_sha256:
        type: string
        default: ""
      manifest_artifact_id:
        type: string
        default: ""
      manifest_sha256:
        type: string
        default: ""
      environment:
        type: string
        default: ""
      proof_result:
        type: string
        default: ""
      deploy_result:
        type: string
        default: ""
      activated_at:
        type: string
        default: ""
      attempt_id:
        type: string
        default: ""
      source_deployment_id:
        type: string
        default: ""
    outputs:
      served_matches:
        value: ${{ jobs.observe.outputs.served_matches }}
permissions:
  contents: read
  actions: read
  deployments: write
  id-token: write
jobs:
  observe:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    outputs:
      served_matches: ${{ steps.observe.outputs.served_matches }}
    env:
      GH_TOKEN: ${{ github.token }}
      CHALK_MANAGED_AWS_REGION: ${{ vars.CHALK_MANAGED_AWS_REGION }}
      CHALK_MANAGED_PARAMETER_PREFIX: ${{ vars.CHALK_MANAGED_PARAMETER_PREFIX }}
      CHALK_RELEASE_OBSERVER_DOCUMENT_NAME: ${{ vars.CHALK_RELEASE_OBSERVER_DOCUMENT_NAME }}
      CHALK_RELEASE_OBSERVER_DOCUMENT_VERSION: ${{ vars.CHALK_RELEASE_OBSERVER_DOCUMENT_VERSION }}
      CHALK_MANAGED_INSTANCE_ID: ${{ vars.CHALK_MANAGED_INSTANCE_ID }}
      CHALK_MANAGED_RECORDER_CONFIG_PARAMETER: ${{ vars.CHALK_MANAGED_RECORDER_CONFIG_PARAMETER }}
      RUN_ID: ${{ inputs.run_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      RELEASE_ID: ${{ inputs.release_id }}
      SET_ARTIFACT_ID: ${{ inputs.set_artifact_id }}
      SET_SHA256: ${{ inputs.set_sha256 }}
      MANIFEST_ARTIFACT_ID: ${{ inputs.manifest_artifact_id }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-tools
      - name: Resolve the pinned release set
        if: inputs.deploy_result == 'success'
        run: python scripts/releases/release.py resolve
      - uses: aws-actions/configure-aws-credentials@v4
        if: inputs.deploy_result == 'success'
        with:
          role-to-assume: ${{ vars.CHALK_MANAGED_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CHALK_MANAGED_AWS_REGION }}
      - name: Check served identities after the call
        id: observe
        if: inputs.deploy_result == 'success' && inputs.proof_result == 'passed'
        env:
          RELEASE_TARGET: ${{ inputs.environment }}
        run: python scripts/releases/observe.py --target "$RELEASE_TARGET" --release-set release-input/release-set.json
      - name: Record held or failed, never infer success from a skipped proof
        if: always()
        env:
          RELEASE_TARGET: ${{ inputs.environment }}
          PROOF_RESULT: ${{ inputs.proof_result || 'failed' }}
          DEPLOY_RESULT: ${{ inputs.deploy_result }}
          ACTIVATED_AT: ${{ inputs.activated_at }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          SOURCE_DEPLOYMENT_ID: ${{ inputs.source_deployment_id }}
          SERVED_MATCHES: ${{ steps.observe.outputs.served_matches || 'false' }}
        run: |
          if [[ -n "$SET_ARTIFACT_ID" ]]; then
            python scripts/releases/release.py record --environment "$RELEASE_TARGET"
          elif [[ -n "$ATTEMPT_ID" ]]; then
            python - <<'PYTHON'
          import os, sys
          sys.path.insert(0, 'scripts/releases')
          from github_release import GitHub
          GitHub().status(os.environ['ATTEMPT_ID'], 'failure')
          PYTHON
          fi
      - name: Fail the observation when release or proof did not pass
        if: always()
        env:
          DEPLOY_RESULT: ${{ inputs.deploy_result }}
          PROOF_RESULT: ${{ inputs.proof_result }}
          SERVED_MATCHES: ${{ steps.observe.outputs.served_matches }}
        run: test "$DEPLOY_RESULT/$PROOF_RESULT/$SERVED_MATCHES" = success/passed/true
