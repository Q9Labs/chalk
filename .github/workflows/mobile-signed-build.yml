name: Signed mobile release builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: chalk-mobile-signed-build
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  android:
    if: (inputs.platform == 'all' || inputs.platform == 'android') && github.ref == 'refs/heads/master'
    name: Signed Android bundle
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-js

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@9a0c9dd934086b7ab1d90115d455bda1c53c2bdb # v2.0.2

      - name: Build and verify signed Android bundle
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: apps/mobile/scripts/release/build-signed-android.sh

      - name: Preserve signed Android evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chalk-android-signed
          path: apps/mobile/build/releases/*.aab
          if-no-files-found: warn
          retention-days: 14

  ios:
    if: (inputs.platform == 'all' || inputs.platform == 'ios') && github.ref == 'refs/heads/master'
    name: Signed iOS archive
    runs-on: macos-26
    environment: production-signing
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-js

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@9a0c9dd934086b7ab1d90115d455bda1c53c2bdb # v2.0.2

      # CocoaPods reads the embedded whiteboard bundle, and the Release archive bundles the workspace SDKs from their built dist.
      - name: Build workspace SDKs
        run: pnpm --filter @q9labsai/chalk-mobile run prepare:native-dependencies

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile
        run: pod install --project-directory=ios

      - name: Build and verify signed iOS archive
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: apps/mobile/scripts/release/build-signed-ios.sh

      - name: Preserve signed iOS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chalk-ios-signed
          path: |
            apps/mobile/build/releases/*.ipa
            apps/mobile/build/releases/*-dsyms.zip
          if-no-files-found: warn
          retention-days: 14
