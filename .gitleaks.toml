title = "Chalk gitleaks policy"

# Without this, gitleaks loads no rules from this file and every scan passes.
[extend]
useDefault = true

[[allowlists]]
description = "Local mobile/app credentials and generated artifacts are not part of the public gate surface."
paths = ['''^apps/mobile/\.gplay/''', '''^apps/mobile/android/app/keystore\.properties$''', '''^apps/mobile/ios/Pods/''', '''^apps/web/\.dev\.vars$''', '''^packages/.*/dist/''']

[[allowlists]]
description = "Checked-in tests and API docs use obvious placeholder credentials."
paths = ['''^apps/docs/src/content/docs/api/authentication\.mdx$''', '''_test\.go$''', '''\.test\.ts$''', '''\.test\.tsx$''']

# The next two exceptions match whole lines and name no path, because `gitleaks dir` skips every file
# that an allowlist path matches, even when the allowlist also needs a line match. gitleaks starts each
# line with the newline before it, so each pattern opens with `^\s*`.
[[allowlists]]
description = "The Space page test helpers use one placeholder capability token."
regexTarget = "line"
regexes = ['''^\s*export const spacePageTestToken = "cspi1\.test-capability";$''']

[[allowlists]]
description = "The release manifest records file hashes and 1Password item IDs, not the secrets themselves."
regexTarget = "line"
# The line must hold only one such field in its exact format: a 1Password item ID, a SHA-256 hash, or a
# certificate fingerprint. A secret on the same line, or in the field's place, still fails.
regexes = ['''^\s*"[a-z0-9_]+_(?:item_id": "[a-z0-9]{26}|sha256": "(?:[0-9a-f]{64}|(?:[0-9A-F]{2}:){31}[0-9A-F]{2}))",?$''']
