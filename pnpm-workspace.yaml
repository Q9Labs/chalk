# Allow q9stack GitHub release tarballs until they are published to npm.
blockExoticSubdeps: false

# Preserve the dependency scripts skipped by pnpm 10; keep strict build checks.
allowBuilds:
  "@ast-grep/cli": true
  tsc-rs: true
  "@parcel/watcher": false
  esbuild: false
  lefthook: false
  msgpackr-extract: false
  msw: false
  workerd: false

# Production deploy subsets can omit root-only patched packages; patch failures still fail.
allowUnusedPatches: true

# New package from our own q9stack release; remove once it is a day old.
minimumReleaseAgeExclude:
  - "@q9labsai/gates@0.4.1"
